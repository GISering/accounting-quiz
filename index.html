    let ta=0,tc=0; dk.forEach(k=>{ ta+=daily[k].answered||0; tc+=daily[k].correct||0; });
    const acc=ta?Math.round(tc/ta*100):0; const streak=calcStreak(daily);
    const de=document.createElement('div'); de.className='chapter ch-achv';
    de.innerHTML='<div class="ch-main" onclick="openAchieve()">'+
      '<div class="ch-name">每日成就<span class="badge">'+todayN+' 题</span></div>'+
      '<div class="ch-meta">'+(dk.length?('累计答题 '+ta+' 题 · 连续打卡 '+streak+' 天'):'从今天开始记录你的每日答题')+'</div>'+
      '<div class="ch-bar"><i style="width:'+acc+'%"></i></div></div>'+
      (dk.length?'<button class="go" onclick="event.stopPropagation();openAchieve()">查看</button>':'');
    box.appendChild(de);
  }
  CH_ORDER.forEach(key=>{
    const ch=ALL[key]; const n=ch.questions.length;
    let st=[]; try{ var s=localStorage.getItem('quiz_'+key); if(s) st=(JSON.parse(s).status)||[]; }catch(e){}
    let ok=0,bad=0; st.forEach(x=>{ if(x===1)ok++; else if(x===2)bad++; });
    const done=ok+bad; const pct=n?Math.round(done/n*100):0;
    const div=document.createElement('div'); div.className='chapter';
    div.innerHTML='<div class="ch-main" onclick="openChapter(\''+key+'\')">'+
      '<div class="ch-name">'+ch.name+'</div>'+
      '<div class="ch-meta">共 '+n+' 题 · 已答 '+done+' · 对 '+ok+' / 错 '+bad+'</div>'+
      '<div class="ch-bar"><i style="width:'+pct+'%"></i></div></div>'+
      '<button class="ch-reset" onclick="event.stopPropagation();resetChapter(\''+key+'\')">重置</button>';
    box.appendChild(div);
  });
}
function openChapter(key){
  curKey=key; isWrongMode=false; q=ALL[key].questions; loadProgress(key);
  if(status.length!==q.length){ status=new Array(q.length).fill(0); sel=new Array(q.length).fill(null); revealed=new Array(q.length).fill(false); idx=0; }
  if(idx>=q.length) idx=q.length-1; if(idx<0) idx=0;
  document.getElementById('chTitle').textContent=ALL[key].name;
  show('quiz'); render();
}
function writeBack(key,i,val,selVal){
  let o=null;
  try{ var s=localStorage.getItem('quiz_'+key); if(s) o=JSON.parse(s); }catch(e){}
  const n=ALL[key].questions.length;
  if(!o||typeof o!=='object') o={status:[],sel:[],revealed:[],idx:0};
  if(!o.status||o.status.length!==n) o.status=new Array(n).fill(0);
  if(!o.sel||o.sel.length!==n) o.sel=new Array(n).fill(null);
  if(!o.revealed||o.revealed.length!==n) o.revealed=new Array(n).fill(false);
  o.status[i]=val; o.sel[i]=selVal; o.revealed[i]=true;
  try{ localStorage.setItem('quiz_'+key, JSON.stringify(o)); }catch(e){}
}
function openWrong(){
  if(wrongSet===null) wrongSet=loadWrongSet();
  const items=[];
  CH_ORDER.forEach(key=>{
    ALL[key].questions.forEach((item,i)=>{
      if(wrongSet.has(key+'#'+i)){ const c=Object.assign({},item); c._key=key; c._idx=i; items.push(c); }
    });
  });
  if(!items.length){ toast('还没有错题，去练习吧！'); return; }
  isWrongMode=true; isFavMode=false; curKey='__wrong__';
  q=items; status=new Array(q.length).fill(0); sel=new Array(q.length).fill(null); revealed=new Array(q.length).fill(false); idx=0;
  if(idx>=q.length) idx=q.length-1;
  document.getElementById('chTitle').textContent='错题库';
  show('quiz'); render();
}
function openFav(){
  if(favSet===null) favSet=loadFavSet();
  const items=[];
  CH_ORDER.forEach(key=>{
    ALL[key].questions.forEach((item,i)=>{
      if(favSet.has(key+'#'+i)){ const c=Object.assign({},item); c._key=key; c._idx=i; items.push(c); }
    });
  });
  if(!items.length){ toast('还没有收藏，答题时点亮☆即可收藏'); return; }
  isWrongMode=false; isFavMode=true; curKey='__fav__';
  q=items; status=new Array(q.length).fill(0); sel=new Array(q.length).fill(null); revealed=new Array(q.length).fill(false); idx=0;
  if(idx>=q.length) idx=q.length-1;
  document.getElementById('chTitle').textContent='收藏夹';
  show('quiz'); render();
}
function resetChapter(key){
  const nm=(ALL[key]&&ALL[key].name)?ALL[key].name:'本章';
  if(!confirm('确定要重置「'+nm+'」的答题进度吗？\n（该题的错题记录会一并清除，收藏夹不受影响）')) return;
  try{ localStorage.removeItem('quiz_'+key); }catch(e){}
  if(wrongSet){ [...wrongSet].forEach(id=>{ if(id.indexOf(key+'#')===0) wrongSet.delete(id); }); saveWrongSet(wrongSet); }
  if(wrongStreak){ Object.keys(wrongStreak).forEach(id=>{ if(id.indexOf(key+'#')===0) delete wrongStreak[id]; }); saveWrongStreak(); }
  if(curKey===key){ status=new Array(q.length).fill(0); sel=new Array(q.length).fill(null); revealed=new Array(q.length).fill(false); idx=0; render(); }
  renderMenu(); toast('已重置');
}
function typeLabel(t){ return t==='multi'?'多选':(t==='judge'?'判断':(t==='fill'?'填空':'单选')); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  if(!q.length) return;
  if(favSet===null) favSet=loadFavSet();
  const item=q[idx]; const card=document.getElementById('card');
  let h='';
  const yr=item.year?'<span class="yr">'+esc(item.year)+'</span>':'';
  const favOn=(favSet&&favSet.has(curId()));
  h+='<div class="qno"><div class="qn-left"><span class="idx">第 '+(idx+1)+' 题 / '+q.length+'</span><span class="typ">'+typeLabel(item.type)+'</span>'+yr+'</div>'+
      '<button class="favbtn'+(favOn?' on':'')+'" onclick="toggleFav()">'+(favOn?'★':'☆')+'</button></div>';
  h+='<div class="qtitle">'+esc(item.title)+'</div>';
  if(item.type==='fill'){
    const val=(sel[idx]&&typeof sel[idx]==='string')?sel[idx]:'';
    h+='<div class="fillwrap"><input class="fillInput" type="text" placeholder="输入答案，多个值用、或 | 分隔" value="'+esc(val)+'" '+(revealed[idx]?'disabled':'oninput="onFillInput(this)"')+'></div>';
  } else {
  h+='<div class="opts">';
  item.options.forEach((opt,oi)=>{
    let cls='opt';
    if(revealed[idx]){
      const isA=item.answer.indexOf(oi)>=0, isS=(sel[idx]||[]).indexOf(oi)>=0;
      if(isA) cls+=' correct'; else if(isS) cls+=' wrong'; else cls+=' dim';
    } else if((sel[idx]||[]).indexOf(oi)>=0){ cls+=' sel'; }
    const lm=String(opt).match(/^[A-Za-z][.、]\s*(.*)$/);
    const letter=String.fromCharCode(65+oi);
    const otext=lm?lm[1]:opt;
    h+='<div class="'+cls+'" '+(revealed[idx]?'':'onclick="pick('+oi+')"')+'><span class="lab">'+letter+'</span><span class="otext">'+esc(otext)+'</span></div>';
  });
  h+='</div>';
  }
  if(isWrongMode) h+='<button class="remove" onclick="removeWrong()">从错题库移除</button>';
  else if(isFavMode) h+='<button class="unfav" onclick="toggleFav()">取消收藏</button>';
  if(item.type==='multi' && !revealed[idx]) h+='<button class="confirm" onclick="confirmMulti()">确认作答</button>';
  if(item.type==='fill' && !revealed[idx]) h+='<button class="confirm" onclick="confirmFill()">确认作答</button>';
  if(revealed[idx]){
    const ok=status[idx]===1;
    if(item.type==='fill'){
      const ans=Array.isArray(item.answer)?item.answer.join('、'):item.answer;
      h+='<div class="result '+(ok?'r-ok':'r-bad')+'">'+(ok?'✓ 回答正确':'✗ 回答错误')+'　正确答案：'+esc(ans)+'</div>';
    } else {
      const ans=item.answer.map(i=>String.fromCharCode(65+i)).join('、');
      h+='<div class="result '+(ok?'r-ok':'r-bad')+'">'+(ok?'✓ 回答正确':'✗ 回答错误')+'　正确答案：'+ans+'</div>';
    }
    h+='<div class="explain"><b>解析：</b>'+esc(item.explain)+'</div>';
    h+='<button class="retry" onclick="retry()">重做本题</button>';
  }
  card.innerHTML=h;
  document.getElementById('pos').textContent=(idx+1)+'/'+q.length;
  updateStat();
}
function pick(oi){
  if(revealed[idx]) return;
  const item=q[idx];
  if(item.type==='single'||item.type==='judge'){ sel[idx]=[oi]; check(); }
  else { if(!sel[idx]) sel[idx]=[]; const p=sel[idx].indexOf(oi); if(p>=0) sel[idx].splice(p,1); else sel[idx].push(oi); render(); }
}
function confirmMulti(){ if(revealed[idx]) return; if(!sel[idx]||sel[idx].length===0){ toast('请至少选择一个选项'); return; } check(); }
function numMatch(a,b){
  a=String(a).replace(/[, ]/g,''); b=String(b).replace(/[, ]/g,'');
  if(a===b) return true;
  const na=parseFloat(a.replace(/[^\d.\-]/g,'')), nb=parseFloat(b.replace(/[^\d.\-]/g,''));
  if(!isNaN(na)&&!isNaN(nb)){ if(nb===0) return na===0; return Math.abs(na-nb)/Math.abs(nb) < 0.01; }
  return a.indexOf(b)>=0||b.indexOf(a)>=0;
}
function isFillCorrect(){
  const item=q[idx]; const truth=(item.answer||[]).map(s=>String(s).trim());
  let u=(sel[idx]||'').trim();
  if(!u) return false;
  const parts=u.split(/[、|]/).map(s=>s.trim()).filter(Boolean);
  return parts.length>0 && parts.every(p=> truth.some(t=> numMatch(p,t)));
}
function onFillInput(el){ sel[idx]=el.value; }
function confirmFill(){ if(revealed[idx]) return; const v=(sel[idx]||'').trim(); if(!v){ toast('请输入答案'); return; } check(); }
function check(){
  let correct;
  if(q[idx].type==='fill'){ correct=isFillCorrect(); }
  else {
    const a=q[idx].answer.slice().sort().join(','), u=(sel[idx]||[]).slice().sort().join(',');
    correct=(a===u);
  }
  revealed[idx]=true; status[idx]=correct?1:2;
  recordDaily(correct);
  const id=curId();
  if(wrongSet===null) wrongSet=loadWrongSet();
  if(!correct){ wrongSet.add(id); }   // 仅答错时收录，不再自动移除
  if(isWrongMode) writeBack(q[idx]._key, q[idx]._idx, status[idx], sel[idx]);
  else saveProgress();
  saveWrongSet(wrongSet);
  render(); updateStat();
}
function retry(){ if(!revealed[idx]) return; revealed[idx]=false; status[idx]=0; sel[idx]=null; render(); }
function curId(){ return (isWrongMode||isFavMode)? (q[idx]._key+'#'+q[idx]._idx) : (curKey+'#'+idx); }
function toggleFav(){
  if(favSet===null) favSet=loadFavSet();
  const id=curId();
  if(favSet.has(id)) favSet.delete(id); else favSet.add(id);
  saveFavSet(favSet); render();
}
function removeWrong(){
  const id=q[idx]._key+'#'+q[idx]._idx;
  if(wrongSet===null) wrongSet=loadWrongSet();
  wrongSet.delete(id); saveWrongSet(wrongSet);
  q.splice(idx,1); status.splice(idx,1); sel.splice(idx,1); revealed.splice(idx,1);
  if(!q.length){ toast('错题库已清空'); showMenu(); return; }
  if(idx>=q.length) idx=q.length-1;
  render(); updateStat();
}
function updateStat(){
  let ok=0,bad=0; status.forEach(x=>{ if(x===1)ok++; else if(x===2)bad++; });
  const left=q.length-ok-bad;
  document.getElementById('cOk').textContent=ok;
  document.getElementById('cBad').textContent=bad;
  document.getElementById('cLeft').textContent=left;
}
function next(){ if(idx<q.length-1){ idx++; render(); saveProgress(); } else toast('已经是最后一题'); }
function prev(){ if(idx>0){ idx--; render(); saveProgress(); } else toast('已经是第一题'); }

function openGrid(){
  if(!q.length) return;
  document.getElementById('gridTitle').textContent=((curKey==='__wrong__'?'错题库':(curKey==='__fav__'?'收藏夹':ALL[curKey].name)))+' · 点击跳题';
  const cells=document.getElementById('gridCells'); cells.innerHTML='';
  q.forEach((item,i)=>{
    let cls='cell '+(i===idx?'cur':status[i]===1?'ok':status[i]===2?'bad':'un');
    const d=document.createElement('div'); d.className=cls; d.textContent=i+1;
    d.onclick=()=>{ idx=i; closeGrid(); render(); saveProgress(); };
    cells.appendChild(d);
  });
  document.getElementById('grid').classList.remove('hidden');
}
function closeGrid(){ document.getElementById('grid').classList.add('hidden'); }

let toastTimer=null;
function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1400); }

let sx=0,sy=0;
const cw=document.getElementById('cardWrap');
cw.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
cw.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ if(dx<0) next(); else prev(); } },{passive:true});

const BUILTIN_USERS=['jiaqu','syy'];
let curUser=null;
function getUser(){ const u=localStorage.getItem('quiz_user'); return u?u:''; }
function setUser(u){ localStorage.setItem('quiz_user',u); curUser=u; updateUserChip(); }
function updateUserChip(){ const c=document.getElementById('userChip'); if(c) c.textContent=curUser||''; }
function showLogin(allowClose){ const b=document.getElementById('login'); if(b){ const x=document.getElementById('loginClose'); if(x) x.style.display=(allowClose||curUser)?'':'none'; b.classList.remove('hidden'); } }
function hideLogin(){ const b=document.getElementById('login'); if(b){ b.classList.add('hidden'); const i=document.getElementById('loginInput'); if(i) i.value=''; } }
function pickUser(u){ if(!u) return; setUser(u); setHashAccount(u); hideLogin(); startSession(); scheduleSync(); }
function confirmInput(){ const i=document.getElementById('loginInput'); const v=(i&&i.value||'').trim(); if(v) pickUser(v); }
function switchUser(){ showLogin(true); }
function startSession(){
  wrongSet=loadWrongSet(); wrongStreak=loadWrongStreak(); favSet=loadFavSet();
  loadLastSync(); renderLastSync();
  updateUserChip();
  renderMenu();
  syncPull();
}
function accountFromHash(){ return (location.hash||'').replace(/^#/,'').trim(); }
function setHashAccount(u){ try{ history.replaceState(null,'','#'+u); }catch(e){ try{ location.hash=u; }catch(_){} } }
function boot(){
  hideLogin();
  curUser=getUser();
  if(!curUser){ const h=accountFromHash(); if(h){ curUser=h; setUser(curUser); } }
  if(!gistToken()){ showTokenPanel(false); }
  else if(!curUser){
    recoverAccountFromGist(function(acc){
      if(acc){ setUser(acc); setHashAccount(acc); startSession(); } else { showLogin(); }
    });
  }
  else { startSession(); }
}
boot();
</script>
