  "ch8": {
    "name": "第八章 成本管理",
    "questions": [
      {"type": "single", "year": "", "title": "在企业的日常经营管理工作中，成本管理工作的起点是( 　)。", "options": ["成本预测", "成本核算", "成本控制", "成本分析"], "answer": [0], "explain": "成本预测是成本管理的第一步，也是组织成本决策和编制成本计划的前提。"},
      {"type": "single", "year": "2020", "title": "下列各项中，利用有关成本资料或其他信息，从多个成本方案中选择最优方案的成本管理活动是(    )。", "options": ["成本分析", "成本计划", "成本预测", "成本决策"], "answer": [3], "explain": "成本决策是在成本预测及有关成本资料的基础上，综合经济效益、质量、效率和规模等指标，运用定性和定量的方法对各个成本方案进行分析并选择最优方案的成本管理活动。"},
      {"type": "multi", "year": "2020", "title": "成本管理是一系列成本管理活动的总称。下列各项中属于成本管理内容的有(   )。", "options": ["成本考核", "成本计划", "成本控制", "成本预测"], "answer": [0, 1, 2, 3], "explain": "成本管理具体包括成本预测、成本决策、成本计划、成本控制、成本核算、成本分析和成本考核等七项内容。"},
      {"type": "single", "year": "", "title": "某企业只生产A产品一种产品，预计下年销售价格为120元，单位变动成本为60元，固定成本为480 000元，如果下一年要实现目标利润240 000元，那么销售量应到达(    )件。", "options": ["6 000", "12 000", "4 000", "8 000"], "answer": [1], "explain": "令：(120－60)×Q－480000＝240 000，实现目标利润的销售量＝(240000＋480000)/(120－60)＝12 000(件)。"},
      {"type": "single", "year": "", "title": "某企业只生产A产品一种产品，预计下年销售价格为120元，单位变动成本为60元，固定成本为480 000元，不考虑利息费用，企业所得税率为25%。如果下一年要实现净利润180 000元，那么销售量应到达(    )件。", "options": ["6 000", "12 000", "4 000", "8 000"], "answer": [1], "explain": "令((120－60)×Q－480000)×(1－25%)＝180000，实现目标利润的销售量＝((180000/(1－25%))＋480000)/(120－60)＝12000(件)"},
      {"type": "multi", "year": "", "title": "某企业只生产一种产品，单价为20元，单位变动成本为12元，固定成本为2 400元，正常生产经营条件下的销售量为400件。以下说法中正确的有(    )。", "options": ["盈亏平衡点的业务量为120件", "盈亏平衡点作业率为75%", "安全边际中的边际贡献等于800元", "安全边际率为25%"], "answer": [1, 2, 3], "explain": "盈亏平衡点的业务量＝2400/(20－12)＝300(件)，选项A不正确；盈亏平衡点作业率＝300/400×100%＝75%，选项B正确；安全边际量＝400－300＝100(件)，安全边际中的边际贡献＝100×20×(20－12)/20＝800(元)，选项C正确；安全边际率＝100/400×100%＝25%，选项D正确。"},
      {"type": "multi", "year": "2021", "title": "边际贡献为正，产品单位变动成本和单价均下降1元，下列各项正确的有(　　)。", "options": ["盈亏平衡点销售额不变", "盈亏平衡点销售量不变", "单位边际贡献不变", "边际贡献率不变"], "answer": [1, 2], "explain": "单位边际贡献＝单价-单位变动成本，单位变动成本和单份均下降1元，单位边际贡献不变。边际贡献率＝单位边际贡献/单价，单位边际贡献不变，单价降低，边际贡献率变大。盈亏平衡点销售量＝固定成本/单位边际贡献，保持不变。盈亏平衡点销售额＝固定成本/边际贡献率，会变小。选项B、C当选。"},
      {"type": "judge", "year": "", "title": "不考虑其他因素的影响，固定成本每增加1元，边际贡献就减少1元。（ ）", "options": ["正确", "错误"], "answer": [1], "explain": "边际贡献总额=销售收入－变动成本总额，固定成本不影响边际贡献。"},
      {"type": "judge", "year": "", "title": "基于本量利分析，下列各项中，在其他条件不变的情况下，会导致盈亏平衡点上升的有(     ) 。", "options": ["销售量下降", "单价下降", "固定成本总额上升", "单位变动成本上升"], "answer": [1], "explain": "盈亏平衡点的销售量=固定成本/(单价–单位变动成本)，由公式可知，单价下降、固定成本总额上升、单位变动成本上升均会导致盈亏平衡点上升。选项B、C、D当选。"},
      {"type": "judge", "year": "", "title": "下列关于本量利分析的基本假设中正确的有（    ）。", "options": ["产销平衡", "营业收入和业务量呈完全线性关系", "产销结构稳定", "总成本由固定成本和变动成本组成"], "answer": [1], "explain": "本量利分析主要基于四个假设:总成本由固定成本和变动成本组成;销售收入与业务量呈完全线性关系;产销平衡;产品产销结构稳定。选项ABCD当选。"},
      {"type": "judge", "year": "", "title": "基于本量利分析模型，若产品的单位边际贡献为每件10元，则产销量每增加1件，利润就增加10元。（       ）", "options": ["正确", "错误"], "answer": [1], "explain": "利润=销售量×单位边际贡献-固定成本，在固定成本不变的情况下，销售量每增加1件，利润就会增加10元。本题表述正确。"},
      {"type": "judge", "year": "", "title": "基于本量利分析的敏感性分析，在利润为正的情况下，销售量变化对利润的影响程度大于固定成本变化对利润的影响程度。（ ）", "options": ["正确", "错误"], "answer": [1], "explain": "销售量的敏感系数=基期边际贡献÷基期息税前利润;固定成本的敏感系数= -（基期固定成本÷基期息税前利润）。企业在利润为正的情况下，边际贡献>固定成本，所以销售量敏感系数的绝对值>固定成本敏感系数的绝对值，即销售量变化对利润的影响程度大于固定成本变化对利润的影响程度。本题表述正确。"},
      {"type": "multi", "year": "", "title": "下列各项指标中，与保本点呈同向变化关系的有(    )。", "options": ["单位售价", "预计销量", "固定成本总额", "单位变动成本"], "answer": [2, 3], "explain": "保本销售量＝固定成本/(单价－单位变动成本)，可以看出，固定成本总额和单位变动成本与保本点销售量同方向变化，单价与保本点销售量反方向变化，预计销售量与保本点销售量无关，所以本题选择C、D。"},
      {"type": "single", "year": "2021", "title": "某公司产销一种产品，变动成本率为60%，盈亏平衡点作业率为70%，则销售利润率为(    )。", "options": ["18%", "12%", "42%", "28%"], "answer": [1], "explain": "边际贡献率＝1－变动成本率＝40%，安全边际率＝1－盈亏平衡作业率＝1－70%＝30%，销售利润率＝40%×30%＝12%。"},
      {"type": "judge", "year": "2021", "title": "基于本量利分析模型，若其他因素不变，目标利润的变动会影响盈亏平衡点的销售额。", "options": ["对", "错"], "answer": [1], "explain": "目标利润的变动会影响实现目标利润的销售量或销售额，不影响盈亏平衡点的销售额。"},
      {"type": "single", "year": "", "title": "根据单一产品的本量利分析模式。下列关于利润的计算公式中，正确的是(    )。", "options": ["利润＝销售收入×(1－边际贡献率)－固定成本", "利润＝盈亏平衡点销售量×边际贡献率", "利润＝实际销售额×安全边际率", "安全边际率×边际贡献率＝销售利润率"], "answer": [3], "explain": "利润＝边际贡献－固定成本＝销售收入×边际贡献率－固定成本＝销售收入×(1－变动成本率)－固定成本＝销售收入×边际贡献率－盈亏平衡点销售额×边际贡献率＝(销售收入－盈亏平衡点销售额)×边际贡献率＝安全边际额×边际贡献率，得出销售利润率＝安全边际率×边际贡献率，所以选项A、B错误，选项D正确。实际销售额×安全边际率＝安全边际额，所以选项C错误。"},
      {"type": "multi", "year": "2019", "title": "在单一产品本量利分析中，下列成立的有(    )。", "options": ["盈亏平衡作业率＋安全边际率＝1", "变动成本率×营业毛利率＝边际贡献率", "安全边际率×边际贡献率＝销售利润率", "变动成本率＋边际贡献率＝1"], "answer": [0, 2, 3], "explain": "边际贡献率＝(单价-单位变动成本)/单价＝1－单位变动成本/单价＝1－变动成本率，故选项B错误，选项D正确。"},
      {"type": "multi", "year": "2017", "title": "根据单一产品的本量利分析模式。下列关于利润的计算公式中，正确的有(    )。", "options": ["利润＝安全边际量×单位边际贡献", "利润＝保本销售量×单位安全边际", "利润＝实际销售额×安全边际率", "利润＝安全边际额×边际贡献率"], "answer": [0, 3], "explain": "息税前利润＝单位边际贡献×销售量－固定成本＝单位边际贡献×(安全边际量＋保本点销售量)－固定成本＝单位边际贡献×安全边际量＋单位边际贡献×保本点销售量－固定成本＝单位边际贡献×安全边际量，所以选项A正确；利润＝边际贡献－固定成本＝销售收入×边际贡献率－保本销售额×边际贡献率，所以：利润＝安全边际额×边际贡献率，选项C不正确，D正确。"},
      {"type": "judge", "year": "", "title": "根据传统式本量利分析图，在销售量不变的情况下，盈亏平衡点越低，盈利区越小、亏损区越大。", "options": ["对", "错"], "answer": [1], "explain": "在销售量不变的情况下，盈亏平衡点越低，盈利区越大，亏损区越小。因此本题的表述错误。"},
      {"type": "multi", "year": "", "title": "关于边际贡献式本量利分析图，下列说法正确的有(   )。", "options": ["边际贡献在弥补固定成本后形成利润", "该图的主要优点是可以表示边际贡献的大小", "边际贡献随销量的增加而减少", "当边际贡献超过固定成本后企业进入盈利区"], "answer": [0, 1, 3], "explain": "边际贡献随销量的增加而增加，所以选项C错误。"},
      {"type": "single", "year": "2019CPA", "title": "某公司月销售收入为50万元，边际贡献率为30%，该公司仅有K、W两部门，其中K部门变动成本为30万元，边际贡献率为25%，下列各项中错误的是(    )。", "options": ["K部门的变动成本率为70%", "K部门的边际贡献为10万元", "W部门的边际贡献率为50%", "W部门的销售收入为10万元"], "answer": [0], "explain": "因为K部门边际贡献率25%，则K部门的变动成本率＝1－25%＝75%，选项A不正确。K部门销售收入＝30/75%＝40(万元)，则K部门边际贡献＝40×25%＝10(万元)，选项B正确。W部门销售收入＝50－40＝10(万元)，选项D正确。该公司边际贡献总额＝50×30%＝15(万元)，W部门边际贡献＝15－10＝5(万元)，W部门边际贡献率＝5/10×100%＝50%，选项C正确。"},
      {"type": "single", "year": "2019", "title": "某企业生产销售A产品，且产销平衡。其销售单价为25元/件，单位变动成本为18元/件，固定成本为2 520万元。若A产品的正常销售量为600万件，则安全边际率为(    )。", "options": ["30%", "50%", "60%", "40%"], "answer": [3], "explain": "保本销售量＝固定成本/(单价－单位变动成本)＝2520/(25－18)＝360(万件)，安全边际量＝正常销售量－保本销售量＝600－360＝240(万件)，安全边际率＝安全边际量/正常销售量×100%＝240/600×100%＝40%。企业经营安全。"},
      {"type": "multi", "year": "2022", "title": "关于安全边际，下列表述正确的有(    )。", "options": ["安全边际率可以用1减去保本点作业率求得", "安全边际额是指实际或预期销售额超过保本点销售额的部分", "安全边际率越大，企业发生亏损的可能性就越小", "其他因素不变时，安全边际额越大，利润就越大"], "answer": [0, 1, 2, 3], "explain": "盈亏平衡点作业率＋安全边际率＝1，选项A当选；安全边际额是指实际或预期销售额超过保本点销售额的部分，选项B当选；安全边际越大，企业发生亏损的可能性越小，选项C当选；其他因素不变时，安全边际额越大，利润就越大，选项D当选。"},
      {"type": "single", "year": "2022", "title": "根据本量利分析原理，若其他因素不变，下列措施中，能够提高安全边际且不会降低保本点的是(    )。", "options": ["提高销售单价", "降低固定成本总额", "增加销售量", "提高单位变动成本"], "answer": [2], "explain": "盈亏平衡点(保本点)的业务量＝固定成本/(单价－单位变动成本)，所以提高销售单价、降低固定成本总额均会使保本点降低，选项A、B不当选。安全边际(量)＝销售量－盈亏平衡点销售量，提高单位变动成本会使盈亏平衡点销售量增加，导致安全边际降低，选项D不当选。提高销售量，能够提高安全边际，且不会降低保本点，选项C当选。"},
      {"type": "single", "year": "2023", "title": "甲公司生产X产品，产销平衡，单价为30元/件，单位变动成本为18元/件，固定成本为6 000万元，X产品销售量为800万件，安全边际率为(    )。", "options": ["62.5%", "40%", "37.5%", "60%"], "answer": [2], "explain": "盈亏平衡点销售量=6000/(30-18)=500(万件)，安全边际率=(800-500)/800=37.5%。"},
      {"type": "multi", "year": "2023", "title": "基于本量利分析模型，下列各项中，在其他条件不变的情况下，引起盈亏平衡点上升的有(        ) 。", "options": ["单价下降", "单位变动成本上升", "固定成本总额上升", "销售量下降"], "answer": [0, 1, 2], "explain": "盈亏平衡点销售量=固定成本/(单价-单位变动成本)，单价下降，(单价-单位变动成本)降低，盈亏平衡点销售量上升。所以选项A正确。单位变动成本上升，(单价-单位变动成本)降低，盈亏平衡点销售量上升。所以选项B正确。固定成本总额上升，盈亏平衡点销售量上升。所以选项C正确。销售量不影响盈亏平衡点销售量。所以选项D错误。"},
      {"type": "multi", "year": "2023", "title": "某企业生产销售单一产品，基于本量利分析模型，若产品的单价和单位变动成本同时提高1元，其他因素不变，下列表述正确的有(    )。", "options": ["单位边际贡献不变", "盈亏平衡点销售量不变", "边际贡献率不变", "安全边际量不变"], "answer": [0, 1, 3], "explain": "若产品的单价和单位变动成本同时提高1元，单位边际贡献不变，选项A正确。盈亏平衡点销售量=固定成本/单位边际贡献，固定成本和单位边际贡献不变，盈亏平衡点销售量不变，因此安全边际量不变，选项B、D正确。边际贡献率=单位边际贡献/单价，单位边际贡献不变，单价提高，边际贡献率下降，选项C错误。"},
      {"type": "single", "year": "2023", "title": "本量利分析中，关于指标之间的数量关系，下列错误的是(   )。", "options": ["变动成本率+边际贡献率=1", "盈亏平衡作业率+安全边际率=1", "单位边际贡献=单价-单位变动成本", "销售利润率=安全边际率×边际贡献"], "answer": [3], "explain": "销售利润率=安全边际率×边际贡献率，选项D错误。"},
      {"type": "single", "year": "2024", "title": "根据利量式本量利关系图，利润线与横轴的交点表示（   ）。", "options": ["盈亏平衡点销售量", "固定成本", "单位边际贡献", "安全边际销售量"], "answer": [0], "explain": "利量式本量利关系图是反映利润与销售量之间依存关系的图形。在直角坐标系中，以横轴代表销售量，以纵轴代表利润。在纵轴原点以下部分找到与固定成本总额相等的点(0，-固定成本数值)，该点表示销售量等于0时，亏损额等于固定成本;从点(0，-固定成本数值)出发画出利润线，该线的斜率是单位边际贡献。利润线与横轴的交点为盈亏平衡点的业务量。选项A正确。"},
      {"type": "single", "year": "2024", "title": "在进行本量利分析时，假定其他因素不变，下列各项中，会引起盈亏平衡点业务量降低的是（   ）。", "options": ["提高单位边际贡献", "提高单位变动成本", "提高销售量", "提高固定成本总额"], "answer": [0], "explain": "盈亏平衡点业务量=固定成本/(单价-单位变动成本)，提高单位边际贡献，则分母提高，盈亏平衡点业务量降低;提高单位变动成本，(单价-单位变动成本)降低，盈亏平衡点业务量提高;提高销售量不影响盈亏平衡点业务量;提高固定成本总额，盈亏平衡点业务量提高。"},
      {"type": "single", "year": "2024", "title": "关于盈亏平衡点，下列表述错误的是（   ）。", "options": ["在其他因素不变时，可以通过降低单位变动成本来降低盈亏平衡点", "在其他因素不变时，盈亏平衡点的降低幅度与固定成本的降低幅度相同", "在其他因素不变时，可以通过降低业务量来降低盈亏平衡点", "在其他因素不变时，可以通过提高产品销售单价来降低盈亏平衡点"], "answer": [2], "explain": "盈亏平衡点与企业业务量无关，选项C错误。"},
      {"type": "single", "year": "2024", "title": "某产品产销量为5000件，单价为100元/件，单位变动成本为40元/件，固定成本总额为120000元，该产品安全边际率为（   ）。", "options": ["66.67%", "60%", "40%", "150%"], "answer": [1], "explain": "盈亏平衡点的销售量=120000/(100-40))=2000(件);安全边际率=(5000-2000)/5000=60%。"},
      {"type": "single", "year": "2024", "title": "某产品销量为5000件，单价为100元/件，单位变动成本为60元/件，固定成本总额为120000元。根据本量利分析基本原理，销售量的敏感系数为（   ）。", "options": ["6.25", "3.75", "1.5", "2.5"], "answer": [3], "explain": "方法一:原利润=5000×(100-60)-120000=80 000(元);假设销量增长10%，则:销量=5000×(1+10%)=5 500(件);利润=5500×(100-60)-120000=100 000(元);利润变动百分比=(100000-80000)/80000=25%;销售量的敏感系数=25%/10%=2.5;方法二:销售量的敏感系数=经营杠杆系数=基期边际贡献/基期息税前利润=(100-60)))×5000/[(100-60)×5000-120000]=2.5。"},
      {"type": "single", "year": "", "title": "某公司生产和销售单一产品，该产品单位边际贡献为2元，销售量为40万件，利润为50万元。假设成本性态保持不变，则销售量的利润敏感系数是(   )。", "options": ["0.60", "0.80", "1.25", "1.60"], "answer": [3], "explain": "利润＝单位边际贡献×销量－固定成本，固定成本＝单位边际贡献×销量－利润＝40×2－50＝30(万元)。假设销量上升10%，变化后的销量＝40×(1+10%)＝44(万元)，变化后的利润＝44×2－30＝58(万元)，利润变化的百分比＝(58－50)/50＝16%，销售量的敏感系数＝16%/10%＝1.6，所以，选项D正确。或者销售量的敏感系数实际上是DOL＝\"M\" /\"EBIT\" ＝\"2×40\" /\"50\" ＝1.6。"},
      {"type": "single", "year": "2019", "title": "某公司生产和销售单一产品，预计计划年度销售量为10 000件，单价为300元，单位变动成本为200元，固定成本为200 000元。假设销售单价增长了10%，则销售单价的敏感系数(即息税前利润变化百分比相当于单价变化百分比的倍数)为(    )。", "options": ["0.1", "3.75", "1", "3"], "answer": [1], "explain": "单价上涨前的息税前利润＝10000×(300－200)－200000＝800 000(元)；单价上涨后的息税前利润＝10000×[300×(1＋10%)－200] －200000＝1100 000(元)；息税前利润增长率＝(1100000－800000)/800000＝37.5%。则销售单价的敏感系数＝37.5%/10%＝3.75。"},
      {"type": "single", "year": "", "title": "某企业只生产销售一种产品，目前处于盈利状态。经测算已知单位变动成本对利润的敏感系数为－2，为了确保下年度企业不亏损，单位变动成本的最大涨幅为(    )。", "options": ["25%", "100%", "50%", "30%"], "answer": [2], "explain": "“为了确保下年度企业不亏损”意味着“利润下降的最大幅度为100%”，所以，单位变动成本的最大涨幅为100%/2＝50%。"},
      {"type": "multi", "year": "", "title": "某企业只生产一种产品，当年的息税前利润为20 000元。运用本量利关系对影响息税前利润的各因素进行敏感分析后得出，单价的敏感系数为4，单位变动成本的敏感系数为－2.5，销售量的敏感系数为1.5，固定成本的敏感系数为－0.5。下列说法中，正确的有(   )。", "options": ["上述影响息税前利润的因素中，单价是最敏感的，固定成本是最不敏感的", "当单价提高10%时，息税前利润将增长8 000元", "当单位变动成本的上升幅度超过40%时，企业将转为亏损", "销售量的敏感程度大于单位变动成本的敏感程度"], "answer": [0, 1, 2], "explain": "敏感程度大小要看敏感系数的绝对值，所以选项A正确；单价的敏感系数为4，表明单价提高10%，利润将提高40%，增长额＝20000×40%＝8000(元)，选项B正确；若单位变动成本的上升幅度超过40%，则利润下降幅度将超过2.5×40%＝100%，企业将转为亏损，选项C正确；销售量的敏感系数绝对值小于单位变动成本的敏感系数的绝对值，因此，销售量的敏感程度小于单位变动成本的敏感程度，选项D错误。"},
      {"type": "single", "year": "", "title": "在标准成本管理中，成本差异是成本控制的重要内容。其计算公式是(    )。", "options": ["实际产量下实际成本－实际产量下标准成本", "实际产量下标准成本－预算产量下实际成本", "实际产量下实际成本－预算产量下标准成本", "实际产量下实际成本－标准产量下的标准成本"], "answer": [0], "explain": "成本总差异＝实际产量下实际成本－实际产量下标准成本。"},
      {"type": "single", "year": "2018", "title": "某产品本期产量为60套，直接材料标准用量为18千克/套，直接材料标准价格为270元/千克，直接材料实际用量为1 200千克，实际价格为280元/千克。则该产品的直接材料用量差异为(    )元。", "options": ["10 800", "12 000", "32 400", "33 600"], "answer": [2], "explain": "产品的直接材料用量差异＝(1200-60×18)×270＝32400(元)，所以选择C。"},
      {"type": "single", "year": "", "title": "甲公司生产销售乙产品，当月预算产量1 200件，材料标准用量5千克/件，材料标准单价2元/千克，当月实际产量1 100件，购买并耗用材料5 050千克。实际采购价格比标准价格低10%。则当月直接材料成本价格差异是(    )元。", "options": ["不利差异1 010", "有利差异1 200", "有利差异1 010", "有利差异1 100"], "answer": [2], "explain": "直接材料成本价格差异＝(2×90%－2)×5050＝－1 010(元)(F、节约)。"},
      {"type": "single", "year": "", "title": "甲公司生产A产品，直接人工标准如下：月标准总工时为10 000小时，月标准总工资为75 000元，单位产品工时用量标准为2小时/件。实际生产情况如下：生产A产品4 900件，耗用总工时8 820小时，发生工资费用70 560元，直接人工效率差异是(　　)元。", "options": ["－8 850", "5 292", "－5 292", "－7 350"], "answer": [3], "explain": "直接人工效率差异＝(实际工时－标准工时)×标准工资率＝(8820－4900×2)×(75000/10000)＝－7 350(元)，选项D正确。"},
      {"type": "single", "year": "2022", "title": "在标准成本法下，下列各项中，不属于直接材料用量差异形成原因的是(    )。", "options": ["产品废品率的高低", "直接材料运输方式的不同", "产品设计结构的变化", "工人的技术熟练程度"], "answer": [1], "explain": "直接材料耗用量差异形成的原因包括产品设计结构、原料质量、工人的技术熟练程度、废品率的高低等。直接材料运输方式的不同是材料价格差异形成的原因。选项B当选。"},
      {"type": "multi", "year": "", "title": "下列各项中，可能造成直接材料用量差异的情况有(   )。", "options": ["产品设计结构改进节约材料", "原材料质量不合格多耗材料", "材料运输保险费提高", "工人操作疏忽导致废品增加"], "answer": [0, 1, 3], "explain": "直接材料用量差异有生产部门原因，也有非生产部门原因。如产品设计结构、原料质量、工人的技术熟练程度、废品率的高低等。材料运输保险费提高是造成直接材料价格差异的因素。"},
      {"type": "multi", "year": "2022", "title": "在标准成本法下，关于直接人工成本及其差异的计算，下列表述正确的有(    )。", "options": ["直接人工标准成本＝预算产量下标准工时×标准分配率", "直接人工工资率差异＝标准工时×(实际工资率-标准工资率)", "直接人工效率差异＝(实际工时一标准工时)×标准工资率", "直接人工实际成本＝实际产量下实际工时×实际工资率"], "answer": [2, 3], "explain": "直接人工标准成本＝实际产量下标准工时×标准分配率，选项A错误；直接人工工资率差异＝实际工时×(实际工资率—标准工资率)，选项B错误。"},
      {"type": "single", "year": "2016", "title": "下列因素中，一般不会导致直接人工工资率差异的是(    )。", "options": ["工资制度的变动", "工作环境的好坏", "工资级别的升降", "加班或临时工的增减"], "answer": [1], "explain": "工人技术状况、工作环境和设备条件的好坏影响直接人工的效率。工资制度的变动、工人的升降级、加班或临时工的增减等会导致工资率差异。"},
      {"type": "single", "year": "2022CPA", "title": "甲公司产销X产品。2022年7月预算产量4 000件，每件产品标准工时为2小时，变动制造费用标准分配率为26元/小时。实际产量4 250件，实际工时7 650小时，实际变动制造费用214 200元。则本月变动制造费用耗费差异是(　 )元。", "options": ["不利差异17 000", "不利差异15 300", "有利差异22 100", "有利差异6 800"], "answer": [1], "explain": "变动制造费用耗费差异＝7650×(214200/7650－26)＝15 300(元)(U、超支)。"},
      {"type": "single", "year": "", "title": "某产品的变动制造费用标准成本为：工时消耗4小时/件，小时分配率6元/小时。本月生产产品250件，实际使用工时1 500小时，实际发生变动制造费用12 000元。则变动制造费用效率差异为(    )元。", "options": ["2 500", "3 000", "1 440", "1 760"], "answer": [1], "explain": "本题的主要考核点是变动制造费用效率差异的计算。变动制造费用效率差异＝(1500－250×4)×6＝3 000(元)。"},
      {"type": "single", "year": "", "title": "甲企业生产能力1 100件，每件产品标准工时1.1小时，固定制造费用标准分配率8元/小时。本月实际产量1200件，实际工时1 000小时，固定制造费用12 000元。固定制造费用标准成本是(　　)元。", "options": ["9 680", "8 000", "10 560", "14 520"], "answer": [2], "explain": "固定制造费用标准成本＝实际产量标准工时×固定制造费用标准分配率＝1200×1.1×8＝10 560(元)。"},
      {"type": "multi", "year": "", "title": "已知固定制造费用成本差异为800元，能量差异为－1 200元，效率差异为400元，则下列表述中正确的有(   )。", "options": ["固定制造费用耗费差异为2 000元", "固定制造费用耗费差异为1 200元", "固定制造费用产量差异为－800元", "固定制造费用产量差异为－1 600元"], "answer": [0, 3], "explain": "固定制造费用成本差异＝耗费差异＋能量差异，则：耗费差异＝固定制造费用成本差异－能量差异＝800－(－1200)＝2000(元)。能量差异＝产量差异＋效率差异，则：产量差异＝－1200－400＝－1600(元)"},
      {"type": "multi", "year": "", "title": "下列各项成本差异中，通常应由生产部门负责的有(   )。", "options": ["直接人工工资率差异", "直接材料价格差异", "直接人工效率差异", "变动制造费用效率差异"], "answer": [2, 3], "explain": "直接材料价格差异主要由采购部门承担责任；直接人工工资率差异主要由劳动人事部门承担责任；直接人工效率差异和变动制造费用效率差异的形成原因基本相同，其主要责任也在生产部门。"},
      {"type": "single", "year": "2020", "title": "作业成本法下，产品成本计算的基本程序可以表示为(   )。", "options": ["作业—部门—产品", "资源—作业—产品", "资源—部门—产品", "资源—产品"], "answer": [1], "explain": "作业成本法以“作业消耗资源、产出消耗作业”为原则，按照资源动因将资源费用追溯或分配至各项作业，计算出作业成本，然后再根据作业动因，将作业成本追溯或分配至各成本对象，最终完成成本计算的过程。"},
      {"type": "judge", "year": "", "title": "在作业成本法下，成本动因是导致成本发生的诱因，是成本分配的依据。(      )。", "options": ["对", "错"], "answer": [1], "explain": ""},
      {"type": "judge", "year": "2020", "title": "在作业成本法下，一个作业中心只能包括一种作业。", "options": ["对", "错"], "answer": [1], "explain": "作业中心可以是某一项具体的作业，也可以是由若干个相互联系的能够实现某种特定功能的作业的集合，所以答案错误。"},
      {"type": "multi", "year": "", "title": "下列有关“资源动因”表述正确的是(    )。", "options": ["它是引起作业成本变动的因素", "它是引起产品成本变动的因素", "它被用来计量各项作业对资源的耗用，运用它可以将资源费用分配给各有关作业", "它是计量各种产品对作业耗用的情况，并被用来作为作业成本的分配基础"], "answer": [0, 2], "explain": "成本动因分为资源动因和作业动因。选项BD是作业动因的含义和特征。"},
      {"type": "multi", "year": "", "title": "甲公司是一家电子产品生产企业，从事电子产品的设计、生产和销售，按照客户订单分批组织生产，间接加工费按照作业成本法分配。下列关于作业成本库设计的说法中，正确的有(   )。", "options": ["产品设计作业属于品种级作业", "产品订单处理属于批次级作业", "产品组装作业属于产量级作业", "产品包装作业属于设施级作业"], "answer": [0, 1, 2], "explain": "产品包装作业属于产量级作业，选项D错误。"},
      {"type": "single", "year": "", "title": "甲企业采用作业成本法计算产品成本，每批产品生产前需要进行机器调试。对调试中心进行成本分配时，最适合采用的作业成本动因是(    )。", "options": ["产品品种", "产品批次", "产品数量", "每批产品数量"], "answer": [1], "explain": "由于每批产品生产前都需要进行机器调试，所以机器调试中心的成本与批次有关，应该以产品批次作为成本动因。"},
      {"type": "multi", "year": "2021", "title": "在作业成本法下，下列属于批别级作业的有(    )。", "options": ["设备调试", "厂房维护", "生产准备", "新产品设计"], "answer": [0, 2], "explain": "批别级作业，是指为一组(或一批)产品(或服务)实施的、使该组(该批)产品(或服务)受益的作业。该类作业的发生是由生产的批量数而不是单个产品(或服务)引起的，其数量与产品(或服务)的批量数呈正比例变动。选项A、C属于批别级作业，选项B属于设施级作业，选项D属于品种级作业。"},
      {"type": "multi", "year": "2022CPA", "title": "下列各项作业中，属于品种级作业的有(　　)。", "options": ["产品组装", "产品生产工艺规程制定", "产品设计", "产品更新"], "answer": [1, 2, 3], "explain": "品种级作业是指服务于某种型号或样式产品的作业。例如，产品设计、产品生产工艺规程制定、工艺改造、产品更新等。选项B、C、D正确。选项A属于单位级作业。"},
      {"type": "single", "year": "", "title": "下列各项中，适合使用强度动因作为作业量计量单位的是(　)。", "options": ["每批产品生产前调整准备", "特别复杂产品的安装", "产品的分批质检", "产品的机器加工"], "answer": [1], "explain": "强度动因是指不易按照频率、次数或执行时间进行分配而需要直接衡量每次执行所需资源的成本动因，适用于作业的执行比较特殊或复杂。每批产品生产前调整准备、产品的分批质检通常每次执行所需要的资源数量相同或接近，适合采用交易动因，不同产品的机器加工通常每次执行所需要的时间存在显著的不同，适合采用持续时间动因。"},
      {"type": "single", "year": "2022CPA", "title": "甲公司生产X、Y两种产品。2022年7月X产品产量4 000件，Y产品产量1 000件，甲公司采用作业成本法分配间接成本，相关数据X产品的单位间接成本是（　　）元。如下：", "options": ["8100", "1550", "3875", "810"], "answer": [2], "explain": "如果一项作业不能同时满足增值作业的三个条件，就可断定其为非增值作业。例如检验作业，只能说明产品是否符合标准，而不能改变其形态，不符合第一个条件；次品返工作业在其之前的加工作业本就应提供符合标准的产品，因此也属于非增值作业；将原材料材料从集中保管的仓库搬运到生产部门，将某部门生产的零件搬运到下一个生产部门都是非增值作业。因此，只有选项C属于增值作业。"},
      {"type": "single", "year": "2017", "title": "根据作业成本管理原理，某制造企业的下列作业中，属于增值作业的是(   )。", "options": ["产品检验作业", "产品运输作业", "零件组装作业", "次品返工作业"], "answer": [2], "explain": "如果一项作业不能同时满足增值作业的三个条件，就可断定其为非增值作业。例如检验作业，只能说明产品是否符合标准，而不能改变其形态，不符合第一个条件；次品返工作业在其之前的加工作业本就应提供符合标准的产品，因此也属于非增值作业；将原材料材料从集中保管的仓库搬运到生产部门，将某部门生产的零件搬运到下一个生产部门都是非增值作业。因此，只有选项C属于增值作业。"},
      {"type": "multi", "year": "", "title": "下列各项作业中，属于增值作业的有(   )。", "options": ["次品处理作业", "服装剪裁作业", "产品切割作业", "返工作业"], "answer": [1, 2], "explain": "最终增加顾客价值的作业是增值作业；否则就是非增值作业。非增值作业如等待作业、材料或在产品的堆积作业、产品或在产品的企业内部迂回作业、废品清理作业、次品处理作业、返工作业、无效率重复某工序作业、由于订单信息不准确造成没有准确送达需要再次送达的无效率作业等。"},
      {"type": "multi", "year": "2016", "title": "作为成本管理的一个重要内容是寻找非增值作业，将非增值成本降至最低，下列各项中，属于非增值作业的有(   )。", "options": ["从仓库到车间的材料运输作业", "零部件加工作业", "零部件组装作业", "产成品质量检验作业"], "answer": [0, 3], "explain": "非增值作业，是指即便消除也不会影响产品对顾客服务的潜能，不必要的或可消除的作业，如果一项作业不能同时满足增值作业的三个条件，就可断定其为非增值作业。例如检验作业(选项D)，只能说明产品是否符合标准，而不能改变其形态，不符合第一个条件；从仓库到车间的材料运输作业(选项A)可以通过将原料供应商的交货方式改变为直接送达原料使用部门从而消除，故也属于非增值作业。"},
      {"type": "judge", "year": "", "title": "作业成本管理的目的是找出并消除非增值作业，提高增值作业的效率，削减非增值成本和增值成本。", "options": ["对", "错"], "answer": [1], "explain": "作业成本管理的目的：找出并消除非增值作业，提高增值作业的效率，削减非增值成本。"},
      {"type": "single", "year": "", "title": "在作业成本管理中，利用规模经济来提高增值作业效率的是(    )。", "options": ["作业消除", "作业选择", "作业减少", "作业共享"], "answer": [3], "explain": "作业共享是指利用规模经济来提高增值作业的效率。作业减少是指以不断改进的方式降低作业消耗的资源或时间。作业选择是指对所有能够达到同样目的的不同作业，选取其中最佳的方案。作业消除是指消除非增值作业或不必要的作业，降低非增值成本。"},
      {"type": "single", "year": "2018", "title": "根据作业成本管理原理，关于成本节约途径的表述中不正确的是(    )。", "options": ["将外购材料交货地点从厂外临时仓库变更为材料消耗车间属于作业选择", "不断改进技术降低作业消耗的时间属于作业减少", "新产品设计时尽量考虑利用现有其他产品使用的零件属于作业共享", "将内部货物运输业务由自营转为外包属于作业选择"], "answer": [0], "explain": "作业消除是指消除非增值作业或不必要的作业，降低非增值成本。作业选择是指对所有能够达到同样目的的不同作业，选取其中最佳的方案。将外购材料交货地点从厂外临时仓库变更为材料耗用车间，将功能性的工厂布局转变为单元制造式布局，就可以缩短运输距离，削减甚至消除非增值作业。因此选项A属于作业消除。"},
      {"type": "judge", "year": "2013", "title": "非增值成本是指由非增值作业发生的作业成本，是需要通过持续改善来消除或逐步降低的成本。", "options": ["对", "错"], "answer": [1], "explain": "非增值成本不仅指非增值作业发生的成本，还包括增值作业中因为低效率所发生的作业成本。"},
      {"type": "single", "year": "2019", "title": "在以成本为基础制定内部转移价格时，下列各项中，不适合作为转移定价基础的是(    )。", "options": ["变动成本", "变动成本加固定制造费用", "固定成本", "完全成本"], "answer": [2], "explain": "成本型内部转移价格定价是以标准成本等相对稳定的成本数据为基础，制定内部转移价格的方法。适用于内部转移的产品或劳务没有市价的情况，包括完全成本、完全成本加成、变动成本以及变动成本加固定制造费用四种形式。"},
      {"type": "single", "year": "2017", "title": "协商型内部转移价格定价，该协商价格的下限一般是(　 )。", "options": ["单位完全成本加上单位毛利", "单位变动成本加上单位边际贡献", "单位完全成本", "单位变动成本"], "answer": [3], "explain": "协商价格的上限是市价，下限则是单位变动成本。"},
      {"type": "single", "year": "2024", "title": "某产品固定制造费用标准分配率为12元/小时，标准工时1.5小时/件，该产品预算产量为10 000件，实际产量为8 000件，实际产生固定制造费用190 000元，实际工时10 000小时，根据固定制造费用的两差异分析法，固定制造费用能量差异为（   ）。", "options": ["超支46 000元", "超支36 000元", "超支70 000元", "超支10 000元"], "answer": [1], "explain": "固定制造费用能量差异=10000×1.5×12-8000×1.5×12=36000(元)(超支)。"},
      {"type": "single", "year": "2024", "title": "某产品预算产量为9 000件，标准工时为1.5小时/件，固定制造费用标准分配率为10元/小时。实际产量为8 500件，实际工时为1.2小时/件，实际发生固定制造费用122 400元，根据标准成本法下的固定制造费用三差异分析法，固定制造费用产量差异为（   ）。", "options": ["7 500元", "-25 500元", "-5 100元", "33 000元"], "answer": [3], "explain": "固定制造费用产量差异=(预算产量下标准工时-实际产量下实际工时)×标准分配率=(9000×1.5-8500×1.2)×10=33 000(元)。"},
      {"type": "multi", "year": "", "title": "基于作业成本法判定一项作业为增值作业，必须同时满足的条件有（   ）。", "options": ["该作业为重复作业", "该作业导致的状态变化不能由其他作业完成", "该作业导致了状态的改变", "该作业使得其他作业得以运行"], "answer": [1, 2, 3], "explain": "一项作业必须同时满足下列三个条件才可断定为增值作业:①该作业导致了状态的改变。②该状态的变化不能由其他作业来完成。③该作业使其他作业得以进行。"},
      {"type": "single", "year": "2022CPA", "title": "甲公司生产X、Y两种产品。2022年7月X产品产量4 000件，Y产品产量1 000件，甲公司采用作业成本法分配间接成本，相关数据如下：X产品的单位间接成本是（　　）元。", "options": ["8100", "1550", "3875", "810"], "answer": [0], "explain": "解析：X产品分配的机器调整作业＝1400÷（15＋13）×15＝750（万元），X产品分配的机加工作业＝960÷（40000＋8000）×40000＝800（万元），X产品分配的间接成本总额＝750＋800＝1 550（万元），X产品的单位间接成本＝1550×10000÷4000＝3 875（元/件）。选项C当选。"},
      {"type": "single", "year": "2020", "title": "在作业成本法下，划分增值作业与非增值作业的主要依据是(    )。", "options": ["是否有助于提高产品质量", "是否有助于增加产品功能", "是否有助于提升企业技能", "是否有助于增加顾客价值"], "answer": [3], "explain": "按照对顾客价值的贡献，作业可以分为增值作业和非增值作业，故选项D正确。"},
      {"type": "multi", "year": "2019", "title": "在责任成本管理体制下，下列关于成本中心的说法错误的有(    )。", "options": ["成本中心对不可控成本负责", "成本中心对可控成本负责", "成本中心对利润负责", "成本中心对边际贡献负责"], "answer": [0, 2, 3], "explain": "成本中心只对可控成本负责，不负责不可控成本，也不对利润和边际贡献负责，所以选项ACD错误。"},
      {"type": "single", "year": "2020", "title": "对于成本中心而言，某项成本成为可控成本的条件不包括(    )。", "options": ["该成本是成本中心可以计量的", "该成本的发生是成本中心可以预见的", "该成本是成本中心可以调节和控制的", "该成本是总部向成本中心分摊的"], "answer": [3], "explain": "可控成本是指成本中心可以控制的各种耗费，它应具备三个条件：第一，该成本的发生是成本中心可以预见的；第二，该成本是成本中心可以计量的；第三，该成本是成本中心可以调节和控制的。"},
      {"type": "single", "year": "2021", "title": "在责任成本管理中，关于成本中心的表述错误的是(    )。", "options": ["责任成本是成本中心考核和控制的主要内容", "成本中心是指有权发生并控制成本的单位", "成本中心不考核收入，只考核成本", "成本中心需要对本中心的全部成本负责"], "answer": [3], "explain": "成本中心只对可控成本负责，不负责不可控成本，选项D当选。"},
      {"type": "single", "year": "2022", "title": "关于成本中心及其业绩考核，下列说法错误的是(    )。", "options": ["成本中心既对可控成本负责，又对不可控成本负责", "成本中心一般不会产生收入", "与利润中心相比，成本中心的权利和责任都较小", "成本中心仅考核发生的成本，不考核收入"], "answer": [0], "explain": "成本中心不考核收入，只考核成本；成本中心只对可控成本负责，不负责不可控成本，选项A当选。"},
      {"type": "single", "year": "", "title": "某公司某部门的有关数据为：销售收入20 000万元，已销产品的变动成本和变动销售费用12 000万元，可控固定成本1 000万元，不可控固定成本1 200万元，则该部门的可控边际贡献为(   )万元。", "options": ["8 000", "7 000", "5 800", "4 300"], "answer": [1], "explain": "可控边际贡献＝边际贡献－该中心负责人可控固定成本＝销售收入总额－变动成本总额－该中心负责人可控固定成本＝20000－12000－1000＝7 000(万元)"},
      {"type": "multi", "year": "2018", "title": "下列指标中适用于对利润中心进行业绩考评的有(    )。", "options": ["投资报酬率", "部门边际贡献", "剩余收益", "可控边际贡献"], "answer": [1, 3], "explain": "选项A、C是投资中心的考核指标，不是利润中心的考核指标。"},
      {"type": "judge", "year": "", "title": "引起个别投资中心的投资收益率提高的投资，不一定会使整个企业的投资收益率提高；但引起个别投资中心的剩余收益增加的投资，则一定会使整个企业的剩余收益增加。", "options": ["对", "错"], "answer": [1], "explain": "仅以投资收益率可能会导致追求局部利润最大化而损害整体利益最大化目标，导致经理人员为眼前利益而牺牲长远利益。剩余收益指标弥补了投资收益率指标会使局部利益与整体利益相冲突的不足。"},
      {"type": "judge", "year": "", "title": "次要作业属于非增值作业，也是企业应该消除和减少的作业。", "options": ["对", "错"], "answer": [1], "explain": "解析:非增值作业属于非正式作业，是企业应该消除和减少的作业，但次要作业与非增值作业不是同一个概念，不一定要消除。"},
      {"type": "single", "year": "", "title": "对于一家制造企业而言，在作业成本法下，下列作业中属于产量级作业的是（ ）。", "options": ["设备调试", "产品广告", "生产流程监控", "产品加工"], "answer": [3], "explain": "产量级作业是指明确地为个别产品（或服务）实施的、使单个产品 （或服务）受益的作业。该类作业的数量与产品（或服务）的数量呈正比例变动。包括产品加工、检验等，选项 D 当选。选项 A 属于批别级作业，选项 B、C 属于品种级作业。"},
      {"type": "multi", "year": "", "title": "推行作业成本法的企业，一般具有一定的适用特征，包括（    ）。", "options": ["作业类型较多且作业链较长", "企业规模较大且管理层对产品成本准确性要求较高", "间接或辅助资源费用所占比重较大", "同一生产线生产的产品种类单一"], "answer": [0, 1, 2], "explain": "作业成本法一般适用于具备以下特征的企业:作业类型较多且作业链较长;同一生产线生产多种产品;企业规模较大且管理层对产品成本准确性要求较高;产品、客户和生产过程多样化程度较高;间接或辅助资源费用所占比重较大等。选项A、B、C当选。"},
      {"type": "single", "year": "", "title": "根据作业成本管理原理，下列关于成本节约途径的表述中，不正确的是（    ）。", "options": ["将外购交货材料地点从厂外临时仓库变更为材料耗用车间属于作业选择", "将内部货物运输业务由自营转为外包属于作业选择", "新产品在设计时尽量考虑利用现有其他产品使用的原件属于作业共享", "不断改进技术降低作业消耗时间属于作业减少"], "answer": [0], "explain": "选项A属于作业消除。作业消除是指消除非增值作业或不必要的作业，降低非增值成本。如将原材料从集中保管的仓库搬运到生产部门，将某部门生产的零件搬运到下一个生产部门都是非增值作业。如果条件许可，将原料供应商的交货方式改变为直接送达原料使用部门，将功能性工厂布局转变为单元制造式布局，就可以缩短运输距离，削减甚至消除非增值作业。"},
      {"type": "single", "year": "", "title": "甲公司各部门经理通过财务部门计算的材料价格差异商讨认定直接材料价格差异的责任部门。主要承担责任的部门应是（  ）。", "options": ["销售部门", "财务部门", "采购部门", "生产部门"], "answer": [2], "explain": "材料价格差异的形成受各种主客观因素的影响，较为复杂，如市场价格、供货厂商、运输方式、采购批量等的变动，都可能导致材料的价格差异。但由于它与采购部门的关系更为密切，所以其差异应主要由采购部门承担责任。选项C当选。"},
      {"type": "multi", "year": "", "title": "在责任成本管理体制下，下列关于成本中心的说法正确的有（    ）。", "options": ["只考核成本，不考核收入", "责任中心只对可控成本负责", "对本中心发生全部成本负责", "不制定内部转移价格"], "answer": [0, 1], "explain": "成本中心特点主要有:（1）成本中心不考核收入，只考核成本，选项A当选;（2）成本中心只对可控成本负责，不负责不可控成本，选项B当选，选项C不当选;（3）责任成本是成本中心考核和控制的主要内容。成本型内部转移定价是指以标准成本等相对稳定的成本数据为基础，制定内部转移价格的方法，一般适用于内部成本中心。选项D不当选。"},
      {"type": "judge", "year": "", "title": "企业发生内部交易的双方之间，买卖双方所采用的内部转移价格必须保持一致。", "options": ["对", "错"], "answer": [1], "explain": "内部转移价格的制定可以是双重价格，即由内部责任中心的交易双方采用不同的内部转移价格作为计价基础。"},
      {"type": "single", "year": "", "title": "在责任中心业绩考核中，关于剩余收益的表述中，正确的是（    ）。", "options": ["剩余收益是指投资中心的经营收益扣除可控成本之后的余额", "容易导致投资中心片面追求局部利益而忽略公司整体利益", "可以反映每单位资产对公司利润贡献大小", "不便于在不同规模投资中心之间进行业绩比较"], "answer": [3], "explain": "剩余收益是指投资中心的经营收益扣减经营资产按要求的最低投资收益率计算的收益额之后的余额，选项A错误。剩余收益指标弥补了投资收益率指标会使局部利益与整体利益相冲突这一不足之处，但由于其是一个绝对指标，故而难以在不同规模的投资中心之间进行业绩比较，选项B错误、选项D正确。投资收益率主要说明了投资中心运用公司的每单位资产对公司整体利润贡献的大小，选项C错误。"},
      {"type": "multi", "year": "", "title": "某利润中心本期销售收入100万元，变动成本46万元，该中心负责人可控固定成本15万元，该中心负责人不可控但应由该中心负担的固定成本12万元，则可控边际贡献为(   )万元。", "options": ["54", "61", "39", "27"], "answer": [2], "explain": "可控边际贡献=销售收入总额-变动成本总额-该中心负责人可控固定成本= 100-46-15=39 (万元)。选项C当选。"},
      {"type": "multi", "year": "", "title": "某公司有M、N两个利润中心，M利润中心向N利润中心提供劳务，在其他条件不变的情况下，提高劳务内部转移价格所产生的结果有（    ）。", "options": ["M利润中心利润增加", "该公司利润总额增加", "N利润中心利润不变", "该公司利润总额不变"], "answer": [0, 3], "explain": "提高劳务内部转移价格会导致M利润中心利润增加，N利润中心利润减少，两者一增一减，金额相等，该公司利润总额保持不变。选项A、D当选。"},

  "ch9": {
    "name": "第九章 收入与分配管理",
    "questions": [
      {"type": "single", "year": "", "title": "下列关于提取任意盈余公积的表述中，不正确的是(    )。", "options": ["应从税后利润中提取", "应经股东大会决议", "满足公司经营管理的需要", "达到注册资本的50%时不再计提"], "answer": [3], "explain": "根据《公司法》的规定，法定盈余公积金的提取比例为当年税后利润(弥补亏损后)的10%，当法定盈余公积金的累积额达到注册资本的50%时，可以不再提取。根据《公司法》的规定，公司从税后利润中提取法定公积金后，经股东会或股东大会决议，还可以从税后利润中提取任意公积金。"},
      {"type": "single", "year": "2018", "title": "下列各项中，正确反映公司净利润分配顺序的是(    )。", "options": ["提取法定公积金、提取任意公积金、弥补以前年度亏损、向投资者分配股利", "向投资者分配股利、弥补以前年度亏损、提取法定公积金、提取任意公积金", "弥补以前年度亏损、向投资者分配股利、提取法定公积金、提取任意公积金", "弥补以前年度亏损、提取法定公积金、提取任意公积金、向投资者分配股利"], "answer": [3], "explain": "净利润分配顺序为先弥补以前年度亏损，然后提取法定公积金、提取任意公积金，最后向投资者分配股利。"},
      {"type": "judge", "year": "", "title": "按照“同股同权，同股同利”，公司持有的本公司股份同样应该分配股利。", "options": ["对", "错"], "answer": [1], "explain": "《公司法》规定，公司持有的本公司股份不得分配股利。"},
      {"type": "single", "year": "2020", "title": "属于销售预测定量分析方法的是(    )。", "options": ["营销员判断法", "专家判断法", "产品寿命周期分析法", "趋势预测分析法"], "answer": [3], "explain": "销售预测的定性分析法包括营销员判断法、专家判断法、产品寿命周期分析法。销售预测定量分析方法包括趋势预测分析法和因果预测分析法，故选项D正确。"},
      {"type": "single", "year": "2014", "title": "下列销售预测方法中，属于因果预测分析法的是(    )。", "options": ["指数平滑法", "移动平均法", "专家小组法", "回归直线法"], "answer": [3], "explain": "选项AB属于定量预测中的趋势预测分析法。选项C属于定性分析法。因果预测分析法是指分析影响产品销售量(因变量)的相关因素(自变量)以及它们之间的函数关系，并利用这种函数关系进行产品销售预测的方法。因果预测分析法最常用的是回归直线法。"},
      {"type": "multi", "year": "", "title": "某企业研发的新产品正处在推广期，对其进行销售预测的方法主要有(    )。", "options": ["营销员判断法", "专家预测法", "趋势分析法", "因果预测分析法"], "answer": [0, 1], "explain": "定性分析法一般适用于预测对象的历史资料不完备或无法进行定量分析。主要包括营销员判断法(意见汇集法)、专家判断法和产品寿命周期分析法。新产品还没有完备的历史资料，所以选项AB正确。"},
      {"type": "single", "year": "", "title": "下列销售预测方法中，属于因果预测分析法的是(　)。", "options": ["指数平滑法", "移动平均法", "专家小组法", "回归直线法"], "answer": [3], "explain": "因果预测分析法是指通过影响产品销售量(因变量)的相关因素(自变量)以及它们之间的函数关系，并利用这种函数关系进行产品销售预测的方法。因果预测分析法最常用的是回归分析法。"},
      {"type": "single", "year": "", "title": "A公司采用修正的移动平均法按月预测销售量，样本期为3期。已知7、8、9三个月的实际销售量分别为1050件、1120件、1100件，预测销售量为1070件、1150件、1110件。根据上述资料，可预测A公司10月份的销售量为( 　)件。", "options": ["1070", "1080", "1100", "1090"], "answer": [0], "explain": "移动平均法下的预测销量＝(1050＋1120＋1100)/3＝1090(件)，修正移动平均法下的预计销量＝1090＋(1090－1110)＝1070(件)"},
      {"type": "single", "year": "", "title": "已知某公司去年的实际销售量为5400吨，假设原预测销售量为5260吨，平滑指数为0.6。若采用指数平滑法，则今年的预测销售量是(    )吨。", "options": ["5 316", "5 344", "5 330", "5 635"], "answer": [1], "explain": "预测销售量＝5400×0.6＋5260×(1－0.6)＝5344(吨)，选项B当选。"},
      {"type": "single", "year": "", "title": "某产品2024年预测销售量为3750吨，实际销售量为4000吨，若平滑指数为0.4，则根据指数平滑法预测该产品2025年的销售量为(    )吨。", "options": ["3750", "3900", "3850", "3875"], "answer": [2], "explain": "预测销售量=0.4×4000+(1-0.4)×3750=3850(吨)。选项C当选。"},
      {"type": "single", "year": "", "title": "某产品保本点销量为25万件，边际贡献率为40%，固定成本总额为100万元。运用保本点定价法确定该产品单价为（      ）元。", "options": ["4", "6.67", "1.6", "10"], "answer": [3], "explain": "假设运用保本点定价法确定的单价为X元，则有25×40%×X-100=0，求解得:单价=100÷(25×40%）=10（元），选项D当选。"},
      {"type": "single", "year": "", "title": "某企业生产销售甲产品，产销平衡，单价为100元/件，单位变动成本为50元/件，固定成本为8000元，利息费用为2000元，若目标税后利润为30000元，企业所得税税率为25%，则实现目标利润的销售量为(     )件。", "options": ["1000", "800", "600", "960"], "answer": [0], "explain": "息税前利润=税后利润÷(1-所得税税率)+利息费用=30000÷(1-25%)+2000=42000(元)，实现目标利润销售量=(固定成本+目标息税前利润)÷(单价-单位变动成本)=(8000+42000)÷(100-50)=1000(件)。选项A当选。"},
      {"type": "single", "year": "", "title": "某公司生产并销售单一产品，适用的消费税税率为5%，本期计划销售量为80000件，公司产销平衡，完全成本总额为360000元，公司将目标利润定为400000元，则单位产品价格应为（    ）元。", "options": ["10", "5", "9.5", "4.5"], "answer": [0], "explain": "单位产品价格=（400000+360000）/[80000×（1-5%）]=10（元）。"},
      {"type": "multi", "year": "2017", "title": "下列各项中，可以作为企业产品定价目标的有(    )。", "options": ["实现利润最大化", "保持或提高市场占有率", "应对和避免市场竞争", "树立企业形象"], "answer": [0, 1, 2, 3], "explain": "企业的定价目标主要有：实现利润最大化、保持或提高市场占有率、稳定价格、应付和避免竞争、树立企业形象及产品品牌。"},
      {"type": "multi", "year": "", "title": "下列各项产品定价方法中，以市场需求为基础的有(　)。", "options": ["目标利润定价法", "需求价格弹性系数定价法", "边际分析定价法", "变动成本加成定价法"], "answer": [1, 2], "explain": "以市场需求为基础的定价方法主要有需求价格弹性系数定价法和边际分析定价法等。"},
      {"type": "single", "year": "2021", "title": "产品A的销量为1 000件，完全成本总额为19 000元，目标利润为95 000元，消费税税率5%。则该产品的单价为(    )元。", "options": ["108.3", "120", "80", "72.2"], "answer": [1], "explain": "令：p×1000－19000－p×1000×5%＝950000，该产品的单价＝(95000＋19000)/(1000×(1－5%))＝120(元)。"},
      {"type": "single", "year": "", "title": "A企业生产甲产品，预计单位产品的制造成本为100元，计划销售5 000件，计划期的期间费用总额为40 000元，该产品适用的消费税税率为5%，成本利润率必须达到20%，根据上述资料，运用全部成本费用加成定价法测算的单位甲产品的价格应为(    )元。", "options": ["136.42", "120.58", "195.24", "135.47"], "answer": [0], "explain": "令：p×5000－(100×5000＋40000)－p×5000×5%＝(100×5000＋40000)×20%，单位甲产品价格＝(100＋40000/5000)×(1＋20%)/(1－5%)＝136.42(元)。"},
      {"type": "single", "year": "2018", "title": "在生产能力有剩余的情况下，下列各项成本中，适合作为增量产品定价基础的是(    )。", "options": ["固定成本", "制造成本", "全部成本", "变动成本"], "answer": [3], "explain": "变动成本是指在特定的业务量范围内，其总额会随业务量的变动而变动的成本。在生产能力有剩余的情况下，不需要增加固定成本开支，因此变动成本适合作为增量产品定价基础。"},
      {"type": "single", "year": "2018", "title": "下列各项中，以市场需求为基础的定价方法是(    )。", "options": ["保本点定价法", "目标利润定价法", "边际分析定价法", "全部成本费用加成定价法"], "answer": [2], "explain": "以市场需求为基础的定价方法主要有需求价格弹性系数定价法和边际分析定价法等。"},
      {"type": "single", "year": "", "title": "某商品标价为999元，该商品采用的定价策略是(    )。", "options": ["整数定价策略", "尾数定价策略", "声望定价策略", "双位定价策略"], "answer": [1], "explain": "心理定价策略主要有声望定价、尾数定价、双位定价和高位定价等。从题目可以看出，没有任何信息说明定价属于声望定价、双位定价或是高位定价。尾数定价，是利用消费者在数字认识上的某种心理制定尾数价格，使消费者产生商品价格较廉、商家定价认真以及售价接近成本等信任感。"},
      {"type": "multi", "year": "", "title": "纳税筹划可以利用的税收优惠政策筹划法包括(    )。", "options": ["税收扣除政策", "减税政策", "免税政策", "退税政策"], "answer": [0, 1, 2, 3], "explain": "利用税收优惠政策筹划法进行纳税筹划的主要政策包括利用免税政策、利用减税政策、利用退税政策、利用税收扣除政策、利用税率差异、利用分劈技术、利用税收抵免。"},
      {"type": "judge", "year": "", "title": "企业纳税筹划的表现为减少税负和递延纳税。", "options": ["对", "错"], "answer": [1], "explain": "纳税筹划的外在表现是降低税负和延期纳税(即递延纳税)。"},
      {"type": "single", "year": "", "title": "在税法许可的范围内，下列纳税筹划方法中，能够导致递延纳税的是(    )。", "options": ["固定资产加速折旧法", "费用在母子公司之间合理分劈法", "转让定价筹划法", "研究开发费用加计扣除法"], "answer": [0], "explain": "利用会计处理方法进行递延纳税筹划主要包括存货计价方法的选择和固定资产折旧的纳税筹划，所以选项A正确。"},
      {"type": "judge", "year": "2020", "title": "企业利用有息债务筹资可以获得节税效应。", "options": ["对", "错"], "answer": [1], "explain": "利息税前扣除，可以抵税，所以企业利用有息债务筹资可以获得节税效应。"},
      {"type": "single", "year": "", "title": "已知当前的国债利率为3%，某公司适用的所得税税率为25%。出于追求最大税后收益的考虑，该公司决定购买一种金融债券。该金融债券的利率至少应为(    )。", "options": ["2.65%", "3%", "3.75%", "4%"], "answer": [3], "explain": "企业所得税法规定，国债利息收益免交企业所得税，而购买企业债券取得的收益需要缴纳企业所得税。因此企业购买的金融债券收益要想不小于国债的收益，其利率至少为3%/(1－25%)＝4%。"},
      {"type": "single", "year": "", "title": "下列关于企业投资纳税管理的说法中，不正确的是(    )。", "options": ["直接对内投资纳税管理中，主要对长期经营资产进行纳税筹划", "与直接投资相比，间接投资考虑的税收因素较少，没有纳税筹划的空间", "投资组织形式的纳税筹划属于直接对外投资纳税管理", "根据企业分支机构可能存在的盈亏不均、税率差别等因素来决定分支机构的设立形式，能合法、合理地降低税收成本"], "answer": [1], "explain": "间接投资与直接投资相比，间接投资考虑的税收因素较少，但也有纳税筹划的空间。在投资金额一定时，证券投资决策的主要影响因素是证券的投资收益，不同种类证券收益应纳所得税不同，在投资决策时，应该考虑其税后收益。"},
      {"type": "single", "year": "2019", "title": "股利无关论认为股利分配对公司市场价值不产生影响，下列关于股利无关理论的假设表述错误的是(    )。", "options": ["投资决策不受股利分配的影响", "不存在股票筹资费用", "不存在资本增值", "不存在个人或公司所得税"], "answer": [2], "explain": "股利无关论是建立在完全资本市场理论之上的，假定条件包括：第一，市场具有强式效率，没有交易成本，没有任何一个股东的实力足以影响股票价格；第二，不存在任何公司或个人所得税；第三，不存在任何筹资费用；第四，公司的投资决策与股利决策彼此独立，即投资决策不受股利分配的影响；第五，股东对股利收入和资本增值之间并无偏好。"},
      {"type": "single", "year": "2021", "title": "有观点认为，投资者一般是风险厌恶型的，偏好确定的股利收益，不愿将收益留在公司而承担未来的投资风险。因此，支付较高股利有助于提高股价和公司价值。这种观点被称为(    )。", "options": ["“手中鸟”理论", "信号传递理论", "所得税差异理论", "代理理论"], "answer": [0], "explain": "“手中鸟”理论认为，厌恶风险的投资者会偏好确定的股利收益，而不愿将收益留存在公司内部去承担未来的投资风险。当公司支付较高的股利时，公司的股票价格会随之上升，公司的价值将得到提高。"},
      {"type": "single", "year": "2017", "title": "下列股利理论中，支持“低现金股利有助于实现股东利益最大化目标”观点的是(    )。", "options": ["信号传递理论", "所得税差异理论", "“手中鸟”理论", "代理理论"], "answer": [1], "explain": "选项A信号传递理论和选项C“手中鸟”理论都是认为高现金股利有助于实现股东利益最大化目标，所以选项AC错误。所得税差异理论是支持低现金股利有助于实现股东利益最大化目标，选项B正确。代理理论认为使得代理成本和外部融资成本二者之和最小的股利政策是最优股利政策，选项D错误。"},
      {"type": "multi", "year": "2020", "title": "下列关于股利政策的说法中，符合代理理论观点的有(    )。", "options": ["股利政策应当向市场传递有关公司未来获利能力的信息", "股利政策是协调股东与管理者之间代理关系的约束机制", "高股利政策有利于降低公司的代理成本", "理想的股利政策应当是发放尽可能高的现金股利"], "answer": [1, 2], "explain": "选项A属于信号传递理论的观点。代理理论认为高水平的股利政策降低了企业的代理成本，但同时增加了外部融资成本，理想的股利政策应当使两种成本之和最小，所以选项C正确、选项D错误。"},
      {"type": "single", "year": "2021", "title": "某公司目标资本结构要求权益资本占55%，2020年的净利润为2 500万元，预计2021年投资所需资金为3 000万元。按照剩余股利政策。2020年可发放的现金股利为(    )。", "options": ["850万元", "1 150万元", "1 375万元", "1125万元"], "answer": [0], "explain": "2020年可发放的现金股利＝2500－3000×55%＝850(万元)"},
      {"type": "judge", "year": "", "title": "某公司目标资本结构要求权益资本占60%，2022年的净利润为2 000万元，预计2023年的投资需求为1 000万元。按照剩余股利政策，2022年可发放的现金股利为1 400万元。", "options": ["对", "错"], "answer": [1], "explain": "可发放的现金股利＝2000－1000×60%＝1400(万元)"},
      {"type": "multi", "year": "", "title": "下列股利分配理论中，认为股利政策会影响公司的价值的有（     ）。", "options": ["信号传递理论", "所得税差异理论", "手中鸟理论", "代理理论"], "answer": [0, 1, 2, 3], "explain": "股利相关理论认为企业的股利政策会影响股票价格和公司价值。股利相关理论的主要观点包括手中鸟理论、信号传递理论、所得税差异理论、代理理论，选项A、B、C、D均当选。"},
      {"type": "judge", "year": "", "title": "采用剩余股利政策，在有投资机会时，企业使用留存收益来满足目标资本结构所需的权益资本数额。", "options": ["对", "错"], "answer": [1], "explain": "剩余股利政策是公司在有良好投资机会时，根据目标资本结构测算出投资所需的权益资本额，先从盈余中留用，然后将剩余的盈余作为股利发放。本题表述正确。"},
      {"type": "judge", "year": "", "title": "处于衰退期的企业在制定收益分配政策时，应当优先考虑企业积累。", "options": ["对", "错"], "answer": [1], "explain": "由于企业处于衰退期，此时企业将留存收益用于再投资所得报酬率低于股东个人单独将股利收入投资于其他投资机会所得的报酬率，企业就不应多保留留存收益，而应多发股利，这样有利于股东财富的最大化。"},
      {"type": "judge", "year": "2020", "title": "采用剩余股利政策，在有投资机会时，企业偏向留存收益进行筹资。", "options": ["对", "错"], "answer": [1], "explain": "剩余股利政策是公司在有良好投资机会时，根据目标资本结构，测算出投资所需的权益资本额，先从盈余中留用，然后将剩余的盈余作为股利发放。"},
      {"type": "single", "year": "2024", "title": "下列股利政策中，最有利于保持最优资本结构、降低公司加权平均资本成本的是(   )。", "options": ["固定或稳定增长的股利政策", "剩余股利政策", "低正常股利加额外股利政策", "固定股利支付率政策"], "answer": [1], "explain": "剩余股利政策的优点:（1）保持目标资本结构;（2）降低再投资的资金成本;（3）实现企业价值的长期最大化。因此，选项B正确。"},
      {"type": "multi", "year": "2015", "title": "下列各项中，属于剩余股利政策优点的有(    )。", "options": ["保持目标资本结构", "降低再投资资本成本", "使股利与企业盈余紧密结合", "实现企业价值的长期最大化"], "answer": [0, 1, 3], "explain": "剩余股利政策，有助于降低再投资的资金成本，保持最佳的资本结构，实现企业价值的长期最大化，所以选项ABD正确。在有良好的投资机会时，根据目标资本结构，测算出投资所需的权益资本额，先从盈余中留用，然后将剩余的盈余作为股利来分配，很难保证股利与企业盈余紧密结合，股利不仅受盈利水平的影响，还受未来每年投资机会的影响，所以选项C错误。"},
      {"type": "single", "year": "", "title": "某公司2022年度实现的净利润为2 000万元，分配现金股利1 200万元，2023年实现的净利润为2 400万元，若公司采用固定股利支付率政策，则2023年分配的现金股利为（   ）万元。", "options": ["960", "1 000", "1 200", "1 440"], "answer": [3], "explain": "股利支付率=1200/2000=60%，2023年分配的现金股利=2400×60%=1 440((万元)。"},
      {"type": "single", "year": "2024", "title": "下列各项中，属于公司采用固定或稳定增长股利政策优点的是(  )。", "options": ["有助于降低公司的财务风险", "有助于提高公司的盈利能力", "有助于增强投资者信心和稳定股票价格", "有助于增加公司的财务弹性"], "answer": [2], "explain": "固定或稳定增长股利政策的优点:①有利于树立公司的良好形象，增强投资者对公司的信心，稳定股票的价格。②有利于投资者安排股利收入和支出，有利于吸引那些打算进行长期投资并对股利有很高依赖性的股东。③为将股利或股利增长率维持在稳定的水平上，即使推迟某些投资方案或暂时偏离目标资本结构，也可能要比降低股利或降低股利增长率更为有利。"},
      {"type": "multi", "year": "2018", "title": "下列各项中，属于固定或稳定增长的股利政策优点的有(    )。", "options": ["稳定的股利有利于稳定股价", "稳定的股利有利于树立公司的良好形象", "稳定的股利使股利与公司盈余密切挂钩", "稳定的股利有利于优化公司资本结构"], "answer": [0, 1], "explain": "固定或稳定增长的股利政策可能会偏离目标资本结构，与公司盈余脱节。"},
      {"type": "multi", "year": "2022", "title": "下列各项中，属于固定股利支付率政策缺点的有(    )。", "options": ["股利波动容易给投资者带来投资风险较大的不良影响", "难以确定合适的固定股利支付率", "股利的支付与公司盈利脱节", "股利波动容易向投资者传递公司经营状况不稳定的负面信号"], "answer": [0, 1, 3], "explain": "股利的支付与公司盈利脱节是固定或稳定增长的股利政策的缺点，选项C不当选。"},
      {"type": "single", "year": "", "title": "下列关于股利政策的说法中，错误的是(    )。", "options": ["采用剩余股利政策，可以保持理想的资本结构，使加权平均资本成本最低", "采用固定股利支付率政策，可以使股利和公司盈余紧密配合，但不利于稳定股票价格", "采用固定股利或稳定增长股利政策，当盈余较低时，容易导致公司资金短缺，增加公司风险", "采用低正常股利加额外股利政策，股利和盈余不匹配，公司没有财务弹性"], "answer": [3], "explain": "低正常股利加额外股利政策，公司可以根据公司各年的具体情况，选择不同的股利发放水平，赋予公司较大的灵活性，具有较大的财务弹性，有助于稳定和提高股价。所以，选项D的说法错误。"},
      {"type": "judge", "year": "2020", "title": "与固定股利政策相比，低正常股利加额外股利政策赋予公司股利发放的灵活性。", "options": ["对", "错"], "answer": [1], "explain": "低正常股利加额外股利政策下，公司可根据每年的具体情况，选择不同的股利发放水平，所以赋予了公司较大的灵活性。本题表述正确。"},
      {"type": "single", "year": "", "title": "下列关于股利分配政策的表述中，正确的是(    )。", "options": ["公司盈余的稳定程度与股利支付水平负相关", "偿债能力弱的公司一般不应采用高现金股利政策", "基于控制权的考虑，股东会倾向于较高的股利支付水平", "债权人不会影响公司的股利分配政策"], "answer": [1], "explain": "一般来讲，公司的盈余越稳定，其股利支付水平也就越高，选项A不正确；基于控制权的考虑，股东会倾向于较低的股利支付水平，选项C不正确；债权人通常都会在债务契约、租赁合同中加入关于借款企业股利政策的限制条款，选项D不正确。"},
      {"type": "multi", "year": "", "title": "下列各项中，属于剩余股利政策优点的有(    )。", "options": ["保持目标资本结构", "降低再投资资本成本", "使股利与企业盈余紧密结合", "实现企业价值的长期最大化"], "answer": [0, 1, 3], "explain": "剩余股利政策的优点：净利润优先满足再投资的需要，有助于降低再投资的资本成本，保持最佳的资本结构，实现企业价值的长期最大化。剩余股利政策的缺陷：若完全遵照执行剩余股利政策，股利发放额就会每年随着投资机会和盈利水平的波动而波动。在盈利水平不变的前提下，股利发放额与投资机会的多少呈反方向变动；而在投资机会维持不变的情况下，股利发放额将与公司盈利呈同方向波动。所以，选项A、B、D正确。"},
      {"type": "judge", "year": "", "title": "在固定股利支付率政策下，各年的股利随着收益的波动而波动，容易给投资者带来公司经营状况不稳定印象。", "options": ["对", "错"], "answer": [1], "explain": "大多数公司每年的收益很难保持稳定不变，导致年度间的股利额波动较大，由于股利的信号传递作用，波动的股利很容易给投资者带来经营状态不稳定、投资风险较大的不良印象，成为影响股价的不利因素。"},
      {"type": "single", "year": "", "title": "有种观点认为，企业支付高现金股利可以减少管理者对于自由现金流量的支配，从而在一定程度上抑制管理者的在职消费，持这种观点的股利分配理论是(    )。", "options": ["所得税差异理论", "代理理论", "信号传递理论", "“手中鸟”理论"], "answer": [1], "explain": "代理理论认为，股利的支付能够有效地降低代理成本。首先，股利的支付减少了管理者对自由现金流量的支配权，这在一定程度上可以抑制公司管理者的过度投资或在职消费行为，从而保护外部投资者的利益；其次，较多的现金股利发放，减少了内部融资，导致公司进入资本市场寻求外部融资，从而公司将接受资本市场上更多的、更严格的监督，这样便通过资本市场的监督减少了代理成本。"},
      {"type": "single", "year": "", "title": "处于初创阶段的公司，最适合采用的股利分配政策是(    )。", "options": ["固定股利政策", "剩余股利政策", "固定股利支付率政策", "稳定增长股利政策"], "answer": [1], "explain": "剩余股利政策不利于投资者安排收入与支出，也不利于公司树立良好的形象，一般适用于公司初创阶段(选项B当选)；固定或稳定增长的股利政策通常适用于经营比较稳定或正处于成长期的企业，但很难被长期采用；固定股利支付率政策比较适用于那些处于稳定发展并且财务状况也比较稳定的公司。"},
      {"type": "multi", "year": "", "title": "对公司而言，发放股票股利的优点有(    )。", "options": ["减轻公司现金支付压力", "使股权更为集中", "可以向市场传递公司未来发展前景良好的信息", "有利于股票交易和流通"], "answer": [0, 2, 3], "explain": "对公司来讲，股票股利的优点主要有：(1)发放股票股利不需要向股东支付现金，在再投资机会较多的情况下，公司就可以为再投资提供成本较低的资金，从而有利于公司的发展，选项A当选。(2)发放股票股利可以降低公司股票的市场价格，既有利于促进股票的交易和流通，又有利于吸引更多的投资者成为公司股东，进而使股权更为分散，有效地防止公司被恶意控制，选项B不当选、选项D当选。(3)股票股利的发放可以传递公司未来发展前景良好的信息，从而增强投资者的信心，在一定程度上稳定股票价格，选项C当选。"},
      {"type": "judge", "year": "", "title": "某上市公司于 2023 年 3 月 25 日公布 2022 年度的分红方案，股权登记日为 4 月 10 日，除息日为 4 月 11 日，则 4 月 11 日购入股票的投资者不能分享公司本次宣告发放的股利。", "options": ["对", "错"], "answer": [1], "explain": "除息日指领取股利的权利与股票分离的日期。在除息日之前购买股票的股东才能领取本次股利，而在除息日当天或是以后购买股票的股东则不能领取本次股利。本题表述正确。"},
      {"type": "single", "year": "2021", "title": "企业以增发股票的方式支付股利,这个行为对公司的影响是(    )。", "options": ["减少公司资产总额", "减少股东权益总额", "改变股东权益结构", "导致现金流出"], "answer": [2], "explain": "发放股票股利对于公司来说，并没有现金流出，也不会导致公司的财产减少，而只是将公司的未分配利润转化为股本和资本公积。它不会改变股东权益总额，但会改变股东权益的构成。"},
      {"type": "multi", "year": "2017", "title": "对公司而言，发放股票股利的优点有(    )。", "options": ["减轻公司现金支付压力", "使股权更为集中", "可以向市场传递公司未来发展前景良好的信息", "有利于股票交易和流通"], "answer": [0, 2, 3], "explain": "发放股票股利不需要向股东支付现金，选项A正确；发放股票股利可以降低公司股票的市场价格，有利于促进股票的交易和流通，选项D正确；发放股票股利会使股权更为分散，选项B错误；发放股票股利可以传递公司未来发展前景良好的信息，选项C正确。"},
      {"type": "judge", "year": "2023", "title": "某上市公司于2023年3月25日公布2022年度的分红方案，股权登记日为4月10日，除息日为4月11日，则4月11日购入股票的投资者不能分享公司本次宣告发放的股利。", "options": ["对", "错"], "answer": [1], "explain": "除息日，即领取股利的权利与股票分离的日期。在除息日之前购买股票的股东才能领取本次股利，而在除息日当天或是以后购买股票的股东，则不能领取本次股利。"},
      {"type": "single", "year": "2024", "title": "某公司将所持有的其他公司股票作为股利支付给本公司股东，这种股利支付形式是(   )。", "options": ["负债股利", "股票股利", "财产股利", "现金股利"], "answer": [2], "explain": "财产股利是以现金以外的其他资产支付的股利，主要是以公司所拥有的其他公司的有价证券，如债券、股票等，作为股利支付给股东。"},
      {"type": "judge", "year": "2022", "title": "在上市公司股利分配中，除息日当天购买股票的投资者拥有领取本次股利的权利。", "options": ["对", "错"], "answer": [1], "explain": "在除息日之前购买的股票才能领取本次股利， 而在除息日当天或是以后购买的股票， 则不能领取本次股利，本题表述错误。"},
      {"type": "single", "year": "2016", "title": "要获得收取股利的权利，投资者购买股票的最迟日期是(    )。", "options": ["除息日", "股权登记日", "股利宣告日", "股利发放日"], "answer": [1], "explain": "股权登记日即有权领取本期股利的股东资格登记截止日期，凡是在此指定日期收盘之前取得公司股票，成为公司在册股东的投资者都可以作为股东享受本期分派的股利。在这一天之后取得股票的股东则无权领取本次分派的股利。"},
      {"type": "multi", "year": "2021", "title": "某公司发放股利前的股东权益如下：股本3000万元(每股面值1元)，资本公积2000万元，盈余公积2000万元，未分配利润5000万元。若每10股发放1股普通股作为股利，股利按市价(每股10元)计算，则公司发放股利后，下列说法正确的有(    )。", "options": ["未分配利润的金额为2000万元", "股东权益的金额为12000万元", "股本的金额为3300万元", "盈余公积的金额为4700万元"], "answer": [0, 1, 2], "explain": "发放股票股利后，未分配利润＝5000－3000/10×10＝2000(万元)，股本＝3000＋3000/10×1＝3300(万元)，资本公积＝2000＋3000/10×(10－1)＝4700(万元)，发放股票股利不影响盈余公积，选项A、C正确，选项D错误。发放股票股利前后股东权益金额不变，仍为3000＋2000＋2000＋5000＝12000(万元)，选项B正确。"},
      {"type": "multi", "year": "2024", "title": "关于股票分割下列表述错误的有(   )。", "options": ["会引起发行在外的股票总数变化", "会引起每股股票面值变化", "会引起股东权益总额变化", "会引起股东权益内部结构变化"], "answer": [2, 3], "explain": "股票分割，又称拆股，即将一股股票拆分成多股股票的行为。股票分割会增加发行在外的股票总数，但不会对公司的资本结构产生任何影响。每股股票面值会降低，股东权益内部结构无变化。"},
      {"type": "single", "year": "2022", "title": "关于股票分割和股票股利，下列说法正确的是(    )。", "options": ["均会改变股票面值", "均会增加股份数量", "均会增加股东权益总额", "均会改变股东权益的结构"], "answer": [1], "explain": "股票股利不会改变股票面值，选项A不当选；股票分割和股票股利均会使普通股股数增加，选项B当选；股票分割和股票股利均不会改变股东权益总额，选项C不当选；股票分割不会改变股东权益结构，选项D不当选。"},
      {"type": "multi", "year": "", "title": "股票股利和股票分割的相同点有(    )。", "options": ["会导致普通股股数增加", "当市盈率与收益总额不变时，都会导致每股收益和每股市价下降", "股东权益总额不变", "会导致股东权益内部结构变化"], "answer": [0, 1, 2], "explain": "股票分割不会导致股东权益内部结构的变化。"},
      {"type": "single", "year": "", "title": "下列因素可能改变企业的资本结构的是(    )。", "options": ["股票回购", "股票股利", "股票分割", "股票合并"], "answer": [0], "explain": "股票回购，股东权益减少，则资本结构改变。其他都不改变股东权益总额，所以不改变资本结构。"},
      {"type": "single", "year": "", "title": "股票回购对上市公司的影响是(    )。", "options": ["有利于保护债权人利益", "分散控股股东的控制权", "有利于降低公司财务风险", "降低资产流动性"], "answer": [3], "explain": "股票回购对上市公司的影响主要表现在以下几个方面：(1)股票回购需要大量资金支付回购成本，容易造成资金紧张，降低资产流动性，影响公司的后续发展；(2)股票回购无异于股东退股和公司资本的减少，也可能会使公司的发起人股东更注重创业利润的实现，从而不仅在一定程度上削弱了对债权人利益的保护，而且忽视了公司的长远发展，损害了公司的根本利益；(3)股票回购容易导致公司操纵股价。公司回购自己的股票容易导致其利用内幕消息进行炒作，加剧公司行为的非规范化，损害投资者的利益。选项D正确。"},
      {"type": "judge", "year": "2017", "title": "由于信息不对称和预期差异，投资者会把股票回购当做公司认为其股票价格被高估的信号。", "options": ["对", "错"], "answer": [1], "explain": "由于信息不对称和预期差异，证券市场上的公司股票价格可能被低估，而过低的股价将会对公司产生负面影响。一般情况下，投资者会认为股票回购意味着公司认为其股票价值被低估而采取的应对措施。因此本题说法错误。"},
      {"type": "single", "year": "2017", "title": "若激励对象没有实现约定的目标，公司有权将免费赠与的股票收回，这种股权激励是(    )。", "options": ["股票期权模式", "业绩股票模式", "股票增值权模式", "限制性股票模式"], "answer": [3], "explain": "限制性股票指公司为了实现某一特定目标，公司先将一定数量的股票赠与或以较低价格售予激励对象，若激励对象没有实现约定的目标，公司有权将免费赠与的股票收回，选项D正确。"},
      {"type": "multi", "year": "", "title": "下列关于股权激励模式的表述中，正确的有(    )。", "options": ["股票期权模式适合那些处于成长初期或扩张期的企业", "限制性股票模式适用于那些处于成熟期的企业", "在股票增值权模式下激励对象需要为行权支付现金", "业绩股票激励模式适合业绩稳定型的上市公司"], "answer": [0, 1, 3], "explain": "股票期权模式比较适合那些初始资本投入较少、资本增值较快、处于成长初期或扩张期的企业，如互联网、高科技等风险较高的企业等，选项A当选。对于处于成熟期的企业，由于其股价的上涨空间有限，因此采用限制性股票模式较为合适，选项B当选。在股票增值权模式下激励对象不用为行权支付现金，行权后由公司支付现金、股票或者股票和现金的组合，选项C不当选。业绩股票激励模式只对公司的业绩目标进行考核，不要求股价的上涨，因此比较适合业绩稳定型的上市公司及其集团公司、子公司，选项D当选。"},
      {"type": "judge", "year": "", "title": "业绩股票激励模式只对业绩目标进行考核，而不要求股价的上涨，因而比较适合业绩稳定的上市公司。", "options": ["对", "错"], "answer": [1], "explain": "业绩股票激励模式只对公司的业绩目标进行考核，不要求股价的上涨，因此比较适合业绩稳定型的上市公司及其集团公司、子公司。"},
      {"type": "single", "year": "2021", "title": "某公司将1%的股票赠与管理者以激励其实现设定的业绩目标，如果目标未实现，公司有权将股票收回，这种股权激励模式是(    )。", "options": ["股票期权模式", "股票增值权模式", "业绩股票激励模式", "限制性股票模式"], "answer": [3], "explain": "限制性股票模式是指公司为了实现某一特定目标，先将一定数量的股票赠与或以较低价格售予激励对象。只有当实现预定目标后，激励对象才可将限制性股票抛售并从中获利；若预定目标没有实现，公司有权将免费赠与的限制性股票收回或者将售出股票以激励对象购买时的价格回购。"},
      {"type": "single", "year": "2020", "title": "某公司对公司高管进行股权激励，约定每位高管自即日起只要在公司工作满三年，即有权按每股10元的价格购买本公司股票50万股，该股权激励模式属于(    )。", "options": ["股票期权模式", "限制性股票模式", "业绩股票激励模式", "股票增值权模式"], "answer": [0], "explain": "股票期权模式是指上市公司授予激励对象在未来一定期限内以预先确定的条件购买本公司一定数量股份的权利。"},
      {"type": "judge", "year": "2021", "title": "公司采用股票期权激励高管，如果行权期内的行权价格高于股价，则激励对象可以通过行权获得收益。", "options": ["对", "错"], "answer": [1], "explain": "公司采用股票期权激励高管，在行权期内，如果股价高于行权价格，激励对象可以通过行权获得市场价与行权价格差带来的收益。"},
      {"type": "single", "year": "", "title": "某产品的需求价格弹性为-3，2023年的销售收入400万元，预计2024年销售价格会提高10%，2024年的收入预计为（    ）万元。", "options": ["132", "280", "308", "360"], "answer": [2], "explain": "需求价格弹性为-3，即销售单价上升10%，销售量下降30%。2024年的收入=2023年的销售量×（1－30%）×2023年的销售单价×（1＋10%）=400×70%×110%=308（万元）。"},
      {"type": "multi", "year": "", "title": "关于股票股利与股票分割，在其他条件不变情况下，下列说法正确的有（    ）。", "options": ["均不改变股东权益内部结构", "均不改变持股比例", "均不改变资本结构", "均无现金流出"], "answer": [1, 2, 3], "explain": "股票股利与股票分割均不会导致股东权益总额变化，不改变持股比例，也不改变资本结构，无现金流出，选项B、C、D当选。股票股利会导致股本或资本公积增加，未分配利润减少，所以会改变股东权益内部结构，选项A不当选。"},
      {"type": "multi", "year": "", "title": "关于股票期权激励模式，下列表述正确的有(    )。", "options": ["激励对象可能遭遇来自股票市场的风险", "能够抑制受激励的经营者片面追求股价提升的短期行为", "股票期权激励有助于降低企业的委托代理成本", "激励对象行权将影响到现有股东的权益"], "answer": [0, 2, 3], "explain": "股票期权模式的优点:①能够降低委托代理成本，并且有利于降低激励成本，选项C当选;②可以锁定期权人(激励对象)的风险。股票期权模式的缺点:①影响现有股东的权益，选项D当选;②期权人(激励对象)可能遭遇来自股票市场的风险，选项A当选;③可能带来经营者的短期行为，选项B不当选。"},
      {"type": "judge", "year": "", "title": "公司回购股票并注销，提高了企业的财务杠杆水平，改变了资金成本结构。", "options": ["对", "错"], "answer": [1], "explain": "回购股票并注销后，所有者权益减少，而负债不变，会提高企业的财务杠杆水平，资金成本结构也会改变。本题表述正确。"},
      {"type": "judge", "year": "", "title": "根据边际分析定价法，边际利润为零时的价格是最低价格。", "options": ["对", "错"], "answer": [1], "explain": "根据边际分析定价法，边际利润为零时的价格是 最优销售价格 。本题表述错误。"},
      {"type": "multi", "year": "", "title": "下列关于股票分割的表述中，错误的有（     ）。", "options": ["会引起每股股票面值变化", "会引起股东权益内部结构变化", "会引起股东权益总额变化", "会引起发行在外的股票总数变化"], "answer": [1, 2], "explain": "股票分割会导致每股股票面值变小，选项 A 不当选;股票分割不会使股东权益内部结构发生变化，选项 B 当选;股票分割不会引起股东权益总额变化， 选项 C 当选;股票分割会导致发行在外的股票总数增加，选项 D 不当选。"},
      {"type": "judge", "year": "", "title": "股票分割会引起股东权益内部结构发生改变。", "options": ["对", "错"], "answer": [1], "explain": "股票分割不会改变股东权益内部结构。本题表述错误。"},
      {"type": "single", "year": "", "title": "关于股票回购和发放现金股利对公司影响的表述中，错误的是（    ）。", "options": ["均减少公司现金", "均减少所有者权益", "均降低公司股票市场价格", "均改变所有者权益结构"], "answer": [2], "explain": "发放现金股利会降低公司股票市场价格，而股票回购会提高公司股票市场价格。选项C当选。"},
      {"type": "judge", "year": "", "title": "股票分割会使股票的每股市价下降，但可以提高股票的流动性。", "options": ["对", "错"], "answer": [1], "explain": "股票分割是指将一股股票拆分成多股股票的行为，可以使股数增加，使每股市价降低的同时增加股票的流动性。"},
      {"type": "judge", "year": "", "title": "公司进行股票分割后，发行在外的股票总数增加，而股东权益总额与资本结构并不发生改变。", "options": ["对", "错"], "answer": [1], "explain": "股票分割之后，变化的只是股票面值和股票总数，股东权益总额及其内部结构与资本结构都不会发生任何变化。本题表述正确。"},
      {"type": "multi", "year": "", "title": "假设某股份公司按照1:2的比例进行股票分割，下列正确的有（    ）。", "options": ["股本总额增加一倍", "每股净资产保持不变", "股东权益总额保持不变", "股东权益内部结构保持不变"], "answer": [2, 3], "explain": "股票分割之后，股本、股东权益总额及其内部结构都不会发生任何变化。因为股数增加，股东权益总额不变，所以每股净资产下降。"},
      {"type": "judge", "year": "", "title": "由于信息不对称和预期差异，公司可以通过股票回购向投资者传递股票价格被高估的信号。", "options": ["对", "错"], "answer": [1], "explain": "由于信息不对称和预期差异，证券市场上的公司股票价格可能被低估，而过低的股价将会对公司产生负面影响。一般情况下，投资者会认为股票回购意味着公司认为其股票价格被低估而采取的应对措施。本题表述错误。"},

  "ch10": {
    "name": "第十章 财务分析与评价",
    "questions": [
      {"type": "judge", "year": "", "title": "在财务分析中，企业经营者应对企业财务状况进行全面的综合分析，并关注企业财务风险和经营风险。", "options": ["对", "错"], "answer": [1], "explain": "企业经营决策者必须对企业经营理财的各个方面，包括营运能力、偿债能力、盈利能力及发展能力的全部信息予以详尽的了解和掌握，进行各方面综合分析，并关注企业财务风险和经营风险。"},
      {"type": "single", "year": "2024", "title": "对比同一企业两期或连续数期财务报告中的相同指标，确定其增减变动的方向、数额和幅度的财务分析方法是（   ）。", "options": ["横向比较法", "因素分析法", "比率分析法", "趋势分析法"], "answer": [3], "explain": "财务分析的方法包括比较分析法、比率分析法和因素分析法。其中比较分析法，按比较对象的不同，分为趋势分析法，横向比较法和预算差异分析法。趋势分析法比较的对象是本企业历史数据，是通过对比两期或连续数期财务报告中的相同指标，确定其增减变动的方向、数额和幅度，来说明企业财务状况或经营成果变动趋势的一种方法。"},
      {"type": "judge", "year": "2021", "title": "第一年至三年的净利润分别4 000万元、5 000万元和5 600万元。如果以第一年为基期，这三年的定基动态比率为100%、125%和112%。", "options": ["对", "错"], "answer": [1], "explain": "第一年定基动态比率＝4000/4000＝100%，第二年定基动态比率＝5000/4000＝125%，第三年定基动态比率＝5600/4000＝140%。如果该题计算环比动态比率，则第一年环比动态比率＝4000/4000＝100%，第二年环比动态比率＝5000/4000＝125%，第三年环比动态比率＝5600/5000＝112%。"},
      {"type": "single", "year": "2017", "title": "下列财务比率中，属于效率比率的是(    )。", "options": ["速动比率", "成本利润率", "资产负债率", "所有者权益增长率"], "answer": [1], "explain": "效率比率是某项财务活动中所费与所得的比率，反映投入与产出的关系。比如，将利润项目与销售成本、销售收入、资本金等项目加以对比，可以计算出成本利润率、销售利润率和资本金利润率等指标，从不同角度观察比较企业获利能力的高低及其增减变化情况，故选项B正确。"},
      {"type": "multi", "year": "", "title": "下列关于流动比率的表述中，正确的有(　)。", "options": ["流动比率高不意味着短期偿债能力一定很强", "流动比率在不同行业、不同规模的公司之间具有较大的可比性", "营业周期较短的企业，合理的流动比率偏低", "流动比率容易受到人为操纵"], "answer": [0, 2, 3], "explain": "流动比率只有和同行业平均流动比率、本企业历史流动比率进行比较，行业间的差距很大，选项B的表述错误。"},
      {"type": "multi", "year": "", "title": "下列各项中，不属于速动资产的是(    )。", "options": ["货币资金", "存货", "应收票据", "预付账款"], "answer": [1, 3], "explain": "速动资产＝流动资产－存货－预付款项－一年内到期的非流动资产－其他流动资产等。所以，选项B、D不属于速动资产。"},
      {"type": "single", "year": "2021", "title": "下列各项中，既不影响现金比率又不影响速动比率的是(    )。", "options": ["交易性金融资产", "应收票据", "短期借款", "存货"], "answer": [3], "explain": "存货既不属于速动资产，也不属于现金资产，因此既不影响现金比率又不影响速动比率。"},
      {"type": "single", "year": "2024", "title": "某公司的流动资产总额为46亿元，其中货币资金为18亿元、应收账款为18.8亿元、存货为9.2亿元，流动负债总额为23亿元，则速动比率为(    )。", "options": ["1.18", "1.6", "2", "0.78"], "answer": [1], "explain": "速动资产=18＋18.8=36.8（亿元），速动比率=36.8/23=1.6。"},
      {"type": "single", "year": "2025", "title": "某公司2024年年末的营运资金为138万元，流动负债为112万元，存货为82万元，则年末的速动比率为(     )。", "options": ["0.5", "2.23", "1.96", "1.5"], "answer": [3], "explain": "流动资产=营运资金+流动负债=138+112=250(万元)，速动比率=(流动资产-存货)÷流动负债=(250-82) ÷ 112=1.5，选项D当选。"},
      {"type": "single", "year": "2022", "title": "某企业目前的速动比率大于1，若其他条件不变，下列措施中，能够提高该企业速动比率的是(    )。", "options": ["以银行存款偿还长期借款", "以银行存款购买原材料", "收回应收账款", "以银行存款偿还短期借款"], "answer": [3], "explain": "速动比率＝速动资产/流动负债，选项A，银行存款是速动资产，长期借款是非流动负债，偿还后速动资产减少，流动负债不变，速动比率降低。选项B，银行存款减少，速动资产减少，流动负债保持不变，速动比率降低。选项C，银行存款增加，应收账款减少，速动资产保持不变，流动负债保持不变，故速动比率保持不变。选项D，银行存款和短期借款减少相同金额，但因为速动比率大于1，所以速动资产减少幅度小于流动负债的减少幅度，速动比率会变大，所以选项D正确。"},
      {"type": "single", "year": "2025", "title": "下列各项因素中，能够提高公司短期偿债能力的是（   ）。", "options": ["派发股票股利", "用银行存款回购股票", "变卖闲置设备", "用银行存款购买存货"], "answer": [2], "explain": "变卖闲置设备会导致流动资产增加，固定资产减少，负债和股东权益不变，能够提高公司短期偿债能力，选项C当选。"},
      {"type": "single", "year": "2021", "title": "某公司流动比率为1.8，如果赊购一批原材料，则流动比率的变化方向是(    )。", "options": ["不变", "以上都有可能", "变大", "变小"], "answer": [3], "explain": "流动比率＝流动资产/流动负债，流动比率为1.8，说明流动资产大于流动负债。赊购一批原材料，会使流动资产和流动负债等额增长，流动负债的增长幅度大于流动资产的增长幅度，流动比率变小。"},
      {"type": "single", "year": "", "title": "下列各项中，不会提高公司流动比率的有(  )。", "options": ["公司用银行存款购置新生产线", "公司从商业银行取得长期借款", "公司收到客户上期所欠货款", "公司向供应商预付原材料采购款"], "answer": [0, 2, 3], "explain": "流动比率=流动资产/流动负债，选项A流动资产减少，固定资产增加，流动比率下降。选项B流动资产增加，长期负债增加，流动比率提高。选项C流动资产一增一减，流动比率不变。选项D流动资产一增一减，流动比率不变。所以选项ACD符合题意。"},
      {"type": "single", "year": "2021", "title": "某公司当前的速动比率大于1，若用现金偿还应付账款，则对流动比率与速动比率的影响是(    )。", "options": ["流动比率变小，速动比率变小", "流动比率变大，速动比率不变", "流动比率变大，速动比率变大", "流动比率不变，速动比率变大"], "answer": [2], "explain": "使用现金偿还应付账款，会使速动资产、流动负债减少相同的金额。速动比率大于1，分子分母减少相同的数值后速动比率变大；速动比率大于1，流动比率也是大于1，使用现金偿还应付账款，也会使得流动资产、流动负债减少相同数值，流动比率变大。"},
      {"type": "single", "year": "", "title": "下列业务中，能够降低企业短期偿债能力的是(    )。", "options": ["企业采用分期付款方式购置一台大型机械设备", "企业从银行取得5年期800万元的贷款", "企业向战略投资者进行定向增发", "企业向股东发放股票股利"], "answer": [0], "explain": "A选项分期付款购置固定资产，有可能当期的流动资产会下降，而下期将要到期的非流动负债(相当于一年内到期的流动负债)也会增加，也就是说分子上有可能下降，分母上有可能增加，所以短期偿债能力会下降；B选项货币资金会增加，因为5年期的贷款是非流动负债，所以分母的流动负债不变，短期偿债能力提高了；C选项定向增发后货币资金会增加，分母的流动负债不变，短期偿债能力提高了；D选项既不影响流动资产也不影响流动负债，短期偿债能力没有变化。"},
      {"type": "judge", "year": "2021", "title": "在资产负债率、产权比率和权益乘数三个指标中，已知其中一个指标值，就可以推算出另外两个指标值。", "options": ["对", "错"], "answer": [1], "explain": "权益乘数＝1/(1－资产负债率)＝1＋产权比率，因此已知其中一个指标值，就可以推算出另外两个指标值。"},
      {"type": "single", "year": "2021", "title": "关于产权比率指标和权益乘数指标之间的数量关系，下列表达式中正确的是(    )。", "options": ["权益乘数×产权比率＝1", "权益乘数－产权比率＝1", "权益乘数＋产权比率＝1", "权益乘数/产权比率＝1"], "answer": [1], "explain": "权益乘数＝总资产÷股东权益＝(总负债＋股东权益)/股东权益＝总负债/股东权益＋1＝产权比率＋1，即权益乘数－产权比率＝1。"},
      {"type": "single", "year": "", "title": "产权比率较高，通常反映的信息是(   )。", "options": ["财务结构越稳健", "长期偿债能力越强", "财务杠杆效应越强", "股东权益的保障程度越高"], "answer": [2], "explain": "产权比率＝负债总额/所有者权益总额×100%，这一比率越高，表明企业长期偿债能力越弱，债权人权益保障程度越低，所以选项B、D不正确；产权比率高，是高风险、高报酬的财务结构，财务杠杆效应强，所以选项C正确，选项A不正确。"},
      {"type": "single", "year": "2023", "title": "某公司2022年末发行在外的普通股股数为250万股，每股净资产为30元，负债总额为5 000万元，该公司2022年年末的资产负债率为（   ）。", "options": ["50%", "40%", "33.33%", "66.67%"], "answer": [1], "explain": "股东权益总额=30×250=7500(万元)，资产总额=7500＋5000=12 500(万元)，资产负债率=5000/12500=40%。"},
      {"type": "single", "year": "", "title": "下列经济业务中，会影响到企业资产负债率的是(   )。", "options": ["以固定资产的账面价值对外进行长期投资", "收回应收账款", "接受投资者以固定资产进行的投资", "用现金购买股票"], "answer": [2], "explain": "A、B、D选项都是在不同资产形式之间的转化，不会影响资产总额和负债总额，都不会影响资产负债率。C选项新增了资产和权益，资产负债率的分子不变，分母增加，会使资产负债率发生变化。"},
      {"type": "single", "year": "2018", "title": "下列财务指标中，最能反映企业即时偿付短期债务能力的是(    )。", "options": ["资产负债率", "流动比率", "权益乘数", "现金比率"], "answer": [3], "explain": "现金比率剔除了应收账款对偿债能力的影响，最能反映企业直接偿付流动负债的能力。"},
      {"type": "single", "year": "", "title": "某公司2017年年末总资产500万元，股东权益350万元，净利润50万元，全部利息费用5万元，其中资本化利息费用2万元，假设该企业适用的所得税税率为25%，下列各项指标中计算正确的是(    )。", "options": ["权益乘数＝0.7", "利息保障倍数＝13.93", "资产负债率＝40%", "产权比率＝2.33"], "answer": [1], "explain": "权益乘数＝资产总额/权益总额＝500/350＝1.43；利息保障倍数＝息税前利润/利息费用＝[50/(1－25%)＋(5－2)]/5＝13.93；资产负债率＝负债总额/资产总额＝(500－350)/500＝30%；产权比率＝负债总额/权益总额＝(500－350)/350＝0.43。"},
      {"type": "judge", "year": "2021", "title": "计算利息保障倍数时，“应付利息”指的是计入财务费用中的利息支出，不包括资本化利息。", "options": ["对", "错"], "answer": [1], "explain": "计算利息保障倍数时，公式中的分母“应付利息”是指本期发生的全部应付利息，不仅包括财务费用中的利息费用，还应包括计入固定资产成本的资本化利息。"},
      {"type": "judge", "year": "2023", "title": "利息保障倍数反映支付利息的利润来源与利息支出之间的关系，该比率越高，一般反映企业的长期偿债能力越强。", "options": ["对", "错"], "answer": [1], "explain": "利息保障倍数反映支付利息的利润来源（息税前利润）与利息支出之间的关系，该比率越高，长期偿债能力越强。"},
      {"type": "single", "year": "2020", "title": "已知利润总额为700万元，利润表中的财务费用为50万元，资本化利息为30万元，则利息保障倍数为(    )。", "options": ["9.375", "15", "8.75", "9.75"], "answer": [0], "explain": "利息保障倍数＝息税前利润/应付利息＝(利润总额＋财务费用中的利息费用)/(财务费用中的利息费用＋资本化利息)。公式中的被除数“应付利息”是指本期发生的全部应付利息，不仅包括财务费用中的利息费用，还应包括计入固定资产成本的资本化利息。在没有特殊说明的情况下，认为财务费用＝财务费用中的利息费用。所以本题利息保障倍数＝(700＋50)/(50＋30)＝9.375，故选项A正确。"},
      {"type": "single", "year": "2024", "title": "下列财务指标中，不能用于衡量企业盈利能力的是（   ）。", "options": ["营业净利率", "营业毛利率", "股利发放率", "净资产收益率"], "answer": [2], "explain": "反映企业盈利能力的指标主要有营业毛利率、营业净利率、总资产净利率和净资产收益率。"},
      {"type": "single", "year": "2021CPA", "title": "甲公司净利润7500万元，所得税费用2500万元，利息支出2500万元，其中包括利息费用2000万元，资本化利息500万元，求利息保障倍数(   )。", "options": ["4.8", "3", "5", "6"], "answer": [0], "explain": "利息保障倍数＝息税前利润/利息支出，息税前利润＝7500＋2500＋2000＝12000，利息支出不仅包括计入利润表财务费用的费用化利息2000，还包括计入资产负债表固定资产等成本的资本化利息500，利息保障倍数＝12000/2500＝4.8。"},
      {"type": "single", "year": "", "title": "已知经营杠杆系数为3，每年的固定经营成本为10万元，利息费用为2万元，则利息保障倍数为(    )。", "options": ["2", "2.5", "3", "5"], "answer": [1], "explain": "经营杠杆系数＝基期的边际贡献/基期的息税前利润＝(基期的息税前利润＋10)/基期的息税前利润＝3，解得：基期的息税前利润＝5(万元)，故利息保障倍数＝5/2＝2.5。"},
      {"type": "multi", "year": "", "title": "下列关于应收账款周转率指标的说法中，正确的有(    )。", "options": ["营业收入指扣除销售折扣和折让后的销售净额", "应收账款包括会计报表中的“应收账款”和“应收票据”等全部赊销账款", "应收账款为扣除坏账准备的金额", "该指标容易受季节性、偶然性等因素的影响"], "answer": [0, 1, 3], "explain": "应收账款应为未扣除坏账准备的金额。所以选项C的说法不正确。"},
      {"type": "multi", "year": "2023", "title": "在其他条件不变的情况下，下列各项中，会引起总资产周转率指标上升的有（   ）。", "options": ["用银行存款支付广告费", "用现金偿还应付账款", "用银行存款购买设备", "借入短期借款"], "answer": [0, 1], "explain": "总资产周转率=营业收入/平均资产总额，选项A、B均会使资产总额降低，营业收入不变，总资产周转率上升;选项C是资产内部的此增彼减，总资产周转率不变;选项D会使资产增加，营业收入不变，总资产周转率下降。"},
      {"type": "judge", "year": "2022", "title": "总资产周转率可用于衡量企业全部资产赚取收入的能力， 故根据该指标可以全面评价企业的盈利能力。", "options": ["对", "错"], "answer": [1], "explain": "总资产周转率指标用于衡量企业资产整体的使用效率。各项资产的周转率指标用于衡量各项资产赚取收入的能力，经常与企业盈利能力的指标结合在一起，以全面评价企业的盈利能力。本题表述错误。"},
      {"type": "judge", "year": "2023", "title": "应收账款周转率是指一定期间产生的应收账款总额与营业收入总额的比值。", "options": ["对", "错"], "answer": [1], "explain": "应收账款周转率（次数），是一定时期内商品或产品营业收入与应收账款平均余额的比值，表明一定时期内应收账款平均收回的次数。其计算公式为:应收账款周转次数=营业收入/应收账款平均余额。所以本题表述错误。"},
      {"type": "multi", "year": "", "title": "在一定时期内，应收账款周转次数多、周转天数少表明(    )。", "options": ["收账速度快", "销售的信用管理政策宽松", "应收账款流动性差，降低了企业的短期偿债能力", "可以减少收账费用和坏账损失"], "answer": [0, 3], "explain": "通常，应收账款周转率越高、周转天数越短表明应收账款管理效率越高。在一定时期内应收账款周转次数多、周转天数少表明：(1)企业收账迅速，信用销售管理严格；(2)应收账款流动性强，从而增强企业短期偿债能力；(3)可以减少收账费用和坏账损失，相对增加企业流动资产的投资收益。因此选项A、D正确。"},
      {"type": "judge", "year": "2020", "title": "一般而言，存货周转速度越快，存货占用水平越低，企业的营运能力就越强。", "options": ["对", "错"], "answer": [1], "explain": "一般来讲，存货周转速度越快，存货占用水平越低，流动性越强，存货转化为现金或应收账款的速度就越快，这样会增强企业的短期偿债能力及盈利能力。即企业的营运能力也就越强。"},
      {"type": "single", "year": "2022", "title": "某公司2021年度营业收入为9 000万元，营业成本为7 000万元，年初存货为2 000万元，年末存货为1 500万元，则该公司2021年的存货周转次数为(    )。", "options": ["3.5次", "4.5次", "5.14次", "4次"], "answer": [3], "explain": "存货周转次数＝7000/[(2000＋1500)/2)] ＝4(次)，选项D当选。"},
      {"type": "single", "year": "2020", "title": "某公司上期营业收入为1000万元，本期期初应收账款为120万元，本期期末应收账款为180万元，本期应收账款周转率为8次，则本期的营业收入增长率为(    )。", "options": ["20%", "12%", "18%", "50%"], "answer": [0], "explain": "本期应收账款周转率＝本期营业收入/[(期初应收账款＋期末应收账款)/2]，即：8＝本期营业收入/[(120＋180)/2]，本期营业收入＝1200(万元)，本期的营业收入增长率＝(1200－1000)/1000＝20%。"},
      {"type": "judge", "year": "2024", "title": "一般而言，企业所有者权益增长率越高，表明企业的资本积累越多，应对风险、持续发展的能力越强。", "options": ["对", "错"], "answer": [1], "explain": "所有者权益增长率是企业本年所有者权益增长额与年初所有者权益的比率，反映企业当年资本的积累能力。所有者权益增长率越高，表明企业的资本积累越多，持续发展的能力越强，应对风险能力越高。"},
      {"type": "judge", "year": "2025", "title": "资本保值增值率是扣除客观增减因素后增加的所有者权益比上期初所有者权益。", "options": ["对", "错"], "answer": [1], "explain": "资本保值增值率=扣除客观增减因素后所有者权益的期末总额/所有者权益的期初总额，并不是使用增加额计算，本题表述错误。"},
      {"type": "single", "year": "", "title": "总资产增长率是企业本年资产增长额与年初资产总额的比率，反映企业本期资产规模的增长情况。", "options": ["对", "错"], "answer": [0], "explain": "总资产增长率是企业本年资产增长额同年初资产总额的比率，反映企业本期资产规模的增长情况。"},
      {"type": "single", "year": "", "title": "A公司2021年末所有者权益总额2 000万。2022年7月接受股东投资，股本增加1 000万元，资本公积增加3 000万元。2022年实现净利润1 800万元，提取盈余公积金160万元，2022年末所有者权益总额7 800万元。则2022年资本保值增值率为(    )。", "options": ["340%", "240%", "190%", "140%", "选项231"], "answer": [2], "explain": "2022年资本保值增值率＝(2000＋1800)/2000×100%＝190%，所以选项B正确。股东投资带来的股本和资本公积的增加属于客观因素，不能算所有者权益的增值。提取盈余公积金160万元没有引起股东权益的变化，无需考虑。所有者权益的增值主要是净利润1800。"},
      {"type": "single", "year": "2019", "title": "关于获取现金能力的有关财务指标，下列表述中正确的是(    )。", "options": ["全部资产现金回收率指标不能反映公司获取现金的能力", "用长期借款方式购买固定资产会影响营业现金比率", "公司将销售政策由赊销调整为现销方式后，不会对营业现金比率产生影响", "每股营业现金净流量是经营活动现金流量净额与普通股股数之比"], "answer": [3], "explain": "全部资产现金回收率属于公司获取现金的能力指标；长期借款方式购买固定资产不影响经营活动现金流量净额；公司将销售政策由赊销调整为现销方式后经营活动现金流量净额会增加，营业现金比率会提高；每股营业现金净流量＝经营活动现金流量净额/\"普通股股数\""},
      {"type": "single", "year": "2022", "title": "下列各项中，不属于获取现金能力分析指标的是(    )。", "options": ["全部资产现金回收率", "现金比率", "营业现金比率", "每股营业现金净流量"], "answer": [1], "explain": "现金比率属于短期偿债能力分析指标，选项B当选。获取现金能力分析指标包括营业现金比率、每股营业现金净流量、全部资产现金回收率。现金比率是短期偿债能力分析指标。选项B当选。"},
      {"type": "single", "year": "2021", "title": "某公司利润总额为6 000万元，所得税费用为1 500万元，非经营性收益为450万元，净收益营运指数是(    )。", "options": ["0.9", "0.81", "0.75", "0.93"], "answer": [0], "explain": "净利润＝6000－1500＝4500(万元)，净收益营运指数＝(净利润－非经营净收益)/净利润＝(4500－450)/4500＝0.9"},
      {"type": "single", "year": "2024", "title": "下列财务分析指标中，能够反映收益质量的是（   ）。", "options": ["总资产净利率", "净资产收益率", "营业净利率", "净收益营运指数"], "answer": [3], "explain": "收益质量是指会计收益与公司业绩之间的相关性，主要包括净收益营运指数分析与现金营运指数分析。选项D正确。选项A、B、C属于盈利能力分析指标。"},
      {"type": "judge", "year": "", "title": "净收益营运指数作为一个能够反映公司收益质量的指标，可以揭示净收益与现金流量之间的关系。", "options": ["对", "错"], "answer": [1], "explain": "净收益营运指数是指经营净收益与净利润之比，揭示经营净收益与净利润之间的关系。"},
      {"type": "single", "year": "2020", "title": "计算稀释每股收益时，需考虑潜在普通股影响，下列不属于潜在普通股的是(    )。", "options": ["认股权证", "股份期权", "库存股", "可转换公司债券"], "answer": [2], "explain": "潜在普通股主要包括：可转换公司债券、认股权证和股份期权等。"},
      {"type": "multi", "year": "", "title": "下列各项中，属于企业计算稀释每股收益时应当考虑的潜在普通股有(    )。", "options": ["库存股", "股份期权", "优先股", "可转换公司债券"], "answer": [1, 3], "explain": "稀释性潜在普通股主要包括：可转换公司债券、认股权证和股份期权等。所以，选项B、D正确。"},
      {"type": "judge", "year": "2022", "title": "在计算稀释每股收益时，当认股权证的行权价格低于当期普通股平均市场价格时，应当考虑稀释性。", "options": ["对", "错"], "answer": [1], "explain": "计算稀释每股收益时，认股权证、股份期权等的行权价格低于当期普通股平均市场价格时，应当考虑其稀释性。本题表述正确。"},
      {"type": "judge", "year": "", "title": "市盈率是反映股票投资价值的重要指标，该指标数值越大，表明投资者越看好该股票的投资预期。", "options": ["对", "错"], "answer": [1], "explain": "市盈率是股票市场上反映股票投资价值的重要指标，该比率的高低反映了市场上投资者对股票投资收益和投资风险的预期。"},
      {"type": "single", "year": "", "title": "下列各项财务指标中，能够综合反映企业成长性和投资风险的是(   )。", "options": ["市盈率", "每股收益", "营业净利率", "每股净资产"], "answer": [0], "explain": "一方面，市盈率越高，意味着投资者对股票的收益预期越看好，投资价值越大；反之，投资者对该股票评价越低。另一方面，市盈率越高，说明投资于该股票的风险越大；反之，投资于该股票的风险越小，选项A当选。"},
      {"type": "single", "year": "2024", "title": "某公司2023年每股收益0.8元，2023年年末每股净资产3元，市盈率15倍，则2023年年末市净率为（   ）。", "options": ["5倍", "12倍", "24倍", "4倍"], "answer": [3], "explain": "每股市价=15×0.8=12(元)，市净率=12/3=4(倍)。"},
      {"type": "single", "year": "2020", "title": "某上市公司股票市价为20元，普通股数量100万股，净利润400万元，净资产500万元，则市净率为(    )。", "options": ["4", "5", "10", "20"], "answer": [0], "explain": "每股净资产＝500/100＝5(元)；市净率＝20/5＝4，故选项A正确。"},
      {"type": "single", "year": "", "title": "某上市公司2022年度归属于普通股股东的净利润为2 950万元。2021年年末的股本为10 000万股，2022年3月5日，经公司2021年度股东大会决议，以截止2021年年末公司总股本为基础，向全体股东每10股送红股1股，工商注册登记变更完成后公司总股本变为11 000万股，2022年5月1日新发行6 000万股，11月1日回购1 500万股，以备将来奖励职工之用，则该上市公司基本每股收益为(    )元。", "options": ["0.1", "0.2", "0.3", "0.4"], "answer": [1], "explain": "发行在外的普通股加权平均数＝11000＋6000×8/12－1500×2/12＝14 750(万股)，基本每股收益＝2950/14750＝0.2(元)。由于送红股是将公司以前年度的未分配利润转为普通股，转化与否都一直作为资本使用，因此，新增的这1 000万股不需要按照实际增加的月份加权计算，可以直接计入分母。"},
      {"type": "multi", "year": "2019", "title": "关于上市公司管理层讨论与分析，正确的有(    )。", "options": ["管理层讨论与分析是对本公司过去经营状况的评价，而不对未来发展作前瞻性判断", "管理层讨论与分析包括报表及附注中没有得到充分揭示，而对投资者决策有用的信息", "管理层讨论与分析包括对财务报告期间有关经营业绩变动的解释", "管理层讨论与分析不是定期报告的组成部分，并不要求强制性披露"], "answer": [1, 2], "explain": "管理层讨论与分析是上市公司定期报告中管理层对于企业过去经营状况的评价分析以及对企业未来发展趋势的前瞻性判断。选项A错误。我国基本实行强制与自愿相结合的披露原则，选项D错误。"},
      {"type": "multi", "year": "2018", "title": "杜邦分析体系中所涉及的主要财务指标有(    )。", "options": ["营业现金比率", "权益乘数", "营业净利率", "总资产周转率"], "answer": [1, 2, 3], "explain": "杜邦分析体系下，净资产收益率＝营业净利率×总资产周转率×权益乘数，所以选项B、C、D正确。"},
      {"type": "judge", "year": "2025", "title": "杜邦分析法将总资产净利率作为财务分析的起点。", "options": ["对", "错"], "answer": [1], "explain": "杜邦分析体系的起点是净资产收益率，即权益净利率，而不是总资产净利率。本题表述错误。"},
      {"type": "single", "year": "2018", "title": "关于杜邦分析体系所涉及的财务指标，下列表述错误的是(    )。", "options": ["营业净利率可以反映企业的盈利能力", "权益乘数可以反映企业的偿债能力", "总资产周转率可以反映企业的营运能力", "总资产收益率是杜邦分析体系的起点"], "answer": [3], "explain": "杜邦分析体系的起点是净资产收益率，所以选项D的说法不正确。"},
      {"type": "single", "year": "2018", "title": "某企业的营业净利率为20%，总资产净利率为30%，则总资产周转率为(    )次。", "options": ["0.67", "0.1", "0.5", "1.5"], "answer": [3], "explain": "总资产净利率30%＝营业净利率20%×总资产周转率，所以总资产周转率＝1.5。"},
      {"type": "single", "year": "", "title": "假定其他条件不变，下列各项经济业务中，会导致公司总资产净利率上升的是(    )。", "options": ["收回应收账款", "用资本公积转增股本", "用银行存款购入生产设备", "用银行存款归还银行借款"], "answer": [3], "explain": "总资产净利率＝净利润/平均总资产，选项D会使得银行存款下降，从而使得平均总资产下降，所以总资产净利率会升高。"},
      {"type": "single", "year": "", "title": "某企业的总资产净利率为20%，若产权比率为1，则净资产收益率为(   )。", "options": ["15%", "20%", "30%", "40%"], "answer": [3], "explain": "权益乘数＝1＋产权比率＝1＋1＝2，净资产收益率＝总资产净利率×权益乘数＝20%×2＝40%。"},
      {"type": "single", "year": "2024CPA", "title": "甲公司处于快速发展阶段，2023年至2024年销售收入由5 000万元增长至8 000万元，净利润由800万元增长至1 000万元，总资产周转次数由0.5增长至0.8，甲公司2023年的权益净利率为20%，假设资本结构不变，2024年的权益净利率为（  ）。", "options": ["32%", "15.63%", "26.31%", "25%"], "answer": [3], "explain": "2023年营业净利率=800/5000=16%，2024年营业净利率=1000/8000=12.5%，权益净利率=营业净利率×总资产周转次数×权益乘数，2023年权益乘数=20%/（16%×0.5）=2.5，假设资本结构不变，2024年权益乘数=2023年权益乘数=2.5，2024年的权益净利率=12.5%×0.8×2.5=25%，选项D当选。"},
      {"type": "single", "year": "", "title": "甲公司2022年的营业净利率比2021年下降5%，总资产周转次数提高10%，假定其他条件与2021年相同，那么甲公司2022年的净资产收益率比2021年提高(   )。", "options": ["4.5%", "5.5%", "10%", "10.5%"], "answer": [0], "explain": "2021年净资产收益率＝营业净利率×总资产周转次数×权益乘数，2022年净资产收益率＝营业净利率×(1－5%)×总资产周转次数×(1＋10%)×权益乘数，所以，净资产收益率提高＝(1＋10%)×(1－5%)－1＝4.5%"},
      {"type": "multi", "year": "", "title": "关于经济增加值，下列说法正确的有(　)。", "options": ["经济增加值＝税后净营业利润－平均资本占用×债务利息率", "经济增加值能够体现股东资本的机会成本及股东财富的变化", "计算经济增加值时，需进行相应的会计科目调整", "经济增加值为负，表明经营者在损毁企业价值"], "answer": [1, 2, 3], "explain": "经济增加值＝税后净营业利润－平均资本占用×加权平均资本成本，所以A错误。经济增加值能够体现股东资本的机会成本及股东财富的变化，是从股东角度去评价企业经营者有效使用资本和为企业创造价值的业绩评价指标。(1)在计算经济增加值时，需进行相应的会计科目调整，如营业外收支、递延税金等都要从税后净营业利润中扣除，以消除财务报表中不能准确反映企业价值创造的部分；(2)经济增加值为正，表明经营者在为企业创造价值；经济增加值为负，表明经营者在损毁企业价值。"},
      {"type": "judge", "year": "2021", "title": "与净资产收益率相比，经济增加值绩效评价方法考虑了全部资本的机会成本，能更真实地反映企业的价值创造。", "options": ["对", "错"], "answer": [1], "explain": "经济增加值＝税后净营业利润－平均资本占用×加权平均资本成本。其中，平均资本占用反映的是企业持续投入的各种债务资本和股权资本；加权平均资本成本反映的是企业各种资本的平均成本率。因此经济增加值绩效评价方法考虑了全部资本的机会成本，能更真实地反映企业的价值创造。"},
      {"type": "single", "year": "2022", "title": "关于经济增加值绩效评价方法，下列表述错误的是(    )。", "options": ["经济增加值的计算主要基于财务指标，无法对企业进行综合评价", "同时考虑了债务资本成本和股权资本成本", "适用于对不同规模的企业绩效进行横向比较", "有助于实现经营者利益与企业利益的统一"], "answer": [2], "explain": "由于不同行业、不同规模、不同成长阶段等的公司，其会计调整项和加权平均资本成本各不相同，故该指标的可比性较差，选项C正确。"},
      {"type": "multi", "year": "2018", "title": "企业综合绩效评价可分为财务绩效定量评价与管理绩效定性评价两部分，下列各项中，属于财务绩效定量评价内容的有(      )。", "options": ["资产质量", "盈利能力", "债务风险", "经营增长"], "answer": [0, 1, 2, 3], "explain": "财务绩效定量评价是指对企业一定期间的盈利能力、资产质量、债务风险和经营增长四个方面进行定量对比分析和评判。"},
      {"type": "single", "year": "", "title": "在对企业进行绩效评价时，下列属于评价企业盈利能力的修正指标的是(    )。", "options": ["营业利润增长率", "资本收益率", "净资产收益率", "总资产收益率"], "answer": [0], "explain": "解析：经济增加值＝税后净营业利润－平均资本占用×加权平均资本成本。所以A部门的经济增加值＝400－3000×10%＝100（万元）。"},

      {"type": "single", "year": "", "title": "某企业A部门2025年度相关财务报表数据如下表所示，假设没有需要调整的项目，A部门的经济增加值为（   ）。", "options": ["300万元", "200万元", "100万元", "133.33万元"], "answer": [0], "explain": "解析：经济增加值＝税后净营业利润－平均资本占用×加权平均资本成本。所以A部门的经济增加值＝400－3000×10%＝100（万元）。"},

function dayKeyOf(ts){ const d=new Date(ts); const p=n=>(''+n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function dailyKey(){ return 'quiz_daily_'+(curUser||'guest')+'_v1'; }
function loadDaily(){ try{ var s=localStorage.getItem(dailyKey()); if(s) return JSON.parse(s)||{}; }catch(e){} return {}; }
function saveDaily(o){ try{ localStorage.setItem(dailyKey(), JSON.stringify(o)); }catch(e){} scheduleSync(); }
function recordDaily(correct){
  const k=dayKeyOf(Date.now()); const all=loadDaily();
  const e=all[k]||{answered:0,correct:0,wrong:0,lastTs:Date.now()};
  e.answered++; if(correct) e.correct++; else e.wrong++; e.lastTs=Date.now(); all[k]=e; saveDaily(all);
}
function calcStreak(daily){
  let s=0; const d=new Date(); d.setHours(0,0,0,0);
  for(;;){ const k=dayKeyOf(d.getTime());
    if(daily[k]&&daily[k].answered>0) s++; else break;
    d.setDate(d.getDate()-1); if(s>3650) break; }
  return s;
}
function heatHtml(daily){
  const today=new Date(); today.setHours(0,0,0,0);
  const wkStart=new Date(today); wkStart.setDate(wkStart.getDate()-wkStart.getDay());
  const endTarget=new Date(2026,8,5); // 2026-09-05
  const end=new Date(endTarget); end.setDate(end.getDate()+(6-end.getDay())); // 该周周六
  let cells=''; const cur=new Date(wkStart);
  while(cur<=end){
    const k=dayKeyOf(cur.getTime()); const e=daily[k]; const n=e?e.answered:0;
    let l=0; if(n>=1)l=1; if(n>=3)l=2; if(n>=6)l=3; if(n>=10)l=4;
    cells+='<div class="hc l'+l+'" title="'+k+': '+(n||0)+' 题"></div>';
    cur.setDate(cur.getDate()+1);
  }
  return '<div class="heat">'+cells+'</div>';
}
function renderAchieve(){
  const daily=loadDaily();
  const today=new Date(); today.setHours(0,0,0,0);
  const tk=dayKeyOf(today.getTime());
  const t=daily[tk]||{answered:0,correct:0,wrong:0};
  const wk=['日','一','二','三','四','五','六'];
  const todayLabel='今天 · '+(today.getMonth()+1)+'-'+today.getDate()+' 周'+wk[today.getDay()];
  const tAcc=t.answered?Math.round(t.correct/t.answered*100):0;
  let ta=0,tc=0; Object.keys(daily).forEach(k=>{ ta+=daily[k].answered||0; tc+=daily[k].correct||0; });
  const acc=ta?Math.round(tc/ta*100):0;
  const streak=calcStreak(daily);
  const dayCount=Object.keys(daily).length;
  let maxN=1;
  for(let i=29;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); const e=daily[dayKeyOf(d.getTime())]; if(e&&e.answered>maxN) maxN=e.answered; }
  let rows='';
  for(let i=29;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const k=dayKeyOf(d.getTime()); const e=daily[k];
    const n=e?e.answered:0; const c=e?e.correct:0; const w=e?e.wrong:0;
    if(i!==0 && !n) continue;
    const dayDiff=i;
    let label; if(dayDiff===0) label='今天'; else if(dayDiff===1) label='昨天'; else label=(d.getMonth()+1)+'-'+d.getDate();
    const pct=n?Math.round(n/maxN*100):0;
    rows+='<div class="day-row'+(n?'':' zero')+'"><span class="day-d">'+label+'</span>'+
      '<span class="day-n">'+n+'题</span>'+
      '<span class="day-bar"><i style="width:'+pct+'%"></i></span>'+
      '<span class="day-c">对'+c+'/错'+w+'</span></div>';
  }
  const html=
    '<div class="achv-card achv-today"><div class="achv-h">'+todayLabel+'</div>'+
      (t.answered?('<div class="achv-big">'+t.answered+'<span>题</span></div><div class="achv-sub">对 '+t.correct+' · 错 '+t.wrong+' · 正确率 '+tAcc+'%</div>')
                 :'<div class="achv-big" style="font-size:22px;color:var(--sub);">今日还没答题</div><div class="achv-sub">去练几题，开启你的打卡吧</div>')+
    '</div>'+
    '<div class="achv-ov">'+
      '<div class="ov"><b>'+dayCount+'</b><span>打卡天数</span></div>'+
      '<div class="ov"><b>'+ta+'</b><span>累计答题</span></div>'+
      '<div class="ov"><b>'+acc+'%</b><span>平均正确率</span></div>'+
      '<div class="ov"><b>'+streak+'</b><span>连续打卡</span></div>'+
    '</div>'+
    '<div class="achv-card"><div class="achv-h">最近 30 天</div><div class="achv-list">'+rows+'</div></div>'+
    '<div class="achv-card"><div class="achv-h">本周 ~ 9/5 那周 · 答题热力图</div><div class="heat-wrap">'+heatHtml(daily)+'</div>'+
      '<div class="heat-legend">少<span class="hc"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span>多</div></div>';
  const box=document.getElementById('achvBody'); if(box) box.innerHTML=html;
}

const GIST_ID="1d7936e91501ec557739f0ddfbe32735";
function gistToken(){ try{ return localStorage.getItem('quiz_gist_token')||''; }catch(e){ return ''; } }

function gistFileName(){ return "progress_"+(curUser||"guest")+".json"; }
function fmtSync(ts){
  if(!ts) return '—';
  const d=new Date(ts), now=Date.now(), diff=now-ts;
  const p=n=>(''+n).padStart(2,'0');
  const hm=p(d.getHours())+':'+p(d.getMinutes());
  const today=new Date(); today.setHours(0,0,0,0);
  const that=new Date(ts); that.setHours(0,0,0,0);
  const dayDiff=Math.round((today-that)/86400000);
  if(dayDiff===0) return '今天 '+hm;
  if(dayDiff===1) return '昨天 '+hm;
  return (d.getMonth()+1)+'-'+p(d.getDate())+' '+hm;
}

function snapshotLocal(){
  const data={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('quiz_')===0 && k!=='quiz_user' && k!=='quiz_gist_token') data[k]=localStorage.getItem(k); }
  return JSON.stringify({v:1,ts:Date.now(),account:curUser||'',data:data});
}
function restoreLocal(json){
  try{ const o=JSON.parse(json); if(o&&o.data){ Object.keys(o.data).forEach(k=>{ if(k==='quiz_user'||k==='quiz_gist_token') return; try{ localStorage.setItem(k,o.data[k]); }catch(e){} }); return true; } }catch(e){}
  return false;
}
// 本机没有记住账号时，从云端各账号文件里找回最近使用的账号（account 字段）
function recoverAccountFromGist(cb){
  fetch("https://api.github.com/gists/"+GIST_ID,{headers:syncHeaders(),cache:'no-store'})
    .then(r=>r.ok?r.json():null).then(j=>{
      if(!j||!j.files){ cb(null); return; }
      let best=null, bestTs=0;
      BUILTIN_USERS.forEach(u=>{
        const f=j.files['progress_'+u+'.json'];
        if(f&&f.content){ try{ const o=JSON.parse(f.content); const acc=o.account, ts=o.ts||0;
          if(acc && BUILTIN_USERS.indexOf(acc)>=0 && ts>bestTs){ best=acc; bestTs=ts; } }catch(e){} }
      });
      cb(best);
    }).catch(()=>cb(null));
}
function syncPull(){
  fetch("https://api.github.com/gists/"+GIST_ID,{headers:syncHeaders(),cache:'no-store'})
    .then(r=>r.ok?r.json():null).then(j=>{
      if(j&&j.files){
        const f=j.files[gistFileName()];
        const txt=f?f.content:null;
        if(txt&&restoreLocal(txt)){
          wrongSet=loadWrongSet(); wrongStreak=loadWrongStreak(); favSet=loadFavSet();
          if(curKey) loadProgress(curKey);
          renderMenu(); syncStatus('已恢复云端进度');
        }
      }
    }).catch(()=>{});
}
function syncPush(showHint){
  if(syncBusy) return;
  if(!gistToken()){ if(showHint) syncStatus('请先点 ⚙ 设置 token'); return; }
  syncBusy=true; syncStatus('上云中…');
  const body={files:{}}; body.files[gistFileName()]={content:snapshotLocal()};
  fetch("https://api.github.com/gists/"+GIST_ID,{method:'PATCH',headers:Object.assign(syncHeaders(),{'Content-Type':'application/json'}),body:JSON.stringify(body)})
    .then(r=>{
      if(r.ok){ syncStatus('已上云'); markSynced(); }
      else { return r.text().then(t=>{ console.warn('gist push fail',r.status,t); syncStatus('上云失败'); }); }
    })
    .catch(()=>{ syncStatus('上云失败'); })
    .finally(()=>{ syncBusy=false; });
}
function scheduleSync(){ if(syncTimer) clearTimeout(syncTimer); syncTimer=setTimeout(syncPush,1000); }
