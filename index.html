<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>会计中级 · 五章答题</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#ffffff; --ink:#1f2329; --sub:#8a8f99;
    --line:#eceef1; --brand:#3a6df0; --brand-d:#2f5bd0;
    --ok:#1f9d55; --ok-bg:#e7f6ed; --bad:#e0483b; --bad-bg:#fdecea;
    --un:#f4f5f7; --un-ink:#9aa0aa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;}
  #app{height:100%;}
  .view{height:100%;display:flex;flex-direction:column;}
  .hidden{display:none !important;}
  .topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
    padding:env(safe-area-inset-top) 10px env(safe-area-inset-top);min-height:48px;display:flex;align-items:center;gap:8px;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;flex:1;text-align:left;}
  .syncbtn{background:linear-gradient(135deg,#f0c869,#d9a524);color:#fff;border:none;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;}
  .gearbtn{background:#eceef1;color:#555;border:none;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;}
  .userchip{background:#eef3ff;color:#2f6fed;border:1px solid #d6e2ff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap;max-width:48vw;overflow:hidden;text-overflow:ellipsis;}
  .foot #syncStat{color:var(--brand);}
  .back{width:32px;height:32px;background:#f2f3f5;border:none;border-radius:10px;font-size:18px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;}
  .topbar.quizbar{gap:8px;}
  .quizbar .prog{flex:1;min-width:0;display:flex;align-items:center;height:32px;}
  .quizbar #chTitle{font-size:15px;color:var(--ink);font-weight:600;line-height:1;}
  .topbar .stats{display:flex;align-items:center;gap:5px;height:32px;}
  .topbar .stats .qpos{font-size:12px;color:var(--sub);font-weight:600;line-height:1;display:flex;align-items:center;height:100%;}
  .topbar .stats .s-correct,.topbar .stats .s-wrong,.topbar .stats .s-left{display:flex;align-items:center;gap:3px;font-weight:700;padding:3px 7px;border-radius:8px;font-size:12px;line-height:1;}
  .topbar .stats .s-correct{color:var(--ok);background:#e7f6ed;}
  .topbar .stats .s-wrong{color:var(--bad);background:#fdecea;}
  .topbar .stats .s-left{color:var(--sub);background:#f4f5f7;}
  .topbar .stats b{font-weight:800;display:inline-block;min-width:1.1em;text-align:center;}

  /* MENU */
  #menu{padding-top:0;}
  #chapterList{padding:14px;overflow:auto;flex:1;}
  .chapter{display:flex;align-items:stretch;gap:10px;background:var(--card);border-radius:14px;
    padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .ch-main{flex:1;min-width:0;}
  .ch-name{font-size:17px;font-weight:700;margin-bottom:4px;}
  .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-bar{height:7px;background:#eef0f3;border-radius:5px;overflow:hidden;}
  .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#5b8bff);border-radius:5px;}
  .ch-reset{background:#fff;border:1px solid var(--line);color:var(--sub);border-radius:10px;
    font-size:13px;padding:0 12px;align-self:center;}
  .ch-wrong{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#f0fff4);
    border:1.5px solid #bfe3c8;border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(31,157,85,.08);}
  .ch-wrong .ch-main{flex:1;min-width:0;}
  .ch-wrong .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#1f9d55;display:flex;align-items:center;}
  .ch-wrong .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#1f9d55;border-radius:8px;
    padding:1px 9px;margin-left:8px;}
  .ch-wrong .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-wrong .ch-bar{height:7px;background:#e2f5e9;border-radius:5px;overflow:hidden;}
  .ch-wrong .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd08a,#1f9d55);border-radius:5px;}
  .ch-wrong .go{background:#1f9d55;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;
    padding:0 14px;align-self:center;}
  .ch-fav{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#fff8e6);
    border:1.5px solid #ffe2a8;border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 4px rgba(214,156,26,.10);}
  .ch-fav .ch-main{flex:1;min-width:0;}
  .ch-fav .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#c8920e;display:flex;align-items:center;}
  .ch-fav .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#d9a524;border-radius:8px;
    padding:1px 9px;margin-left:8px;}
  .ch-fav .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-fav .ch-bar{height:7px;background:#fff0cf;border-radius:5px;overflow:hidden;}
  .ch-fav .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#f0c869,#d9a524);border-radius:5px;}
  .ch-fav .go{background:#d9a524;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;
    padding:0 14px;align-self:center;}
  .foot{text-align:center;color:var(--sub);font-size:12px;padding:12px;}

  /* MENU */
  /* QUIZ */
  #cardWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 96px;}
  #card{min-height:60%;}
  .qno{font-size:16px;color:var(--ink);margin-bottom:10px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .qno .typ{background:#eef2ff;color:var(--brand);border-radius:8px;padding:3px 10px;margin-left:0;font-weight:800;font-size:14px;}
  .qno .yr{background:#fff4e6;color:#d98a00;border-radius:8px;padding:3px 10px;margin-left:0;font-weight:700;font-size:14px;}
  .qno .idx{color:var(--ink);font-weight:800;font-size:18px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:4px 12px;}
  .qtitle{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:16px;}
  .qn-left{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;}
  .favbtn{background:#fff;border:1px solid var(--line);color:#d9a400;border-radius:10px;font-size:20px;line-height:1;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;}
  .favbtn.on{background:#fff7e0;color:#e0a200;border-color:#f0d28a;}
  .remove{margin-top:12px;background:var(--bad-bg);color:var(--bad);border:1px solid #f3c5bb;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;width:100%;}
  .unfav{margin-top:10px;background:#fff;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 14px;font-size:14px;width:100%;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;
    transition:.12s;word-break:break-word;}
  .opt .lab{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#f0f2f5;color:var(--sub);
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .opt .otext{flex:1;line-height:1.5;}
  .opt.correct .lab{background:var(--ok);color:#fff;}
  .opt.wrong .lab{background:var(--bad);color:#fff;}
  .opt.sel .lab{background:var(--brand);color:#fff;}
  .fillwrap{margin:4px 0 2px;}
  .fillInput{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none;}
  .fillInput:focus{border-color:var(--brand);}
  .fillInput:disabled{background:#f3f4f6;color:#666;}
  .opt.sel{border-color:var(--brand);background:#f3f7ff;}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg);color:#0f6b39;font-weight:600;}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:#a5281c;font-weight:600;}
  .opt.dim{opacity:.5;}
  .confirm{margin-top:16px;width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;
    padding:13px;font-size:16px;font-weight:600;}
  .result{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;}
  .result.r-ok{background:var(--ok-bg);color:var(--ok);}
  .result.r-bad{background:var(--bad-bg);color:var(--bad);}
  .explain{margin-top:10px;background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:14px 15px;
    font-size:16.5px;color:#3a3f47;line-height:1.75;}
  .explain b{color:var(--ink);}
  .retry{margin-top:12px;background:none;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 14px;font-size:14px;}

  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);}
  .navbar button{flex:1;background:#f4f5f7;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:600;color:var(--ink);}
  .navbar button:nth-child(2){background:#fff;border:1px solid var(--line);color:var(--brand);}

  /* GRID overlay */
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;}
  .sheet{position:relative;background:#fff;width:100%;border-radius:18px 18px 0 0;max-height:80%;display:flex;flex-direction:column;
    animation:up .2s ease;}
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;font-size:16px;font-weight:700;}
  .sheet-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;background:transparent;border-radius:50%;font-size:22px;line-height:1;color:var(--sub);cursor:pointer;z-index:2;}
  .sheet-x:active{background:rgba(0,0,0,.07);}
  .sheet-hd button{background:#f2f3f5;border:none;border-radius:10px;padding:7px 14px;font-size:14px;color:var(--sub);}
  .legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 18px 12px;font-size:12px;color:var(--sub);}
  .login-sheet{max-width:560px;margin:0 auto;align-self:flex-end;width:100%;padding-bottom:env(safe-area-inset-bottom);}
  .login-title{padding:22px 18px 4px;font-size:19px;font-weight:800;text-align:center;}
  .login-sub{padding:0 18px 14px;font-size:13px;color:var(--sub);text-align:center;}
  .login-users{display:flex;gap:12px;padding:4px 18px 16px;}
  .ubtn{flex:1;background:linear-gradient(135deg,#eef3ff,#dce7ff);color:#2f6fed;border:1px solid #cfe0ff;border-radius:14px;padding:16px 0;font-size:17px;font-weight:800;}
  .ubtn.small{flex:none;padding:12px 18px;font-size:14px;}
  .login-other{display:flex;gap:10px;padding:0 18px 22px;}
  .login-other input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;}
  .login-other input:focus{border-color:#2f6fed;}
  .legend i{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:2px;}
  .g-un{background:var(--un);border:1px solid var(--line);} .g-ok{background:var(--ok);} .g-bad{background:var(--bad);} .g-cur{background:#fff;border:2px solid var(--brand);}
  #gridCells{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:4px 16px 22px;overflow:auto;}
  .cell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--un);color:var(--un-ink);}
  .cell.ok{background:var(--ok);color:#fff;border-color:var(--ok);}
  .cell.bad{background:var(--bad);color:#fff;border-color:var(--bad);}
  .cell.cur{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:0 0 0 2px rgba(58,109,240,.18);}
  .cell.un{background:#fff;color:var(--un-ink);}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,34,40,.9);
    color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:80%;text-align:center;}
  #toast.show{opacity:1;}

  /* 每日成就 */
  .ch-achv{display:flex;align-items:stretch;gap:10px;background:linear-gradient(135deg,#ffffff,#eef3ff);
    border:1.5px solid #cfe0ff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(58,109,240,.08);}
  .ch-achv .ch-main{flex:1;min-width:0;}
  .ch-achv .ch-name{font-size:17px;font-weight:800;margin-bottom:4px;color:#2f6fed;display:flex;align-items:center;}
  .ch-achv .ch-name .badge{font-size:12px;font-weight:800;color:#fff;background:#3a6df0;border-radius:8px;padding:1px 9px;margin-left:8px;}
  .ch-achv .ch-meta{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .ch-achv .ch-bar{height:7px;background:#e3ebff;border-radius:5px;overflow:hidden;}
  .ch-achv .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#5b8bff,#3a6df0);border-radius:5px;}
  .ch-achv .go{background:#3a6df0;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;padding:0 14px;align-self:center;}
  .achv-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .achv-h{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:8px;}
  .achv-today .achv-big{font-size:34px;font-weight:800;color:var(--brand);line-height:1.1;}
  .achv-today .achv-big span{font-size:15px;color:var(--sub);font-weight:600;margin-left:4px;}
  .achv-sub{font-size:13px;color:var(--sub);margin-top:6px;}
  .achv-ov{display:flex;gap:8px;margin-bottom:12px;}
  .achv-ov .ov{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .achv-ov .ov b{display:block;font-size:20px;font-weight:800;color:var(--ink);}
  .achv-ov .ov span{font-size:12px;color:var(--sub);}
  .achv-list .day-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .achv-list .day-row:last-child{border-bottom:none;}
  .achv-list .day-d{width:62px;font-size:13px;color:var(--ink);font-weight:600;flex:none;}
  .achv-list .day-n{width:48px;font-size:13px;color:var(--sub);flex:none;text-align:right;}
  .achv-list .day-bar{flex:1;height:8px;background:#eef0f3;border-radius:5px;overflow:hidden;}
  .achv-list .day-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#5b8bff);border-radius:5px;}
  .achv-list .day-c{width:74px;font-size:12px;color:var(--sub);flex:none;text-align:right;}
  .achv-list .day-row.zero{opacity:.4;}
  .heat-wrap{overflow-x:auto;padding-bottom:4px;}
  .heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;width:max-content;}
  .heat .hc{width:13px;height:13px;border-radius:3px;background:#ebedf0;}
  .heat .hc.l1{background:#cfe9da;}
  .heat .hc.l2{background:#9bd5b2;}
  .heat .hc.l3{background:#4fae7e;}
  .heat .hc.l4{background:#1f9d55;}
  .heat-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--sub);margin-top:8px;}
  .heat-legend .hc{width:11px;height:11px;}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="view">
    <header class="topbar"><h1>会计中级 · 五章答题</h1><span id="userChip" class="userchip" onclick="switchUser()" title="点击切换账号"></span><button class="gearbtn" onclick="setGistToken()" title="设置 gist token">⚙</button><button class="syncbtn" onclick="manualSync()">☁ 上云</button></header>
    <div id="chapterList"></div>
    <footer class="foot">最近上云：<span id="lastSync">—</span> · <span id="syncStat">进度自动上云</span></footer>
  </section>

  <section id="quiz" class="view hidden">
    <header class="topbar quizbar">
      <button class="back" onclick="showMenu()">‹</button>
      <div class="prog">
        <span id="chTitle"></span>
      </div>
      <div class="stats">
        <span id="pos" class="qpos"></span>
        <span class="s-correct">对<b id="cOk">0</b></span>
        <span class="s-wrong">错<b id="cBad">0</b></span>
        <span class="s-left">未答<b id="cLeft">0</b></span>
      </div>
    </header>
    <div id="cardWrap"><div id="card"></div></div>
    <nav class="navbar">
      <button onclick="prev()">上一题</button>
      <button onclick="openGrid()">题号</button>
      <button onclick="next()">下一题</button>
    </nav>
  </section>

  <section id="achv" class="view hidden">
    <header class="topbar">
      <button class="back" onclick="showMenu()">‹</button>
      <h1 style="font-size:17px;">每日成就</h1>
    </header>
    <div id="achvBody" style="flex:1;overflow:auto;padding:14px 16px 96px;"></div>
  </section>

  <section id="grid" class="overlay hidden" onclick="if(event.target===this)closeGrid()">
    <div class="sheet">
      <div class="sheet-hd"><span id="gridTitle">小地图 · 点击跳题</span><button onclick="closeGrid()">关闭</button></div>
      <div class="legend">
        <i class="g-un"></i>未答 <i class="g-ok"></i>答对 <i class="g-bad"></i>答错 <i class="g-cur"></i>当前
      </div>
      <div id="gridCells"></div>
    </div>
  </section>

  <section id="login" class="overlay">
    <div class="sheet login-sheet">
      <button class="sheet-x" id="loginClose" onclick="hideLogin()" aria-label="关闭">×</button>
      <div class="login-title">请选择账号</div>
      <div class="login-sub">本应用仅供 jiaqu / syy 两人使用，首次打开需选择，之后自动记住</div>
      <div class="login-users">
        <button class="ubtn" onclick="pickUser('jiaqu')">jiaqu</button>
        <button class="ubtn" onclick="pickUser('syy')">syy</button>
      </div>
      <div class="login-other">
        <input id="loginInput" placeholder="或输入其他用户名" onkeydown="if(event.key==='Enter')confirmInput()" />
        <button class="ubtn small" onclick="confirmInput()">确定</button>
      </div>
    </div>
  </section>
  <section id="tokenPanel" class="overlay hidden">
    <div class="sheet login-sheet">
      <button class="sheet-x" id="tokenClose" onclick="hideTokenPanel()" aria-label="关闭">×</button>
      <div class="login-title">设置 gist token</div>
      <div class="login-sub">token 只保存在本机，不会上传。需要 <b>gist</b> 权限的 GitHub 私人令牌（PAT）。</div>
      <div class="login-other" style="flex-direction:column;align-items:stretch;gap:10px;">
        <input id="tokenInput" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="粘贴 ghP_ 开头的 token" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;" onkeydown="if(event.key==='Enter')saveToken()" />
        <button class="ubtn" onclick="saveToken()">保存</button>
      </div>
      <div style="text-align:center;padding:8px 0 2px;font-size:12px;color:var(--sub);">不知道怎么生成？点右上角账号胶囊下方说明或联系 jiaqu。</div>
    </div>
  </section>
</div>

<script>
const ALL = {
 "ch1": {
  "name": "第一章 总论",
  "questions": [
   {
    "type": "single",
    "year": "2022",
    "title": "下列选项中，不属于公司制企业缺点的是( )。",
    "options": [
     "导致双重课税",
     "组建公司的成本高",
     "存在代理问题",
     "股东须承担无限连带责任"
    ],
    "answer": [

      {"type": "single", "year": "", "title": "某企业正在讨论更新现有的生产线，有两个备选方案A和B，A、B两方案的原始投资额不同，A方案的净现值为400万元，年金净流量为100万元；B方案的净现值为300万元，年金净流量为110万元，根据以上信息判断哪个方案较好(   )。", "options": ["A方案", "B方案", "没有区别", "根据以上信息无法判断"], "answer": [1], "explain": "固定资产更新决策属于互斥投资项目。净现值法适用于原始投资相同且项目寿命期相同的多个互斥方案的比较决策；年金净流量法适用于原始投资额不相同，特别是项目寿命期不相同的多个互斥方案的比较决策；所以，该题应以年金净流量法进行决策。"},
      {"type": "single", "year": "", "title": "某企业拟进行一项固定资产投资项目决策，必要收益率为12%，有四个方案可供选择。其中A方案的寿命期为10年，净现值为1 000万元，(P/A，12%，10)＝5.6502；B方案的现值指数为0.95；C方案的寿命期为12年，其年金净流量为165万元；D方案的内含收益率为11%。最优的投资方案是(    )。", "options": ["A方案", "B方案", "C方案", "D方案"], "answer": [0], "explain": "由于B方案现值指数＜1，D方案内含收益率＜必要收益率12%，所以均为不可行方案；A方案的净现值＞0，C方案的年金净流量＞0，所以均为可行方案。由于A、C方案为互斥方案，两方案寿命期不同，所以应采用年金净流量进行比较决策。A方案年金净流量＝1000/5.6502＝176.98(万元)＞C方案年金净流量165万元，因此A方案为最优方案。"},
      {"type": "single", "year": "", "title": "下列关于项目投资决策的表述中，正确的是(    )。", "options": ["两个互斥项目的期限相同但初始投资额不一样，在权衡时选择内含收益率高的项目", "同一项目使用净现值法评估的可行性与使用内含收益率法的结果可能不一致", "使用现值指数法进行投资决策评价只消除项目的期限差异", "投资回收期主要测定投资方案的流动性而非盈利性"], "answer": [3], "explain": "两个互斥项目的期限相同但初始投资额不一样，在权衡时选择净现值高的项目，选项A错误；同一项目的可行性评价，使用净现值和内含收益率会得出一致结论，因为净现值大于零，此时项目的内含收益率一定大于项目资本成本，选项B错误；现值指数是相对数，反映投资效率，可以消除不同项目的投资额差异，但无法消除项目的期限差异，选项C错误；投资回收期法主要关注投资回收期短的项目，同时没有考虑回收投资之后的现金流，因此主要测定的是项目的流动性而非盈利性，选项D正确。"},

      {"type": "fill", "year": "2025", "title": "某基金项目于期初一次性投入现金200万元，每年年末取得等额的永续现金流，该项目的内含收益率为10%。若资本成本为8%，则该项目净现值为___万元。", "options": [], "answer": ["50"], "explain": ""},
      {"type": "single", "year": "2020", "title": "关于项目决策的内含收益率法，下列表述正确的是(    )。", "options": ["项目的内含收益率大于0，则项目可行", "内含收益率指标有时无法对互斥方案做出正确决策", "内含收益率指标没有考虑资金时间价值因素", "内含收益率不能反映投资项目可能达到的收益率"], "answer": [1], "explain": "内含收益率法的基本原理是：在计算方案的净现值时，以必要投资收益率作为贴现率计算，净现值的结果往往是大于零或小于零，这就说明方案实际可能达到的投资收益率大于或小于必要投资收益率；而当净现值为零时，说明两种收益率相等，所以选项A、C、D错误。在互斥投资方案决策时，如果各方案的原始投资额现值不相等，内含收益率指标有时无法作出正确的决策，所以选项B正确。"},
      {"type": "single", "year": "", "title": "某公司在甲和乙两个互斥项目之间进行投资决策。经测算：甲项目投资期限为3年，净现值为400万元。乙项目投资期限为2年，净现值为250万元。资本成本均为5%。利用共同年限法，应该如何做出决策(    )。已知(P/F，5%，2)＝0.9070，(P/F，5%，3)＝0.8638，(P/F，5%，4)＝0.8227，(P/F，5%，5)＝0.7835，，(P/F，5%，6)＝0.7462。", "options": ["应该选择甲项目", "应该选择乙项目", "两个项目无差异", "无法做出判断"], "answer": [0], "explain": "共同年限＝6年，甲项目重置净现值(重置1次)＝400＋400×(P/F，5%，3) ＝400＋400×0.8638＝745.52(万元)，乙项目重置净现值(重置2次)＝250＋250×(P/F，5%，2) ＋250×(P/F，5%，4)＝250＋250×0.9070＋250×0.8227＝682.43(万元)，甲项目的重置净现值更大，所以影响选择甲项目。"},
      {"type": "multi", "year": "2020", "title": "下列投资项目评价指标中，考虑了资金时间价值因素的有(    )。", "options": ["内含收益率", "净现值", "年金净流量", "动态回收期"], "answer": [0, 1, 2, 3], "explain": "以上四个选项均考虑了货币时间价值因素。"},
      {"type": "single", "year": "2019", "title": "如果某投资项目在建设起点一次性投入资金，随后每年都有正的现金净流量，在采用内含收益率对该项目进行财务可行性评价时，下列说法正确的是(    )。", "options": ["如果内含收益率大于折现率，则项目净现值大于1", "如果内含收益率大于折现率，则项目现值指数大于1", "如果内含收益率小于折现率，则项目现值指数小于0", "如果内含收益率等于折现率，则项目动态回收期小于项目寿命期"], "answer": [1], "explain": "内含收益率是使净现值等于零时的贴现率。当内含收益率大于折现率时，项目净现值大于0，即未来现金净流量现值＞原始投资额现值，现值指数＝未来现金净流量现值/原始投资额现值＞1，选项A错误，选项B正确。当内含收益率小于折现率时，现值指数＜1，选项C错误。当内含收益率等于折现率时，项目动态回收期等于项目寿命期，选项D错误。"},
      {"type": "multi", "year": "", "title": "甲公司拟投资一个采矿项目，经营期限10年，资本成本14%，现值指数大于1。假设该项目的初始现金流量发生在期初，营业现金流量均发生在投产后各年末。下列关于该项目的说法中，正确的有(    )。", "options": ["内含收益率大于14%", "净现值大于0", "动态回收期大于10年", "年金净流量可能小于0"], "answer": [0, 1], "explain": "现值指数大于1，则净现值大于O，内含收益率大于资本成本14%，动态回收期小于10年，年金净流量大于0。"},
      {"type": "single", "year": "2023", "title": "关于互斥投资方案，假设两个项目折现率相同，下列说法中错误的是(   )。", "options": ["两个项目寿命期相等，而原始投资额不等，应当选择年金净流量较大的项目", "两个项目寿命期相等，而原始投资额不等，应当选择净现值较大的项目", "两个项目寿命期不等，而原始投资额相等，应当选择年金净流量较大的项目", "两个项目寿命期不等，而原始投资额相等，应当选择净现值较大的项目"], "answer": [3], "explain": "对于互斥投资方案，两个项目折现率相同，如果寿命期相等（无论原始投资额是否相等），选择净现值或年金净流量大的项目;如果寿命期不等，只能选择年金净流量大的项目。所以选项D的说法错误。"},
      {"type": "multi", "year": "2025", "title": "假设公司选取现值指数与年金净流量两个指标对独立投资方案 进行比较决策，下列表述正确的有（  ）。", "options": ["若两方案原始投资额相等，期限不同，一般优先安排年金净流量较高的方案", "若两方案原始投资额不同，期限相同，一般优先安排现值指数较高的方案", "若两方案原始投资额不同，期限相同，一般优先安排年金净流量较高的方案", "若两方案原始投资额相等，期限不同，一般优先安排现值指数较高的方案"], "answer": [0, 1], "explain": "年金净流量法不便于对原始投资额不相等的独立投资方案进行决策，选项C不当选;现值指数便于对原始投资额不同的独立投资方案进行比较，但是不能对期限不同的独立 方案进行直接比较，选项D不当选。选项A、B当选。"},
      {"type": "multi", "year": "2024", "title": "某企业有X、Y两个互斥投资项目，X项目的寿命期为4年，净现值为50万元。Y项目寿命期为6年，净现值为60万元，假设资本成本率为10%，有关货币时间价值系数为(P/F:10%:4)=0.6830，(P/F，10%，6)=0.5645，(P/F，10%，8)=0.4665。如果运用共同年限法进行决策分析，下列结论正确的有(   )。", "options": ["共同寿命期间X项目净现值为84.15万元", "Y项目优于X项目", "X项目优于Y项目", "共同寿命期间X项目净现值为107.48万元"], "answer": [2, 3], "explain": "两个投资项目的最小公倍数是12。X项目的净现值=50＋50×(P/F，10%，4)＋50×(P/F，10%，8)=107.48(万元)，X项目的净现值=60＋60×(P/F，10%，6)=93.87(万元)。因为X项目的净现值大于Y项目的净现值，所以X项目优于Y项目。选项CD正确。"},
      {"type": "multi", "year": "2013", "title": "下列各项中，属于证券资产特点的有(    )。", "options": ["可分割性", "高风险性", "强流动性", "持有目的多元性"], "answer": [0, 1, 2, 3], "explain": "证券资产的特点包括：价值虚拟性、可分割性、持有目的多元性、强流动性、高风险性。"},
      {"type": "single", "year": "", "title": "某公司预期未来市场利率上升而将闲置资金全部用于短期证券投资，而到期时市场利率却大幅度下降，这意味着公司的证券投资出现(    )。", "options": ["再投资风险", "购买力风险", "汇率风险", "变现风险"], "answer": [0], "explain": "再投资风险是由于市场利率下降所造成的无法通过再投资而实现预期收益的可能性。"},
      {"type": "single", "year": "2020", "title": "持续通货膨胀期间，投资人将资本投向实体性资产，减持证券资产。这种行为所规避的证券投资风险类别是(   )。", "options": ["经营风险", "变现风险", "再投资风险", "购买力风险"], "answer": [3], "explain": "证券资产是一种货币性资产，通货膨胀会使证券资产投资的本金和收益贬值，名义收益率不变而实际收益率降低。购买力风险对具有收款权利性质的资产影响很大。如果通货膨胀长期延续，投资人会把资本投向实体性资产以求保值，对证券资产的需求量减少，引起证券资产价格下跌，选项D当选。"},
      {"type": "judge", "year": "", "title": "证券资产不能脱离实体资产而独立存在，因此，证券资产的价值取决于实体资产的现实经营活动所带来的现金流量。", "options": ["对", "错"], "answer": [1], "explain": "证券资产价值的虚拟性是指证券资产不能脱离实体资产而完全独立存在，但证券资产的价值不是完全由实体资产的现实生产经营活动决定的，而是取决于契约性权利所能带来的未来现金流量，是一种未来现金流量折现的资本化价值。"},
      {"type": "single", "year": "2017", "title": "一般认为，企业利用闲置资金进行债券投资的主要目的是(    )。", "options": ["谋取投资收益", "增强资产流动性", "控制被投资企业", "降低投资风险"], "answer": [0], "explain": "企业利用闲置资金投资的目的是为了增加企业收益。"},
      {"type": "single", "year": "2023", "title": "由于市场利率上升，而使证券资产价格具有普遍下跌的可能，投资者由此蒙受损失，此类证券投资风险指(   )。", "options": ["购买力风险", "价格风险", "再投资风险", "变现风险"], "answer": [1], "explain": "价格风险是指由于市场利率上升，而使证券资产价格普遍下跌的可能性。"},
      {"type": "single", "year": "2018", "title": "某ST公司在2018年3月5日宣布其发行的公司债券本期利息总额为8980万元将无法于原定付息日2018年3月9日全额支付，仅能够支付500万元，则该公司债务的投资者面临的风险是(    )。", "options": ["价格风险", "购买力风险", "变现风险", "违约风险", "证券投资的风险"], "answer": [3], "explain": "违约风险是指证券资产发行者无法按时兑付证券资产利息和偿还本金的可能性。"},
      {"type": "single", "year": "2019", "title": "根据债券估价基本模型，不考虑其他因素的影响，当市场利率上升时，固定利率债券价值的变化方向是(    )。", "options": ["不变", "不确定", "下降", "上升"], "answer": [2], "explain": "债券价值与市场利率是反向变动的。市场利率的上升会导致债券价值的下降，市场利率的下降会导致债券价值的上升。"},
      {"type": "judge", "year": "2019", "title": "不考虑其他因素的影响，如果债券的票面利率大于市场利率，则该债券的期限越长，其价值就越低。", "options": ["对", "错"], "answer": [1], "explain": "如果债券的票面利率大于市场利率，则是溢价发行的债券，该债券的期限越长，其价值就越高。"},
      {"type": "multi", "year": "", "title": "市场利率和债券期限对债券价值都有较大的影响。下列相关表述中，正确的有(    )。", "options": ["市场利率上升会导致债券价值下降", "长期债券的价值对市场利率的敏感性小于短期债券", "债券期限越短，债券票面利率对债券价值的影响越小", "债券票面利率与市场利率不同时，债券面值与债券价值存在差异"], "answer": [0, 2, 3], "explain": "长期债券对市场利率的敏感性会大于短期债券，在市场利率较低时，长期债券的价值远高于短期债券，在市场利率较高时，长期债券的价值远低于短期债券。所以选项B的表述错误。"},
      {"type": "multi", "year": "2021", "title": "债券票面利率大于市场利率的情况下，基于债券估价，下列表述正确的有(    )。", "options": ["付款频率提高债券价值下降", "票面利率提高债券价值上升", "市场利率上升，债权价值下降", "债券期限延长，债券价值下降"], "answer": [1, 2], "explain": "票面利率大于市场利率，债券溢价发行，付息频率提高会使债券价值上升，选项A错误。债券价值与票面利率同向变动，选项B正确。债券价值与市场利率反向变动，选项C正确。对于溢价发行的债券，期限延长会使债券价值上升。选项D错误。"},
      {"type": "judge", "year": "2023", "title": "当企业折价发行公司债券，该债券的内部收益率将低于票面利率。", "options": ["对", "错"], "answer": [1], "explain": "债券的内部收益率，是指按当前市场价格购买债券并持有至到期日或转让日所产生的预期收益率，也就是债券投资项目的内含收益率。用该内部收益率折现所决定的债券内在价值，刚好等于债券的目前购买价格。平价债券的内部收益率等于票面利率，折价发行（即投资成本更低）债券的内部收益率应高于票面利率。"},
      {"type": "single", "year": "2023", "title": "根据债券估值基本模型，下列表述错误的是（   ）。", "options": ["债券票面利率越大，债券价值越大", "债券面值越大，债券价值越大", "只有溢价债券或折价债券，才产生不同期限下债券价值有所不同的现象", "折现率越大，债券价值越大"], "answer": [3], "explain": "债券面值和票面利率越大，债券利息越多，债券价值越高，选项A、B正确。引起债券价值随债券期限的变化而波动的原因是债券票面利率与市场利率的不一致，所以选项C正确。折现率和债券价值反向变动，折现率越大，债券价值越小，选项D表述错误。"},
      {"type": "judge", "year": "1999", "title": "一种10年期的债券，票面利率为10%；另一种5年期的债券，票面利率亦为10%。两种债券的其他方面没有区别。在市场利息率急剧下降时，前一种债券价格上升得更多。", "options": ["对", "错"], "answer": [1], "explain": "债券期限越长，债券价值受市场利率的影响越大。"},
      {"type": "multi", "year": "2021", "title": "下列情形中，债券的实际利率与票面利率不一致的有(    )。", "options": ["债券溢价发行，每年年末付息一次，到期一次偿还本金", "债券折价发行，按年复利计息，到期一次还本付息", "债券按面值发行，每年年末付息一次，到期一次偿还本金", "债券按面值发行，按年复利计息，到期一次还本付息"], "answer": [0, 1], "explain": "“每年年末付息一次，到期一次偿还本金”和“按年复利计息，到期一次还本付息”，在实质上是相同的。债券按面值发行的情况下，实际利率与票面利率一致。溢价发行的情况下，实际利率低于票面利率。折价发行的情况下，实际利率高于票面利率。"},
      {"type": "multi", "year": "", "title": "债券A和债券B是两支刚发行的每年付息一次的债券，两个债券的面值、票面利率、市场利率均相同，以下说法中，正确的有(   )。", "options": ["若市场利率高于票面利率，偿还期限长的债券价值低", "若市场利率低于票面利率，偿还期限长的债券价值高", "若市场利率高于票面利率，偿还期限短的债券价值低", "若市场利率低于票面利率，偿还期限短的债券价值高"], "answer": [0, 1], "explain": "在票面利率偏离市场利率的情况下，债券期限越长，债券价值越偏离债券面值。由于市场利率与债券价值反向变动，当市场利率高于票面利率时，债券价值会低于面值，期限越长的债券价值会越低；当市场利率低于票面利率时，债券价值会高于面值，期限越长的债券价值会越高，选项A、B当选。"},
      {"type": "single", "year": "2025", "title": "下列关于债券价值的说法中，不正确的是（   ）。", "options": ["引起债券价值随债券期限的变化而波动的原因是债券票面利率与市场利率的不一致", "在票面利率偏离市场利率的情况下，债券期限越长，债券价值越偏离于债券面值", "市场利率的上升会导致债券价值的下降", "长期债券对市场利率的敏感性会小于短期债券"], "answer": [3], "explain": "长期债券对市场利率的敏感性会大于短期债券。在市场利率较低时，长期债券的价值远高于短期债券;在市场利率较高时，长期债券的价值远低于短期债券。选项 D 当选。"},

  "ch7": {
    "name": "第七章 营运资金管理",
    "questions": [
      {"type": "judge", "year": "2015", "title": "营运资金具有多样化、波动性、短期性、变动性和不易变现性等特点。", "options": ["对", "错"], "answer": [1], "explain": "营运资金一般具有如下特点：营运资金的来源具有多样性；营运资金的数量具有波动性；营运资金的周转具有短期性；营运资金的实物形态具有变动性和易变现性。"},
      {"type": "single", "year": "", "title": "某公司预测将出现通货膨胀，于是提前购置一批存货备用。从财务管理的角度看，这种行为属于（  ）。", "options": ["营运资金管理", "投资管理", "收入管理", "长期投资管理"], "answer": [0], "explain": "营运资金管理是对企业流动资产及流动负债的管理，存货属于流动资产。"},
      {"type": "multi", "year": "", "title": "下列各项中，对营运资金占用水平产生影响的有（    ）。", "options": ["货币资金", "应收账款", "预付账款", "存货"], "answer": [0, 1, 2, 3], "explain": "营运资金=流动资产－流动负债，选项A、B、C、D均属于流动资产，所以均会影响营运资金占用水平。"},
      {"type": "judge", "year": "", "title": "企业之所以持有一定数量的现金，主要是满足三个方面的需求：交易性需求、预防性需求和投资性需求。", "options": ["对", "错"], "answer": [1], "explain": "企业持有现金是由于三种需求：交易性需求、预防性需求和投机性需求。"},
      {"type": "single", "year": "", "title": "企业在销售旺季为方便向客户提供商业信用而持有更多现金，该现金持有动机主要表现为（    ）。", "options": ["交易性需求", "投资性需求", "投机性需求", "预防性需求"], "answer": [0], "explain": "预防性需求是指企业需要持有一定量的现金，以应付突发事件。本题表述正确。"},
      {"type": "judge", "year": "", "title": "公司为应对未来可能出现的突发事件而持有一定量的现金，该现金持有动机在于满足预防性需求。", "options": ["对", "错"], "answer": [1], "explain": "预防性需求是指企业需要持有一定量的现金，以应付突发事件。本题表述正确。"},
      {"type": "judge", "year": "", "title": "不考虑其他因素的影响，如果企业临时融资能力较强，则其预防性需求的现金持有量一般较低。", "options": ["对", "错"], "answer": [1], "explain": "现金收支预测可靠性程度较高，信誉良好，与银行关系良好的企业，预防性需求的现金持有量一般较低。"},
      {"type": "judge", "year": "2018", "title": "在紧缩型流动资产投资策略下，企业一般会维持较高水平的流动资产与销售收入比率，因此财务风险与经营风险较小。", "options": ["对", "错"], "answer": [1], "explain": "在紧缩的流动资产投资策略下，企业维持低水平的流动资产与销售收入比率。紧缩的流动资产投资策略可以节约流动资产的持有成本，但与此同时可能伴随着更高风险，所以经营风险和财务风险较高。"},
      {"type": "judge", "year": "", "title": "企业维持较高的流动资产存量水平可能会降低资金使用效率，但是会提高企业总体收益水平。", "options": ["对", "错"], "answer": [1], "explain": "企业维持较高的流动资产存量水平会降低营运资金的周转，降低资金使用效率。但是较高的流动资产存量水平，会增加流动资产的持有成本，降低资产的收益率。"},
      {"type": "multi", "year": "2021", "title": "下列各项中，不属于宽松的流动资产投资策略特点的有(    )。", "options": ["风险较低", "流动性低", "较少的流动资产", "收益较低"], "answer": [1, 2], "explain": "在宽松的流动资产投资策略下，企业通常会维持高水平的流动资产，因此流动性高。企业的财务与经营风险较小。但是，过多的流动资产投资,无疑会承担较大的流动资产持有成本，提高企业的资金成本，降低企业的收益水平。所以选项B、C不属于宽松的流动资产投资策略特点。"},
      {"type": "judge", "year": "", "title": "企业持有现金的机会成本主要是指企业为了取得投资机会而发生的佣金、手续费等有关成本。", "options": ["对", "错"], "answer": [1], "explain": "现金的机会成本，是指企业因持有一定现金余额丧失的再投资收益。"},
      {"type": "multi", "year": "", "title": "下列各项中，属于紧缩的流动资产投资策略特征的有(    )。", "options": ["流动资产周转速度较慢", "较高的存货占用水平", "更紧的应收账款信用政策", "较高的流动性风险"], "answer": [2, 3], "explain": "在紧缩的流动资产投资策略下，企业维持低水平的流动资产与销售收入比率，这样流动资产周转速度较快，选项A不当选。紧缩的流动资产投资策略可以节约流动资产的持有成本，例如节约持有资金的机会成本，与此同时可能伴随着更高风险，这些风险表现为 更紧的应收账款信用政策 和 较低的存货占用水平 ，以及缺乏现金用于偿还应付账款等，故选项B不当选，选项C、D当选。"},
      {"type": "multi", "year": "", "title": "相对于其他流动资产融资策略，激进融资策略的一般表现有(    )。", "options": ["财务杠杆较高", "流动性风险较高", "流动比率较低", "资本成本较高"], "answer": [1, 2], "explain": "激进融资策略通常使用更多的短期融资，短期融资方式通常比长期融资方式具有更低的成本，选项D不当选。然而，过多地使用短期融资会导致较低的流动比率和较高的流动性风险，选项B、C当选。激进融资策略短期临时性负债多，长期负债资金少，流动性风险高，但是利息低，所以财务杠杆不确定。"},
      {"type": "single", "year": "", "title": "如果一家企业采用激进的流动资产融资策略，通常表现为该企业所有临时性流动资产与部分永久性流动资产的资金来源是（ ）。", "options": ["长期负债", "自发性流动负债", "临时性流动负债", "股东权益资本"], "answer": [2], "explain": "在激进融资策略中，企业以长期负债、自发性负债和股东权益资本为所有的非流动资产融资，仅对一部分永久性流动资产使用长期融资方式融资。短期融资方式（临时性流动负债）支持剩下的永久性流动资产和所有的临时性流动资产，选项C当选。"},
      {"type": "single", "year": "", "title": "关于保守型流动资产融资策略，下列表述正确的是(     )。", "options": ["长期资金来源=非流动资产+永久性流动资产", "长期资金来源>非流动资产+永久性流动资产", "短期资金来源>波动性流动资产", "长期资金来源<非流动资产+永久性流动资产"], "answer": [1], "explain": "在保守融资策略中，长期融资支持非流动资产、永久性流动资产和部分波动性流动资产。企业通常以长期融资来源为波动性流动资产的平均水平融资，短期融资仅用于融通剩余的波动性流动资产。因此长期资金来源>非流动资产+永久性流动资产。"},
      {"type": "single", "year": "", "title": "某公司生产经营中永久性流动资产和波动性流动资产各400万元，不考虑其他因素，下列行为符合保守流动资产融资策略的是（    ）。", "options": ["用短期资金来源支持400万元波动性流动资产", "用短期资金来源支持200万元永久性流动资产", "用短期资金来源支持200万元波动性流动资产", "用短期资金来源支持400万元永久性流动资产"], "answer": [2], "explain": "保守流动资产融资策略下，短期资金来源小于波动性流动资产，剩余的波动性流动资产、永久性流动资产和非流动资产由长期资金来源支持。选项A是匹配融资策略，选项B、D是激进融资策略，选项C是保守融资策略。选项C当选。"},
      {"type": "multi", "year": "2024", "title": "某企业认为目前的流动性投资过于激进，计划改用较为宽松的流动性投资策略，这一策略变化可能产生的影响有（   ）。", "options": ["企业短期偿债能力增强", "企业流动资产持有成本上升", "企业营运资金占用水平降低", "企业资产整体收益性降低"], "answer": [0, 1, 3], "explain": "在宽松的流动资产投资策略下，企业通常会维持高水平的流动资产与销售收入比率。也就是说，企业营运资金占用水平高，所以选项C错误。这种策略下，由于较高的流动性，企业短期偿债能力增强，企业的财务与经营风险较小，所以选项A正确。但是，过多的流动资产投资，无疑会承担较大的流动资产持有成本（机会成本），，降低企业的收益水平，所以，选项B、D正确。"},
      {"type": "single", "year": "2019", "title": "下列关于流动资产投资策略的表述中，错误的是(　　)。", "options": ["在紧缩的流动资产投资策略下，流动资产与销售收入比率较低", "在宽松的流动资产投资策略下，企业的财务和经营风险较小", "采用紧缩的流动资产投资策略，可以节约流动资产的持有成本", "制定流动资产投资策略时，不需要权衡资产的收益性和风险性"], "answer": [3], "explain": "增加流动资产投资会增加流动资产的持有成本，降低资产的收益性，但会提高资产的流动性。反之，减少流动资产投资会降低流动资产的持有成本，增加资产的收益性，但资产的流动性会降低，短缺成本会增加。所以制定流动资产投资策略时，需要权衡资产的收益性与风险性。选项D错误。"},
      {"type": "multi", "year": "2023", "title": "在用成本分析模式确定最佳现金持有量时，下列说法正确的有（   ）。", "options": ["机会成本与现金持有量成正比", "管理成本一般为固定成本", "短缺成本与现金持有量成反比", "交易成本与现金持有量成反比"], "answer": [0, 1, 2], "explain": "现金的机会成本是指企业因持有一定现金余额丧失的再投资收益，所以选项A正确;现金的管理成本是指企业因持有一定数量的现金而发生的管理费用，如管理人员工资、安全措施费用等，所以选项B正确;现金的短缺成本是指在现金持有量不足，又无法及时通过有价证券变现加以补充所给企业造成的损失，所以选项C正确;成本分析模式不考虑交易成本，所以选项D错误。"},
      {"type": "multi", "year": "2017", "title": "下列关于营运资金管理的表述中，正确的有(    )。", "options": ["销售稳定并可预测时，投资于流动资产的资金可以相对少一些", "加速营运资金周转，有助于降低资金使用成本", "管理者偏好高风险收益时，通常会保持较低的流动资产投资水平", "销售变数较大而难以预测时，通常要维持较低的流动资产与销售收入比率"], "answer": [0, 1, 2], "explain": "销售额越不稳定，越不可预测，则投资于流动资产上的资金就应越多，以保证有足够的存货和应收账款占用来满足生产经营和顾客的需要，选项D不正确。"},
      {"type": "multi", "year": "2021", "title": "企业在制定流动资产融资策略时，下列各项中被视为长期资金来源的有(    )。", "options": ["股东权益资本", "临时性流动负债", "自发性流动负债", "长期负债"], "answer": [0, 2, 3], "explain": "在流动资产的融资策略中，融资的长期来源包括自发性流动负债、长期负债以及股东权益资本；短期来源主要是指临时性流动负债，例如短期银行借款。"},
      {"type": "single", "year": "", "title": "某公司资产总额为1 800万元，其中永久性流动资产为480万元，波动性流动资产为320万元，该公司长期资金来源金额为1 600万元，不考虑其他情形，可以判断该公司的融资策略属于(    )。", "options": ["期限匹配融资策略", "保守融资策略", "激进融资策略", "风险匹配融资策略"], "answer": [1], "explain": "在保守融资策略中，长期融资支持非流动资产、永久性流动资产和部分波动性流动资产。永久性流动资产为480万元，波动性流动资产为320万元，所以非流动资产＝1800－480－320＝1 000(万元)，非流动资产＋永久性流动资产＝1000＋480＝1 480(万元)< 1 600万元，因此选项B正确。"},
      {"type": "single", "year": "", "title": "A公司是一家冰淇淋生产企业，淡季占用200万元货币资金、400万元应收账款、800万元存货、2 000万元固定资产以及600万元无形资产(除此以外无其他资产)，旺季需额外增加500万元季节性存货。经营性流动负债、长期负债和股东权益总额始终保持在3 800万元，其余靠短期借款提供资金。甲公司的营运资本筹资策略是(    )。", "options": ["保守融资策略", "期限匹配融资策略", "激进融资策略", "无法确定"], "answer": [2], "explain": "永久性流动资产＋长期资产＝200＋400＋800＋2000＋600＝4 000(万元)，股东权益＋长期债务＋经营性流动负债＝3 800(万元)，4 000万元＞3 800万元，说明部分稳定性流动资产依靠临时性负债，属于激进筹资策略。"},
      {"type": "single", "year": "2024", "title": "如果一家企业采用激进的流动资产融资策略，通常表现为该企业所有临时性流动资产与部分永久性流动资产的资金来源是（   ）。", "options": ["长期负债", "自发性流动负债", "临时性流动负债", "股东权益资本"], "answer": [2], "explain": "在激进融资策略中，企业以长期负债、自发性负债和股东权益资本为所有的非流动资产融资，仅对一部分永久性流动资产使用长期融资方式融资。临时性流动负债（即短期融资来源）支持剩余的永久性流动资产和所有的临时性流动资产。"},
      {"type": "single", "year": "2015", "title": "某公司用长期资金来源满足全部非流动资产和部分永久性流动资产的需要，而用短期资金来源满足剩余部分永久性流动资产和全部波动性流动资产的需要，则该公司的流动资产融资策略是(    )。", "options": ["激进融资策略", "保守融资策略", "折中融资策略", "期限匹配融资策略"], "answer": [0], "explain": "激进融资策略的特点：长期资金来源＜(非流动资产＋永久性流动资产)、短期资金来源＞波动性流动资产，收益和风险较高，所以选项A正确。"},
      {"type": "judge", "year": "2021", "title": "为满足每年“双十一”大促销的备货需求而增持现金，反映了企业持有现金的交易性需求。", "options": ["对", "错"], "answer": [1], "explain": "企业的交易性需求是指企业为了维持日常周转及正常商业活动所需持有的现金额。“双十一”属于正常的销售旺季，既不是突发事件也不是突然出现的获利机会，因此不属于预防性需求和投机性需求。"},
      {"type": "single", "year": "2020", "title": "某企业因供应商收回了信用政策，导致资金支付需求增加，需要补充持有大量现金，这种持有现金的动机属于(    )。", "options": ["交易性", "投资性", "预防性", "调整性"], "answer": [0], "explain": "企业的交易性需求是指企业为了维持日常周转及正常商业活动所需持有的现金额，故选项A正确。"},
      {"type": "judge", "year": "2019", "title": "不考虑其他因素的影响，如果企业临时融资能力较强，则其预防性需求的现金持有量一般较低。", "options": ["对", "错"], "answer": [1], "explain": "预防性需求是指企业需要持有一定量的现金，以应付突发事件。本题表述正确。"},
      {"type": "judge", "year": "2022", "title": "企业为应对未来可能出现的大客户违约导致经营紧张而持有一定的现金，该现金的持有目的在于满足投机性需求。", "options": ["对", "错"], "answer": [1], "explain": "预防性需求是指企业需要持有一定量的现金，以应付突发事件，可能是社会经济环境的变化，也可能是为了避免未来可能出现大客户的违约。企业为应对未来可能出现的大客户违约导致经营紧张而持有一定的现金是为了满足预防性需求。本题表述错误。"},
      {"type": "single", "year": "2019", "title": "某公司发现某股票的价格因突发事件而大幅度下降，预判有很大的反弹空间，但苦于没有现金购买。这说明该公司持有的现金未能满足(    )。", "options": ["投机性需求", "预防性需求", "决策性需求", "交易性需求"], "answer": [0], "explain": "投机性需求是企业需要持有一定量的现金以抓住突然出现的获利机会。这种机会大多是一闪即逝的，如证券价格的突然下跌，企业若没有用于投机的现金，就会错过这一机会。"},
      {"type": "single", "year": "", "title": "在利用成本分析模型进行最佳现金持有量决策时，下列成本因素中未被考虑在内的是（    ）。", "options": ["机会成本", "交易成本", "短缺成本", "管理成本"], "answer": [1], "explain": "成本分析模型考虑的现金持有成本包括:机会成本、管理成本、短缺成本。"},
      {"type": "multi", "year": "2024", "title": "如果企业采用成本分析模型确定最佳现金持有量，该模型下现金持有总成本包括（   ）。", "options": ["短缺成本", "交易成本", "机会成本", "管理成本"], "answer": [0, 2, 3], "explain": "成本分析模型下，最佳现金持有量下的现金持有总成本=min(机会成本＋管理成本＋短缺成本)，因此选项A、C、D正确。"},
      {"type": "multi", "year": "", "title": "在用成本分析模式确定最佳现金持有量时，下列说法正确的有(    ) 。", "options": ["机会成本与现金持有量成正比", "管理成本一般为固定成本", "短缺成本与现金持有量成反比", "交易成本与现金持有量成反比"], "answer": [0, 1, 2], "explain": "在用成本分析模式确定最佳现金持有量时无须考虑交易成本。选项A、B、C说法正确，均应当选。"},
      {"type": "single", "year": "", "title": "运用成本分析模型计算最佳现金持有量时，下列公式中，正确的是(    )。", "options": ["最佳现金持有量＝min(管理成本＋机会成本＋转换成本)", "最佳现金持有量＝min(管理成本＋机会成本＋短缺成本)", "最佳现金持有量＝min(机会成本＋交易成本＋转换成本)", "最佳现金持有量＝min(机会成本＋经营成本＋短缺成本)"], "answer": [1], "explain": "成本分析模型强调的是：持有现金是有成本的，最优的现金持有量是使现金持有成本最小化的持有量。其计算公式为：最佳现金持有量下的现金持有总成本＝min(管理成本＋机会成本＋短缺成本)，因此选项B是正确的。"},
      {"type": "judge", "year": "2020", "title": "根据存货模型，最佳现金持有量是机会成本线和交易成本线交叉点所对应的现金持有量。", "options": ["对", "错"], "answer": [1], "explain": "根据存货模型，使得现金的机会成本和交易成本相等时的那一个现金持有量是最佳现金持有量。"},
      {"type": "judge", "year": "2019", "title": "企业持有现金的机会成本主要是指企业为了取得投资机会而发生的佣金、手续费等有关成本。", "options": ["对", "错"], "answer": [1], "explain": "现金的机会成本，是指因持有现金而丧失的投资其他机会的收益。企业为了取得投资机会而发生的佣金、手续费等有关成本属于交易成本，不是机会成本。"},
      {"type": "single", "year": "2018", "title": "某公司当年的资本成本率为10%，现金平均持有量为30万元，现金管理费用为2万元，现金与有价证券之间的转换成本为1.5万元，则该公司当年持有现金的机会成本是(    )万元。", "options": ["5", "3.5", "6.5", "3"], "answer": [3], "explain": "持有现金的机会成本=30×10%=3(万元)。"},
      {"type": "multi", "year": "", "title": "甲公司采用成本分析模式确定最佳现金持有量。下列说法中，正确的有(　　)。", "options": ["现金机会成本和短缺成本相等时的现金持有量是最佳现金持有量", "现金机会成本和管理成本相等时的现金持有量是最佳现金持有量", "现金机会成本最小时的现金持有量是最佳现金持有量", "现金机会成本、管理成本和短缺成本之和最小时的现金持有量是最佳现金持有量"], "answer": [0, 3], "explain": "成本分析模式下，管理成本是固定成本，和现金持有量之间无明显的比例关系，因此机会成本和短缺成本相等时的现金持有量即为最佳现金持有量，此时现金机会成本、管理成本和短缺成本之和最小。"},
      {"type": "single", "year": "", "title": "某公司采用随机模型计算得出目标现金余额为200万元，最低限额为120万元，则根据该模型计算的现金上限为（    ）万元。", "options": ["280", "360", "240", "320"], "answer": [1], "explain": "最高控制线H=3R－2L=3×200－2×120=360（万元）。"},
      {"type": "single", "year": "", "title": "在确定目标现金余额的随机模型中，如果最低控制线 L 值为 10 000 元，回归线 R 为 15 500 元，则最高控制线 H 值为（ ）元。", "options": ["21 000", "25 500", "31 000", "26 500"], "answer": [3], "explain": "最高控制线 H 值 =15500+2*5500=26 500（元），选 项 D 当选。"},
      {"type": "single", "year": "2016", "title": "某企业根据现金持有量随机模型进行现金管理。已知现金最低持有量为15万元，现金余额回归线为80万元。如果公司现有现金220万元，此时应当投资于有价证券的金额是(    )万元。", "options": ["65", "95", "140", "205"], "answer": [2], "explain": "最高控制线H＝3R－2L，可以得出H＝3×80－2×15＝210(万元)，由于现金持有量220高于上限，则投资于有价证券的金融＝220－R＝220－80＝140(万元)。"},
      {"type": "multi", "year": "2024", "title": "某公司采用随机模型确定最佳现金持有量，最低控制线L值为15万元，回归线R值为55万元，下列表述正确的有（   ）。", "options": ["当现金持有额为140万元时，则用现金85万元买入有价证券", "当现金持有额为10万元时，则卖出有价证券换取现金53万元", "当现金持有额为60万元时，则用现金5万元买入有价证券", "当现金持有额为70万元时，则无需调整"], "answer": [0, 3], "explain": "最高控制线=3R－2L=3×55－2×15=135(万元)，当现金持有额在上下限之间时，不需要进行调整，选项C错误、选项D正确;当现金持有额≥上限，或者现金持有额≤下限时，需要调整，当现金持有额为140万元时，应购入有价证券140－55=85(万元)，选项A正确;当现金持有额为10万元时，应卖出有价证券 55－10=45(万元)，选项B错误。"},
      {"type": "single", "year": "", "title": "甲公司采用随机模型确定的目标现金余额为19000万元，若现金余额的最低控制线(下限)为15000万元，目前的现金余额为22000万元，则下列说法正确的是( )。", "options": ["应该购买3000万元的有价证券", "无须进行调整", "应该购买7000万元的有价证券", "应该出售5000万元的有价证券"], "answer": [1], "explain": "现金余额的上限=19000+2*4000= 27000 (万元)，目前的现金余额22000万元介于上限（27000万元）和下限（15000万元）之间，因此，无须进行调整，选项B当选。"},
      {"type": "single", "year": "2022", "title": "某公司采用随机模型确定目标现金余额，若现金余额的最低控制线(下限)为3000万元，最高控制线(上限)为15000万元，则该公司的目标现金余额为(    )。", "options": ["6000万元", "5000万元", "9000万元", "7000万元"], "answer": [3], "explain": "令：(15000－回归线)＝2×(回归线－3000)，解得：回归线(即目标现金余额)＝(15000＋2×3000)/3＝7000(万元)，选项D正确。"},

      {"type": "judge", "year": "", "title": "现金管理的存货模型中，最佳现金持有量是机会成本线和交易成本线交叉的点所对应的现金持有量。", "options": ["对", "错"], "answer": [1], "explain": "在现金管理的存货模型中，随着现金持有量的增加，机会成本逐渐增加，而交易成本逐渐减少，当机会成本和交易成本相等时（即机会成本线和交易成本线相交时），持有现金的总成本最低，此时现金持有量达到最优。本题表述正确。"},
      {"type": "judge", "year": "", "title": "在确定目标现金余额时，无论成本分析模型还是存货模型，都需要考虑持有现金的机会成本。", "options": ["对", "错"], "answer": [1], "explain": "成本分析模型需要考虑的成本有机会成本、管理成本和短缺成本。存货模型需要考虑的成本有机会成本和交易成本。所以两种模型都需要考虑持有现金的机会成本。"},

      {"type": "single", "year": "", "title": "某公司有甲乙丙丁四个现金持有方案，现金持有量分别为30000元、35000元、168000元和240000元，短缺成本分别为40000元、16000元、12000元和0元，各方案的机会成本均为现金持有量的10%，管理成本均为12000元，若采用成本分析模型确定最佳现金持有量，则该公司应选择的方案是（ ）。", "options": ["甲方案", "乙方案", "丙方案", "丁方案"], "answer": [1], "explain": "成本分析模型下现金持有总成本=机会成本+短缺成本+管理成本。甲方案现金持有总成本=30000×10%+40000+12000=55000（元）。乙方案现金持有总成本=35000×10%+16000+12000=31500（元）。丙方案现金持有总成本=168000×10%+12000+12000=40800（元）。丁方案现金持有总成本=240000×10%+0+12000=36000（元）。乙方案现金持有总成本最低，故应选择乙方案，选项B当选。"},

      {"type": "judge", "year": "", "title": "在确定企业目标现金余额的存货模型中，现金交易成本和现金的转换次数有关，转换次数越少，现金的交易成本越低。", "options": ["对", "错"], "answer": [1], "explain": "交易成本=交易次数（转换次数）×每次交易成本，其他条件不变的情况下，转换次数越少，现金的交易成本越低。本题表述正确。"},
      {"type": "multi", "year": "", "title": "存货模式和随机模式是确定最佳现金持有量的两种方法。对这两种方法的以下表述中，正确的有(　　)。", "options": ["两种方法都考虑了现金的交易成本和机会成本", "存货模式简单、直观，比随机模式有更广泛的适用性", "随机模式可以在企业现金未来需要总量和收支不可预测的情况下使用", "随机模式确定的现金持有量，更易受到管理人员主观判断的影响"], "answer": [0, 2, 3], "explain": "存货模式是一种简单、直观的确定最佳现金持有量的方法。但是假定现金的流出量稳定不变，实际上这种情况很少出现。随机模式是建立在现金未来需求总量和收支不可预测的前提下，随机模式比存货模式有更广泛的适用性。所以选项B错误、选项C正确。随机模式的下限会受到管理人员主观判断的影响，所以选项D正确。"},

      {"type": "single", "year": "2021", "title": "已知存货周转期为45天，应收账款周转期为60天，应付账款周转期为40天，则现金周转期为(    )。", "options": ["145天", "65天", "105天", "25天"], "answer": [1], "explain": "经营周期＝存货周转期＋应收账款周转期＝45＋60＝105(天)，现金周转期＝经营周期－应付账款周转期＝105－40＝65(天)。56. 【单选·2024】某企业购货的平均付款期为30天，销货的平均收款期为40天，全年存货周转率为7.2次，一年按照360天计算，不考虑其他因素，现金周转期为（   ）。  分值4分A.70天B.60天C.40天D.120天答案:B解析:存货周转期=360/7.2=50(天)现金周转期=存货周转期＋应收账款周转期-应付账款周转期=50＋40－30=60(天)。回答错误+0分正确答案: B.60天答案解析：解析:存货周转期=360/7.2=50(天)，现金周转期=存货周转期＋应收账款周转期-应付账款周转期=50＋40－30=60(天)。"},

      {"type": "multi", "year": "2010", "title": "下列各项关于现金周转期的表述中，正确的有(    )。", "options": ["减慢支付应付账款可以缩短现金周转期", "产品生产周期的延长会缩短现金周转期", "现金周转期一般短于存货周转期与应收账款周转期之和", "现金周转期是介于公司支付现金与收到现金之间的时间段"], "answer": [0, 2, 3], "explain": "现金周转期＝存货周转期＋应收账款周转期－应付账款周转期。“产品生产周期的延长”意味着存货周转期的延长，则现金周转期延长。所以，正确答案为ACD。"},

      {"type": "judge", "year": "2022", "title": "使用现金浮游量、推迟应付款支付、支票代替汇票等举措，可以使得收款成本和收款浮动期达到最小。", "options": ["对", "错"], "answer": [1], "explain": "使用现金浮游量、推迟应付款支付、以汇票代替支票都尽可能推迟现金的支出，这些都属于付款管理的方式。汇票属于延期支付的方式，以支票代替汇票不属于延期支付。另外，使得收款成本和收款浮动期达到最小属于收款管理的目的，并非付款管理的目的。"},

      {"type": "multi", "year": "", "title": "下列各项措施中，可降低应收账款周转天数的有(　  )。", "options": ["提高信用标准", "提高现金折扣率", "延长信用期限", "提高坏账准备计提比率"], "answer": [0, 1], "explain": "提高信用标准，客户赖账的可能性降低，所以会降低应收账款的周转天数。即选项A是答案；提高现金折扣百分比，会有更多顾客在折扣期内付款，缩短了平均收现期，周转天数降低，选项B是答案；延长信用期间会延长平均收现期，周转天数提高，选项C不是答案；计算应收账款周转率时，不扣除坏账准备，所以，选项D不影响应收账款周转天数，即选项D不是答案。"},
      {"type": "multi", "year": "2020", "title": "甲公司准备变更信用政策，拟选用缩短信用期或提供现金折扣两项措施之一。下列关于两项措施相同影响的说法中，正确的有(    )。", "options": ["均增加销售收入", "均减少坏账损失", "均减少收账费用", "均增加应收账款"], "answer": [1, 2], "explain": "缩短信用期会降低对顾客的吸引力，可能减少销售收入和应收账款。而提供现金折扣会提高对顾客的吸引力，可能增加销售收入；也可能导致客户提前付款，减少应收账款。选项A、D错误。"},
      {"type": "single", "year": "", "title": "某公司全年销售额为7200万元（一年按360天计算），变动成本率为60%，公司采用的信用政策为1/20 ，N/30，预计有50%的客户(按30天信用期所能实现的销售量计算)在第20天付款，其余客户在第30天付款，若等风险投资的最低收益率为5%，则应收账款的机会成本为（    ）。", "options": ["15万元", "10万元", "8万元", "18万元"], "answer": [0], "explain": "应收账款的机会成本 = 日销售额 × 平均收现期 × 变动成本率 × 资本 成本，通过公式可知，应收账款收现期延长，机会成本将增加。本题表述正确。"},
      {"type": "judge", "year": "", "title": "其他条件不变，应收账款收现期延长，机会成本增加。", "options": ["正确", "错误"], "answer": [1], "explain": "应收账款的机会成本 = 日销售额 × 平均收现期 × 变动成本率 × 资本 成本，通过公式可知，应收账款收现期延长，机会成本将增加。本题表述正确。"},
      {"type": "single", "year": "", "title": "应收账款周转次数是指一定期间产生的应收账款总额与营业收入总额的比值。", "options": ["正确", "错误"], "answer": [0], "explain": "应收账款周转次数 = 营业收入 ÷ 应收账款平均余额。本题表述错误。"},
      {"type": "single", "year": "", "title": "某公司全年应收账款平均余额为360万元，平均日赊销额为10万元，信用条件为在30天内按全额付清款项，则该公司应收账款的平均逾期天数为（     ）。", "options": ["0天", "6天", "30天", "36天"], "answer": [1], "explain": "应收账款的平均逾期天数=应收账款周转天数-平均信用期天数=应收账款平均余额÷日赊销额-平均信用期天数=360÷10-30=6（天），选项B当选。注意:应收账款周转天数=360÷应收账款周转率=360 × 应收账款平均余额÷赊销收入=[360 × 应收账款平均余额 ÷360]÷[赊销收入 ÷360]=应收账款平均余额÷日赊销额。"},

      {"type": "judge", "year": "2016", "title": "在应收账款保理中，从风险角度看，有追索权的保理相对于无追索权的保理对供应商更有利，对保理商更不利。", "options": ["对", "错"], "answer": [1], "explain": "有追索权保理指保理商有追索权，坏账风险由供应商承担，对供应商不利，而对保理商有利。"},
      {"type": "single", "year": "2012", "title": "按照ABC管理方法，作为催款的重点对象是(    )。", "options": ["应收账款逾期金额占应收账款逾期金额总额的比重大的客户", "应收账款账龄长的客户", "应收账款数额占全部应收账款数额比重大的客户", "应收账款比重小的客户"], "answer": [0], "explain": "应收账款逾期金额占应收账款逾期金额总额的比重大的客户属于A类客户，这类客户作为催款的重点对象。"},
      {"type": "judge", "year": "2020", "title": "应收账款保理的主要意图在于将逾期未能收回的应收账款转让给保理商，从而获取相应的资金。", "options": ["对", "错"], "answer": [1], "explain": "应收账款保理是企业将赊销形成的未到期应收账款(而不是逾期未能收回的应收账款)，在满足一定条件的情况下转让给保理商，以获得流动资金，加快资金的周转。"},
      {"type": "single", "year": "2017", "title": "在应收账款保理业务中，保理商和供应商将应收账款被转让的情况通知购货商，并签订三方合同，同时，供应商向保理商融通资金后，如果购货商拒绝付款，保理商有权向供应商要求偿还融通的资金，则这种保理是(    )。", "options": ["暗保理，且是无追索权的保理", "明保理，且是有追索权的保理", "暗保理，且是有追索权的保理", "明保理，且是无追索权的保理"], "answer": [1], "explain": "有追索权保理指供应商将债权转让给保理商，供应商向保理商融通货币资金后，如果购货商拒绝付款或无力付款，保理商有权向供应商要求偿还预付的货币资金，这种保理方式在我国采用较多。明保理是指保理商和供应商需要将销售合同被转让的情况通知购货商，并签订保理商、供应商、购货商之间的三方合同，因此本题选项B正确。"},
      {"type": "multi", "year": "2021", "title": "关于企业应收账款保理，下列表述正确的有(    )。", "options": ["增强了资产的流动性", "是资产证券化的一种形式", "具有融资功能", "能够减少坏账损失"], "answer": [0, 2, 3], "explain": "应收账款保理对于企业而言，其财务管理作用主要体现在：(1)融资功能；(2)减轻企业应收账款的管理负担；(3)减少坏账损失，降低经营风险；(4)改善企业的财务结构。应收账款保理不属于资产证券化。企业应收账款资产支持证券，是指证券公司、基金管理公司子公司作为管理人，通过设立资产支持专项计划开展资产证券化业务，以企业应收账款债权为基础资产或基础资产现金流来源所发行的资产支持证券。"},
      {"type": "multi", "year": "2022", "title": "关于应收账款保理的作用，下列表述正确的有(    )。", "options": ["增强企业资产的流动性", "降低企业的经营风险", "优化企业的股权结构", "减轻企业应收账款的管理负担"], "answer": [0, 1, 3], "explain": "应收账款保理对于企业而言，其财务管理作用主要体现在：(1)融资功能；(2)减轻企业应收账款的管理负担；(3)减少坏账损失，降低经营风险；(4)改善企业的财务结构。企业通过出售应收账款,将流动性稍弱的应收账款置换为具有高度流动性的货币资金,增强了企业资产的流动性,提高了企业的债务清偿能力。选项A、B、D当选。"},
      {"type": "single", "year": "", "title": "下列各项中，不属于存货储存成本的是(   )。", "options": ["存货仓储费用", "存货破损和变质损失", "存货储备不足而造成的损失", "存货占用资金的应计利息"], "answer": [2], "explain": "存货储备不足而造成的损失属于存货的缺货成本。"},
      {"type": "multi", "year": "2017", "title": "下列成本费用中，一般属于存货变动储存成本的有(    )。", "options": ["库存商品保险费", "存货资金应计利息", "存货毁损和变质损失", "仓库折旧费"], "answer": [0, 1, 2], "explain": "储存成本也分为固定成本和变动成本。固定成本与存货数量的多少无关，如仓库折旧、仓库职工的固定工资等。变动成本与存货的数量有关，如存货资金的应计利息、存货的破损和变质损失、存货的保险费用等。"},
      {"type": "multi", "year": "2022", "title": "根据经济订货基本模型，影响经济订货批量的相关存货成本有(    )。", "options": ["固定订货成本", "变动储存成本", "变动订货成本", "固定储存成本"], "answer": [1, 2], "explain": "与批量相关的存货总成本＝变动订货成本＋变动储存成本，因此与经济订货批量相关的成本包括变动订货成本、变动储存成本，选项B、C正确。"},
      {"type": "single", "year": "2020", "title": "某公司存货年需求量为36 000千克，经济订货批量为600千克，一年按360天计算，则最佳订货期为（   ）天。", "options": ["100", "1.67", "60", "6"], "answer": [3], "explain": "最佳订货次数=36000/600=60(次)，最佳订货期=360/60=6(天)。"},

      {"type": "single", "year": "2021", "title": "某材料日需用量为50千克，经济订货批量为4500千克，订货后平均交货时间为6天，基于扩展的经济订货模型，再订货点为(    )。", "options": ["750千克", "150千克", "540千克", "300千克"], "answer": [3], "explain": "再订货点＝50×6＝300(千克)"},

      {"type": "judge", "year": "", "title": "在扩展的经济订货模型下，订货提前期越长则经济订货量越大。", "options": ["对", "错"], "answer": [1], "explain": "经济订货批量和订货提前期毫无关系。"},
      {"type": "single", "year": "", "title": "根据经济订货基本模型，下列选项中与计算经济订货批量无关的因素是(    )。", "options": ["存货年需要量", "缺货成本", "单位变动储存成本", "每次订货变动成本"], "answer": [1], "explain": "经济订货批量=(2×存货年需要量×每次订货的变动成本/单位变动储存成本)^ (0.5) 。由公式可知，经济订货批量的计算不涉及缺货成本。选项B当选。"},
      {"type": "judge", "year": "", "title": "在经济订货扩展模型下，某材料的保险储备100千克，每千克材料的储备成本为2元，则保险储备的储存成本为100元。(    )", "options": ["正确", "错误"], "answer": [1], "explain": "进货期内平均库存量=（每批订货数-每批订货数÷每日送货量×每日耗用量）÷2=（600-600÷30×10）÷2=200（件），选项C当选。"},
      {"type": "single", "year": "", "title": "基于经济订货扩展模型进行存货管理，若每批订货数为600件，每日送货量为30件，每日耗用量为10件，则进货期内平均库存量为（     ）。", "options": ["400件", "300件", "200件", "290件"], "answer": [2], "explain": "进货期内平均库存量=（每批订货数-每批订货数÷每日送货量×每日耗用量）÷2=（600-600÷30×10）÷2=200（件），选项C当选。"},
      {"type": "single", "year": "", "title": "某材料日需用量为 50 千克，经济订货批量为 4 500 千克，订货后平均交货时间为6 天，基于扩展的经济订货模型，再订货点为（     ）。", "options": ["750 千克", "150 千克", "540 千克", "300 千克"], "answer": [3], "explain": "再订货点 = 日需用量 × 平均交货时间 =50 × 6=300 （千克） ，选项 D 当选。"},
      {"type": "single", "year": "", "title": "某公司全年（按360天计）材料采购量预计为7200吨，假定材料日耗均衡，从订货到送达正常需要3天，鉴于延迟交货会产生较大损失，公司按照延误天数2天建立保险储备。不考虑其他因素，材料再订货点为（ ）吨。", "options": ["80", "40", "60", "100"], "answer": [3], "explain": "每日平均需用量d=7200/360=20（吨），再订货点R=L×d+B=3×20+2×20=100（吨）。"},
      {"type": "single", "year": "2023", "title": "根据经济订货批量的基本模型，下列各项中，可能导致经济订货批量提高的是（    ）。", "options": ["每期对存货的总需求降低", "每次订货费用降低", "每期单位变动储存成本降低", "存货的采购单价降低"], "answer": [2], "explain": "经济订货批量EOQ\"=\" √((\"2×\" 年需求量\"×\" 每次订货的变动成本)/单位变动储存成本)，所以，每期对存货的总需求、每次订货费用与经济订货批量EOQ同方向变动;每期单位变动储存成本与经济订货批量EOQ反方向变动。存货的采购单价不影响经济订货批量EOQ。所以，选项C正确。"},
      {"type": "judge", "year": "2023", "title": "在经济订货扩展模型下，某材料的保险储备100千克，每千克材料的储备成本为2元，则保险储备的储存金额为200元。（   ）", "options": ["答案:对", "答案：错"], "answer": [1], "explain": "保险储备的储存金额=100×2=200（元）。"},
      {"type": "single", "year": "", "title": "根据存货陆续供应与使用模型，下列情形中能够导致经济批量降低的是(    )。", "options": ["存货需求量增加", "一次订货成本增加", "单位储存变动成本增加", "每日消耗量增加"], "answer": [2], "explain": "根据存货陆续供应和使用的经济订货量公式： EOQ＝√((\"2×\" 年需要量\"×\" 每次订货变动成本)/(单位变动储存成本\"×(1－\"  d/P \")\" ))，可以看出，存货需求量增加、一次订货成本增加、每日消耗量增加都会使经济批量增加，而单位储存变动成本增加会使经济批量降低。"},
      {"type": "single", "year": "", "title": "下列关于存货保险储备的表现中，正确的是(    )。", "options": ["较低的保险储备可降低存货缺货成本", "保险储备的多少取决于经济订货量的大小", "最佳保险储备能使缺货损失和保险储备的储存成本之和达到最低", "较高的保险储备可降低存货储存成本"], "answer": [2], "explain": "较低的保险储备降低储存成本，但增加缺货损失，较大的保险储备反之，企业的最佳保险储备应该是缺货损失和保险储备的储存成本之和达到最低。"},
      {"type": "multi", "year": "", "title": "在存货订货量决策中，下列关于保险储备的表述正确的有(    )。", "options": ["保险储备增加，存货的缺货损失减小", "保险储备增加，存货供货中断的概率变小", "保险储备增加，存货的再订货点降低", "保险储备增加，存货的储存成本提高"], "answer": [0, 1, 3], "explain": "存货的保险储备与存货的缺货损失、存货供货中断呈反向变动关系，与存货储存成本呈同向变动关系，选项A、B、D正确。因为设置保险储备的再订货点＝预计交货期内的需求＋保险储备，保险储备增加会使存货的再订货点增加，故选项C错误。"},
      {"type": "multi", "year": "", "title": "下列模型中，不需要考虑短缺成本的有(    )。", "options": ["最佳现金持有量的成本分析模式", "最佳现金持有量的随机模式", "经济订货量的陆续到货模型", "经济订货量的保险储备模型"], "answer": [1, 2], "explain": "最佳现金持有量的存货模式和随机模式，都不允许出现存货短缺，故无短缺成本，选项B当选；经济订货量的基本模型和陆续到货模型都不允许缺货，即不允许出现短缺成本，选项C当选。"},
      {"type": "single", "year": "2015", "title": "甲公司生产产品所需某种材料需求不稳定，为保障原料的供应，现设置保险储备，确定合理保险储备的依据是(    )。", "options": ["缺货成本与保险储备成本之和最小", "缺货成本与保险储备成本之差最大", "边际保险储备成本小于边际缺货成本", "边际保险储备成本大于边际缺货成本"], "answer": [0], "explain": "研究保险储备的目的，就是要找出合理的保险储备量，使缺货或供应中断损失和保险储备成本之和最小。"},
      {"type": "judge", "year": "2021", "title": "存货管理中，较高的保险储备增加了存货的储存成本，但降低了缺货成本。", "options": ["对", "错"], "answer": [1], "explain": "较高的保险储备可降低缺货损失，进而降低缺货成本，但同时也增加了存货的储存成本。"},
      {"type": "single", "year": "", "title": "采用ABC控制法进行存货管理时，应该重点控制的存货类别是(    )。", "options": ["品种较多的存货", "数量较多的存货", "库存时间较长的存货", "单位价值较大的存货"], "answer": [3], "explain": "ABC控制法就是把企业种类繁多的存货，依据其重要程度、价值大小或者资金占用等标准分为三大类：A类高价值存货，品种数量少。A类存货应作为管理的重点，所以正确答案为D。"},
      {"type": "single", "year": "", "title": "某企业从银行获得附有承诺的周转信贷额度为1 000万元，承诺费率为0.5%，年初借入800万元，年底偿还，年利率为5%。则该企业负担的承诺费是(    )万元。", "options": ["1", "4", "5", "9"], "answer": [0], "explain": "该企业负担的承诺费＝(1000－800)×0.5%＝1(万元)。"},
      {"type": "single", "year": "2017", "title": "某企业获100万元的周转信贷额度，约定年利率为10%，承诺费率为0.5%，年度内企业实际动用贷款60万元，使用了12个月，则该笔业务在当年实际的借款成本为(    )万元。", "options": ["10", "10.2", "6.2", "6"], "answer": [2], "explain": "利息＝60×10%＝6(万元)，承诺费＝(100－60)×0.5%＝0.2(万元)，则实际的借款成本＝6＋0.2＝6.2(万元)，本题选项C正确。"},
      {"type": "single", "year": "2019", "title": "某公司向银行借款2 000万元，期限为1年,年利率为6.5%,银行要求的补偿性余额比例为12%，则该借款的实际利率为(   )。", "options": ["7.28%", "6.5%", "7.39%", "12%"], "answer": [2], "explain": "借款的实际利率＝6.5%/(1-12%)＝7.39%。"},
      {"type": "single", "year": "", "title": "某企业需要借入资金60万元，由于贷款银行要求将贷款金额的20%作为补偿性余额，故企业需要向银行申请的贷款数额为(    )万元。", "options": ["75", "72", "60", "50"], "answer": [0], "explain": "企业需要向银行申请的贷款数额＝60/(1－20%)＝75万元。"},
      {"type": "judge", "year": "2021", "title": "某公司从银行取得1年期借款100万元，年利率5%。若按贴现法付息，则实际利率大于5%。", "options": ["对", "错"], "answer": [1], "explain": "按贴现法付息，企业可以利用的贷款只是本金减去利息部分后的差额，因此，贷款的实际利率要高于名义利率5%。"},
      {"type": "single", "year": "", "title": "某企业年初从银行贷款100万元，期限1年，年利率为10%，按照贴现法付息，则年末应偿还的金额为(    )万元。", "options": ["70", "90", "100", "110"], "answer": [2], "explain": "贴现法是银行向企业发放贷款时，先从本金中扣除利息部分，在贷款到期时借款企业再偿还全部本金的一种计息方法。"},
      {"type": "single", "year": "", "title": "甲公司向银行借款900万元，年利率为8%，期限1年，到期还本付息，银行要求按借款金额的15%保持补偿性余额(银行按2%支付利息)。该借款的实际利率是(    )。", "options": ["7.70%", "9.06%", "9.41%", "10.10%"], "answer": [1], "explain": "由于年利息支出＝900×8%＝72(万元)，年利息收入＝900×15%×2%＝2.7(万元)，实际可使用的资金＝900×(1－15%)＝765(万元)，所以，该借款的实际利率＝(72－2.7)/765×100%＝9.06%。"},
      {"type": "single", "year": "", "title": "甲公司与乙银行签订一份周转信用协议，协议约定：年度信贷最高限额为800万元，借款利率为6%，承诺费率为0.5%。同时乙银行要求保留15%的补偿性余额。甲公司年度实际借款500万元，则该笔借款的实际年利率是(   )。", "options": ["7.41%", "7.06%", "6.20%", "6.30%"], "answer": [0], "explain": "公司应向银行支付的承诺费＝(800－500)×0.5%＝1.5(万元)，借款利息＝500×6%＝30(万元)，公司可动用的借款额＝500－500×15%＝425(万元)，因此该笔借款的有效年利率＝(1.5＋30)/425≈7.41%。"},
      {"type": "single", "year": "", "title": "A公司借入名义年利率为6%的银行借款8 000万元，分12个月等额偿还本息，则按照加息法计算的该借款的实际年利率为(    )。", "options": ["12%", "6.09%", "4%", "0.5%"], "answer": [0], "explain": "采用加息法时，贷款本金分期均衡偿还，借款企业实际上只是平均使用了贷款本金的一半，却支付了全额利息。这样企业所负担的实际利率大约为名义利率的2倍。"},
      {"type": "single", "year": "", "title": "某公司拟使用短期借款进行筹资。下列借款条件中，不会导致实际年利率高于名义利率的是(    )。", "options": ["按贷款一定比例在银行保持补偿性余额", "按贴现法支付银行利息", "按收款法支付银行利息", "按加息法支付银行利息"], "answer": [2], "explain": "对于借款企业来说，补偿性余额会提高借款的实际利率，选项A错误；贴现法会使贷款的实际利率高于名义利率，选项B错误；收款法下实际利率等于名义利率，选项C正确；加息法会使企业的实际利率高于名义利率大约1倍，选项D错误。"},
      {"type": "single", "year": "2023", "title": "在我国，关于短期融资券，下列表述错误的是(   )。", "options": ["短期融资券不向社会公众发行和交易", "发行人为具有一定信用等级的非金融企业", "短期融资券是一种直接融资方式", "短期融资券是一种有担保短期本票"], "answer": [3], "explain": "短期融资券是电企业依法发行的无担保短期本票，选项D错误。"},
      {"type": "single", "year": "", "title": "下列关于短期融资券筹资的表述中，不正确的是(    )。", "options": ["发行对象为公众投资者", "发行条件比短期银行借款苛刻", "筹资成本比公司债券低", "一次性筹资数额比短期银行借款大"], "answer": [0], "explain": "短期融资券只能在银行间债券市场发行和交易，并不面向公众投资者，所以选项A的表述不正确。"},
      {"type": "single", "year": "2023", "title": "下列各项中，不属于商业信用筹资方式的是(   )。", "options": ["预收货款", "预付货款", "应付账款", "应付票据"], "answer": [1], "explain": "商业信用的形式包括应付账款、应付票据、预收货款、应计未付款。选项B不属于商业信用筹资方式。"},
      {"type": "judge", "year": "2019", "title": "企业利用商业信用筹资比较机动、灵活，而且期限较短，不会恶化企业的信用水平。", "options": ["对", "错"], "answer": [1], "explain": "商业信用的期限短，还款压力大，对企业现金流量管理的要求很高。如果长期和经常性地拖欠账款，会造成企业的信誉恶化。"},
      {"type": "single", "year": "", "title": "甲公司按“2/20、N/40”的信用条件购进材料一批，则该公司放弃现金折扣的机会成本（一年按360天计算）为（  ）。", "options": ["24.49%", "36.73%", "18%", "36%"], "answer": [1], "explain": "放弃现金折扣的机会成本=[2%÷（1－2%）]×[360÷（40－20）]=36.73%。"},
      {"type": "single", "year": "2024", "title": "下列各项中，与放弃现金折扣的信用成本率无关的是(   )。", "options": ["折扣百分比的大小", "赊购金额的大小", "付款期的长短", "折扣期的长短"], "answer": [1], "explain": "放弃现金折扣的信用成本率=[现金折扣率÷(1一现金折扣率）]×[360天÷(付款期一折扣期）]，由此可知，选项A、C、D均与放弃现金折扣的信用成本率有关。选项B当选。"},
      {"type": "single", "year": "2024", "title": "下列关于商业信用筹资的说法中，正确的是（    ）。", "options": ["商业信用筹资不存在筹资成本", "商业信用期限一般较长", "受外部环境影响较小，稳定性较好", "通常不需要第三方担保或者筹资企业用资产进行抵押"], "answer": [3], "explain": "商业信用筹资的缺点:（1）商业信用筹资成本高，如果存在现金折扣，放弃现金折扣的成本较高，选项A不当选;（2）商业信用期限一般较短，容易恶化企业的信用水平，选项B不当选;（3）受外部环境影响较大，选项C不当选。商业信用筹资的优点:（1）商业信用容易获得;（2）企业有较大的机动权;（3）企业一般不用提供担保，即通常不需要第三方担保或者筹资企业用资产进行抵押，选项D当选。"},
      {"type": "judge", "year": "", "title": "与长期负债融资相比，流动负债融资的期限短、成本低，其偿债风险也相对较小。", "options": ["对", "错"], "answer": [1], "explain": "与长期负债融资相比，流动负债融资的期限短，需要持续的重新谈判或滚动安排负债，所以其偿债风险也相对较大。"},
      {"type": "multi", "year": "", "title": "根据我国对短期融资券的相关规定，下列说法正确的有（    ）。", "options": ["与银行借款相比，短期融资券发行条件较为严格", "企业需要为发行的短期融资券提供担保", "短期融资券不得面向社会公众发行和交易", "与企业债券相比，短期融资券的筹资成本较低"], "answer": [0, 2, 3], "explain": "发行短期融资券筹资的特点主要有:（1）筹资成本较低:相对于发行企业债券而言，发行短期融资券的筹资成本较低，选项D当选;（2）筹资数额比较大:相对于银行借款筹资而言，短期融资券一次性的筹资数额比较大;（3）发行条件比较严格:只有具备一定的信用等级的实力强的企业，才能发行短期融资券筹资，选项A当选。短期融资券是由企业依法发行的 无担保 短期本票，选项B不当选。短期融资券发行和交易的对象是银行间债券市场的机构投资者，不向社会公众发行和交易，选项C当选。"},
      {"type": "multi", "year": "", "title": "下列属于商业信用形式的有（    ）。", "options": ["发行短期融资券", "旺季时向银行短期借款", "销售商品，提前收取客户20%款项", "采购商品，给对方开具了一张3个月后到期的汇票"], "answer": [2, 3], "explain": "商业信用的形式包括:应付账款、应付票据、应计未付款和预收货款。销售商品，提前收取客户20%款项属于预收货款;采购商品，给对方开具了一张3个月后到期的汇票属于应付票据。选项C、D当选。"},
      {"type": "single", "year": "", "title": "某公司购货的付款条件为2/20 , N/90，1年按360天计算，该公司放弃现金折扣的信用成本率为（    ）。", "options": ["8.5%", "9.5%", "12.5%", "10.5%"], "answer": [3], "explain": "该公司放弃现金折扣的信用成本率=2%÷(1-2%） ×360÷ (90-20）=10.5%。选项D当选。"},
      {"type": "single", "year": "", "title": "相对于其他流动资金来源，商业信用筹资的优点是（  ）。", "options": ["受外部市场环境影响小", "一般不用提供担保", "有利于提升企业信用水平", "放弃现金折扣的信用成本低"], "answer": [1], "explain": "商业信用筹资的优点:（1）商业信用容易获得;（2）企业有较大的机动权;（3）企业一般不用提供担保。商业信用筹资的缺点:（1）商业信用筹资成本高;（2）容易恶化企业的信用水平;（3）受外部环境影响较大，选项B当选。"},
      {"type": "single", "year": "", "title": "下列筹资方式中，由企业之间商品或劳务交易活动形成的，能够作为企业短期资金经常性来源的是（     ）。", "options": ["租赁", "留存收益", "短期借款", "商业信用"], "answer": [3], "explain": "商业信用是指企业在商品或劳务交易中， 以延期付款或预收货款方式 进行购销活动而形成的借贷关系， 是企业之间的直接信用行为， 也是企业短期资金 的重要来源，选项 D 当选。"},
      {"type": "judge", "year": "", "title": "由于商业信用筹资无需支付利息，所以不属于债务筹资。", "options": ["对", "错"], "answer": [1], "explain": "商业信用，是指企业之间在商品或劳务交易中，由于延期付款或延期交货所形成的借贷信用关系，是一种债务筹资方式。"},
      {"type": "multi", "year": "", "title": "商业信用作为企业短期资金的一种来源，主要表现形式有（    ）。", "options": ["应付票据", "季节性周转贷款", "应付账款", "预收账款"], "answer": [0, 2, 3], "explain": "商业信用的形式:应付账款、应付票据、预收货款和应计未付款。"},
      {"type": "multi", "year": "", "title": "在我国，关于短期融资券，正确的有（    ）。", "options": ["相对于银行借款，其信用等级要求较高", "相对于商业信用，其偿还方式比较灵活", "相对于企业债券，其筹资成本较高", "相对于银行借款，其一次性筹资金额较大"], "answer": [0, 3], "explain": "商业信用，企业能够根据需要，选择决定筹资的金额大小和期限长短，比短期融资券更加灵活，甚至如果在期限内不能付款或交货时，一般还可以通过与客户的协商，请求延长时限。选项B不当选。相对于发行公司债券筹资而言，发行短期融资券的筹资成本较低。选项C不当选。"},
      {"type": "single", "year": "", "title": "某企业向银行借款500万元，利率为5.4%，银行要求10%的补偿性余额，则该借款的实际利率是（ ）。", "options": ["6%", "5.4%", "4.86%", "4.91%"], "answer": [0], "explain": "借款的实际利率=5.4%/（1－10%）=6%或借款的实际利率=500×5.4%/[500×（1-10%）]=6%。"},
      {"type": "multi", "year": "", "title": "在确定因放弃现金折扣而发生的信用成本时，需要考虑的因素有（    ）。", "options": ["数量折扣百分比", "现金折扣百分比", "折扣期", "信用期"], "answer": [1, 2, 3], "explain": "放弃折扣的信用成本率=折扣百分比/（1－折扣百分比）×360/（信用期－折扣期），这里的折扣百分比是指现金折扣百分比，而不是数量折扣百分比。"},
      {"type": "multi", "year": "", "title": "在确定目标现金余额的存货模型中，需要考虑的相关现金成本有（    ）。", "options": ["机会成本", "短缺成本", "管理成本", "交易成本"], "answer": [0, 3], "explain": "存货模型的现金成本包括机会成本和交易成本，有现金需要时，可以通过出售有价证券换回现金，或者从银行借入资金，所以不存在短缺成本;而管理成本属于固定成本，不属于需要考虑的相关成本。"},
